name: Operator submissions

# 운영자 셀프 등록(사이트 폼 → Supabase public.operator_submission) 중 소유자가 APPROVED로 바꾼 것만
# registry/operator-submissions.json(연락처·이름 제외)으로 내보낸다. 다음 Data sync가 사실 저장소(OPERATOR 등급)에 반영한다.
# 표는 db/015_operator_submission.sql — main의 Data sync(db:migrate)가 적용한다. 표가 없으면 건너뛴다.
on:
  schedule:
    - cron: "50 17 * * *" # 02:50 KST (Data sync 03:17 KST 전)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}  # land-on-main.sh (gh)

concurrency:
  group: operator-submissions
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Export approved submissions (no contact data)
        run: node scripts/export-operator-submissions.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL || vars.DATABASE_SSL }}
      - name: Commit
        working-directory: .
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/registry/operator-submissions.json
          git add camping-atlas/public/explore/data/takedowns.json camping-atlas/public/explore/data/operator-verified.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "chore(data): export approved operator submissions"
          bash "$GITHUB_WORKSPACE/.github/scripts/land-on-main.sh" operator-submissions
