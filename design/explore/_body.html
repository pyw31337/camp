<!--SITE_HEADER-->
<div class="bar"><div class="wrap">
  <div class="qrow"><label class="q"><svg class="i" aria-hidden="true"><use href="#l-search"/></svg><input id="q" type="search" placeholder="캠핑장 이름·지역 검색" autocomplete="off" enterkeyhint="search"><button class="clear" id="clearQ" type="button" aria-label="검색어 지우기"><svg class="i i-sm" aria-hidden="true"><use href="#l-x"/></svg></button></label><button class="near-btn" id="nearBtn" type="button" aria-pressed="false"><svg class="i i-sm" aria-hidden="true"><use href="#l-locate-fixed"/></svg><span>내 주변</span></button></div>
  <section class="availability-query" aria-label="공식 접수 상태로 날짜 검색">
    <div class="availability-copy"><b><svg class="i i-sm" aria-hidden="true"><use href="#l-calendar-check"/></svg>날짜별 공식 접수 상태</b><small>잔여 사이트 수는 공식 예약처에서 최종 확인</small></div>
    <label>입실 <input id="checkIn" type="date" aria-label="입실 날짜"></label>
    <label>퇴실 <input id="checkOut" type="date" aria-label="퇴실 날짜"></label>
    <button class="availability-run" id="availabilityRun" type="button"><svg class="i i-sm" aria-hidden="true"><use href="#l-search"/></svg>공식 접수 검색</button>
    <button class="availability-clear" id="availabilityClear" type="button" hidden>초기화</button>
    <div class="availability-notice" id="availabilityNotice" aria-live="polite"></div>
  </section>
  <div class="chips" id="areaChips"></div>
  <div class="chips" id="sggChips" hidden></div>
  <div class="chips" id="filterChips"></div>
</div></div>
<main class="layout">
  <section class="list-col" aria-label="캠핑장 목록">
    <div class="results-head"><h1 id="resultTitle">캠핑장 불러오는 중</h1><span class="faint" id="resultSub"></span>
      <label class="sort"><svg class="i i-sm" aria-hidden="true"><use href="#l-arrow-up-down"/></svg><select id="sort" aria-label="정렬"><option value="best">추천순</option><option value="name">이름순</option><option value="near">가까운 순</option><option value="fee">요금 낮은 순</option></select></label></div>
    <div id="hub"></div>
    <div class="cards" id="cards"></div>
    <button class="more-btn" id="moreBtn" type="button" hidden></button>
  </section>
  <aside class="map-col" aria-label="지도"><div id="map"></div></aside>
</main>
<button class="mobile-switch" id="viewSwitch" type="button"><svg class="i i-sm" aria-hidden="true"><use href="#l-map"/></svg>지도 보기</button>
<div id="sheetRoot"></div>
<!--SITE_TABBAR-->
