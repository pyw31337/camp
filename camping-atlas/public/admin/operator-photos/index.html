<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>렛츠 캠핑 · 운영자 사진 검수(미리보기)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ink:#1b241c; --muted:#5c6b5e; --bg:#f5f6f4; --paper:#fff; --line:#d5ddd2; --accent:#2f5d32; --warn:#8a5a10; --bad:#8a2b1d; --ok:#1e5a28; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .opa { width: min(1080px, 100%); margin: 0 auto; padding: 20px 16px 64px; min-width: 0; }
  .opa-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .opa-head h1 { margin: 0; font: 800 1.25rem/1.3 inherit; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; word-break: keep-all; }
  .opa-lead, .opa-banner, .opa-meta, .opa-done, figcaption { overflow-wrap: anywhere; word-break: keep-all; }
  .opa-lead { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
  .opa-banner { padding: 10px 12px; border-radius: 10px; background: #fff6d8; color: #5a4a10; font-size: .85rem; margin-bottom: 16px; }
  .opa-ico { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -.15em; }
  .opa-btn { appearance: none; border: 0; border-radius: 999px; padding: 9px 14px; font: 700 .88rem/1.2 inherit; background: var(--accent); color: #fff; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .opa-btn--ghost { background: #e8f0e4; color: var(--ink); }
  .opa-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; min-width: 0; }
  .opa-card-h h2 { margin: 0 0 6px; font: 800 1.05rem/1.35 inherit; overflow-wrap: anywhere; }
  .opa-id { font-weight: 600; color: var(--muted); font-size: .85rem; }
  .opa-meta { margin: 0 0 4px; color: var(--muted); font-size: .85rem; }
  .opa-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 12px 0; }
  @media (max-width: 360px) { .opa-photos { grid-template-columns: 1fr; } }
  .opa-ph { margin: 0; min-width: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .opa-ph img { display: block; width: 100%; height: 120px; object-fit: cover; }
  .opa-ph figcaption { padding: 8px; font-size: .78rem; }
  .opa-badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font: 700 .7rem/1.3 inherit; }
  .opa-badge--ok { background: #e3f5e5; color: var(--ok); }
  .opa-badge--no { background: #fde8e4; color: var(--bad); }
  .opa-badge--warn { background: #fff0d0; color: var(--warn); }
  .opa-note-lab { display: block; font: 650 .82rem/1.4 inherit; color: var(--muted); min-width: 0; }
  .opa-note-lab textarea { display: block; width: 100%; max-width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); font: 400 .9rem/1.4 inherit; resize: vertical; }
  .opa-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opa-done { margin: 10px 0 0; color: var(--ok); font-size: .9rem; }
  .opa-empty { padding: 24px 8px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main class="opa">
    <div class="opa-head">
      <h1><svg class="opa-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 5h-2.5l-1.2-1.8A2 2 0 0 0 14.7 2H9.3a2 2 0 0 0-1.6 1.2L6.5 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-8 13.2A4.7 4.7 0 1 1 16.7 13.5 4.7 4.7 0 0 1 12 18.2Z"/></svg> 운영자 사진 검수</h1>
      <button type="button" class="opa-btn opa-btn--ghost" data-refresh>다시 읽기</button>
    </div>
    <p class="opa-banner">미리보기입니다. 비밀번호가 없고, 이 브라우저에 저장된 대기열만 봅니다. 승인해 도 실제 사이트 갤러리에는 붙지 않아요. 운영에서는 관리자 인증과 서버 저장소가 필요합니다.</p>
    <p class="opa-lead">운영자가 올린 사이트(상품) 사진은 자동 판정(파일 형식·크기·비율·서류·광고 필터)을 거친 뒤, 여기서 승인한 것만 공개합니다. CLIP 기반 site-photo-classify는 운영 파이프라인에서 이어집니다.</p>
    <p class="opa-empty" data-empty>대기 중인 사진이 없어요. 상세 페이지나 <a href="../../operator/upload.html?id=100193">사진 올리기 미리보기</a>에서 먼저 올려 주세요.</p>
    <div data-list></div>
  </main>
  <script type="module">
    import { start } from "./admin.js";
    start();
  </script>
</body>
</html>
