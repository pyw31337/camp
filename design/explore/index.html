/* ---------- 탐색 화면 ---------- */

.availability-query { display: grid; grid-template-columns: minmax(11rem, 1fr) minmax(8rem, .62fr) minmax(8rem, .62fr) auto auto; align-items: stretch; gap: 6px; padding: 8px; border: 1px solid color-mix(in srgb, var(--green) 25%, var(--line)); border-radius: var(--r-2); background: color-mix(in srgb, var(--green-tint) 52%, var(--surface)); }

/* 캠핑장 찾기는 브라우저 가로폭을 모두 쓴다: 넓을수록 목록 카드가 여러 열로 늘고 지도는 오른쪽에 고정 폭 */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 0; }

.cards { display: grid; gap: 12px; }
.card { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: var(--r-2); background: var(--surface); box-shadow: var(--shadow-1); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }

.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { min-width: 0; display: grid; gap: 5px; align-content: start; }
.card-title { display: flex; align-items: center; gap: 6px; min-width: 0; }

.tags { display: flex; gap: 4px; flex-wrap: wrap; max-height: 52px; overflow: hidden; }
.tag { display: inline-flex; align-items: center; gap: 4px; min-height: 1.5rem; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; }
.tag-green { background: var(--green-tint); color: var(--green-press); }
.tag-dark { background: var(--forest); color: var(--on-forest); }
.price { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.more-btn { margin: 16px auto 0; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 2.875rem; width: 100%; max-width: 320px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; white-space: nowrap; }
.empty { padding: 48px 16px; text-align: center; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }

/* 상세 시트 */
.sheet { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-columns: 1fr minmax(0, 560px); min-height: 0; }
.sheet-scrim { background: var(--scrim); }
/* 상세가 열린 동안 세로 스크롤 소유자는 이 패널 하나다. */
.sheet-panel { min-height: 0; height: 100%; background: var(--bg); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; box-shadow: var(--shadow-2); }
.sheet-close { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px 12px; background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent)); }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-1); }
.d-hero { margin: -60px 0 0; height: 260px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); overflow: hidden; position: relative; }
.d-hero img { width: 100%; height: 100%; object-fit: cover; }
.d-hero .credit { position: absolute; right: 10px; bottom: 8px; font-size: var(--fs-2xs); color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.d-body { padding: 18px 20px 120px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.d-title h2 { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -0.04em; }

.act { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

.btn-primary { background: var(--green); color: var(--on-green); }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.pre { white-space: pre-line; font-size: var(--fs-base); }

.mobile-switch { display: none; }

}
/* 관심·공유·소개 */
.d-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
button.act { font: inherit; font-size: var(--fs-xs); cursor: pointer; }
.act[aria-pressed="true"] { color: var(--forest); border-color: var(--forest); }

.next li b { display: inline-flex; min-height: 2rem; align-items: center; padding: 0 10px; border-radius: 999px; background: var(--ember-tint); color: var(--ember); font-size: var(--fs-sm); font-weight: 800; white-space: nowrap; }
.warn { color: var(--ember); }
.link-row { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); font-weight: 700; color: var(--green-press); }
.seg-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.seg-tabs::-webkit-scrollbar { display: none; }
.seg-tabs button { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 2.25rem; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.seg-tabs button[aria-selected="true"] { background: var(--forest); border-color: var(--forest); color: var(--on-forest); font-weight: 700; }
.near-list { display: grid; }

.link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); gap: 8px; }
.link-tile { display: flex; align-items: center; gap: 8px; min-height: 3rem; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; min-width: 0; }

.review { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.review b { font-size: var(--fs-base); font-weight: 700; }
.review p { font-size: var(--fs-sm); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.d-cta { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }

.back-btn { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 2.5rem; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); box-shadow: var(--shadow-1); font: inherit; font-size: var(--fs-sm); font-weight: 800; color: var(--ink); cursor: pointer; white-space: nowrap; }

.photo-grid-external { grid-template-columns: repeat(auto-fill, minmax(6.5rem, 8rem)); justify-content: start; }

/* 예약 경로·공식 원문: 단일 “예약하기”가 아닌 근거가 있는 선택지를 한눈에 보여 준다. */

/* 정보 밀도를 수치·아이콘으로 보여 주는 시설 스냅샷과 상품 구성. 평점/재고를 뜻하지 않는다. */
.signal-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.signal-strip > div { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 9px 8px; border-radius: 12px; color: var(--green-press); background: linear-gradient(145deg, var(--green-tint), var(--surface)); border: 1px solid color-mix(in srgb, var(--green) 20%, var(--line)); }
.signal-strip span { grid-row: 1 / 3; width: 1.8rem; height: 1.8rem; display: grid; place-items: center; border-radius: 9px; background: var(--surface); }
.signal-strip b { font-size: var(--fs-lg); line-height: 1; font-weight: 900; color: var(--ink); }
.signal-strip small { font-size: var(--fs-2xs); color: var(--ink-2); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.product-catalog { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: 7px; }
.catalog-tile { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; gap: 1px 7px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.catalog-tile > span { grid-row: 1 / 3; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 10px; color: var(--green-press); background: var(--surface); }
.catalog-tile b { font-size: var(--fs-sm); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.catalog-tile strong { font-size: var(--fs-xs); color: var(--ink-2); }

/* 주변 정보: 원천 사진이 있을 때만 사진으로, 없으면 시설 유형 아이콘으로 표현한다. */
.near-list { gap: 8px; }
.near-card { display: grid; grid-template-columns: 4.25rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.near-visual { align-self: stretch; min-height: 4.25rem; overflow: hidden; border-radius: 10px; background: var(--surface); }
.near-visual img { display: block; width: 100%; height: 100%; min-height: 4.25rem; object-fit: cover; }
.near-visual.no-photo { display: grid; place-items: center; color: var(--green-press); background: linear-gradient(145deg, var(--green-tint), var(--surface)); }
.poi-visual { display: grid; place-items: center; }
.near-copy { display: grid; gap: 7px; min-width: 0; }
.near-copy > div { display: grid; min-width: 0; }
.near-copy b { font-size: var(--fs-base); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.near-copy small { font-size: var(--fs-2xs); color: var(--ink-3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.near-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.near-actions a, .near-actions button { display: inline-flex; align-items: center; gap: 3px; min-height: 1.75rem; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); font: inherit; font-size: var(--fs-2xs); font-weight: 800; text-decoration: none; white-space: nowrap; }
.near-actions button { color: var(--green-press); }
.near-card > .m { align-self: start; padding-top: 2px; font-size: var(--fs-sm); font-weight: 900; color: var(--ink-2); white-space: nowrap; }
.roadview-slot { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.roadview-slot > .note { padding: 10px; }
.roadview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; }
.roadview-head b, .roadview-empty b { font-size: var(--fs-sm); font-weight: 800; }
.roadview-canvas { width: 100%; height: 15rem; background: var(--surface); }
.roadview-empty { display: grid; gap: 8px; padding: 14px; }
.roadview-empty p { font-size: var(--fs-sm); color: var(--ink-2); }

/* 정보 탐색을 독려하되 예약·결제를 게임화하지 않는 로컬 패스포트. */
.passport-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 11px; border-radius: 14px; color: var(--on-forest); background: linear-gradient(135deg, #173f2e, #276a49); }
.passport-head > span { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: 12px; color: var(--forest); background: #f5d878; }
.passport-head b { font-size: var(--fs-base); font-weight: 900; }
.passport-head p { font-size: var(--fs-xs); color: color-mix(in srgb, var(--on-forest) 75%, transparent); line-height: 1.4; }
.passport-head a { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); font-weight: 800; color: var(--on-forest); white-space: nowrap; }
.passport-marks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.passport-marks > div { display: flex; gap: 7px; min-width: 0; padding: 9px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink-3); background: var(--surface-2); }
.passport-marks > div.done { color: var(--green-press); border-color: color-mix(in srgb, var(--green) 35%, var(--line)); background: var(--green-tint); }
.passport-marks span { display: grid; min-width: 0; }
.passport-marks b { font-size: var(--fs-xs); font-weight: 800; color: var(--ink); }
.passport-marks small { font-size: var(--fs-2xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) {
  .booking-path { grid-template-columns: auto minmax(0, 1fr) auto; }
  .booking-path em { grid-column: 2; justify-self: start; }
  .booking-path-go { grid-column: 3; grid-row: 1 / 3; }
  .signal-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .passport-marks { grid-template-columns: minmax(0, 1fr); }
  .near-card { grid-template-columns: 3.75rem minmax(0, 1fr); }
  .near-visual, .near-visual img { min-height: 3.75rem; }
  .near-card > .m { grid-column: 2; grid-row: 1; justify-self: end; }
  .near-copy { grid-column: 2; }
  .roadview-head { align-items: flex-start; flex-direction: column; }
}

/* 공통 헤더 아래 정렬 · 모바일 하단 탭 위로 지도/목록 전환 버튼 */
@media (max-width: 760px) { .mobile-switch { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } .map-col { bottom: calc(64px + env(safe-area-inset-bottom, 0px)) !important; } }
/* 상세 페이지도 공통 헤더(위)·하단 탭(모바일) 사이에 열린다 */
.sheet { top: var(--top, 64px); z-index: 60; }
@media (max-width: 760px) { .sheet { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } }
/* 사이트 목록·후기 속 요금·배치도 */
.site-table { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.st-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); font-size: var(--fs-base); }
.st-row:first-child { border-top: 0; }
.st-head { background: var(--surface-2); font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); }
.st-row span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
.st-row b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-row .num { font-weight: 900; white-space: nowrap; }
.price-range { font-size: var(--fs-sm); color: var(--ink-2); }
.price-range b { font-size: var(--fs-lg); color: var(--ink); font-weight: 900; }
.mentions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 8px; }
.mention { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: inherit; text-decoration: none; min-width: 0; }
.m-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.m-top b { font-size: var(--fs-md); font-weight: 900; }
.m-top em, .m-top i { font-style: normal; font-size: var(--fs-2xs); font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.mention q { font-size: var(--fs-xs); color: var(--ink-2); quotes: "“" "”"; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mention small { font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 12rem), 1fr)); gap: 8px; }
.layout-grid a { position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.layout-grid img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.layout-grid em { position: absolute; left: 6px; top: 6px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: var(--fs-2xs); font-style: normal; font-weight: 700; }
.layout-posts { display: grid; gap: 4px; }
.layout-posts .link-row { display: flex; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 후기 속 요금: 시기별 대표 구간(N만원대) */
.price-bands { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.price-bands span { display: grid; gap: 1px; min-width: 6.5rem; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); }
.price-bands small { color: var(--ink-2); font-size: var(--fs-2xs); font-weight: 700; }
.price-bands b { font-size: var(--fs-md); font-weight: 900; color: var(--ink); }
.price-bands i { color: var(--ink-3); font-size: var(--fs-2xs); font-style: normal; }
/* 공식 사진이 없을 때 쓰는 검색 사진 썸네일(Daum 검색 제공) */
.thumb.snap { position: relative; }
.snap-tag { position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: var(--fs-2xs); font-style: normal; font-weight: 700; white-space: nowrap; }

/* ===================== 상세 v2 (2026-10-14) =====================
   간격은 8의 배수(4·8·12·16·24·32). 섹션 = 흰 카드(안쪽 여백 --pad), 섹션 사이 16px.
   가로 레일은 카드 안쪽 여백만큼 밖으로 넓혀 첫 항목이 제목과 같은 선에서 시작한다. */
.dv { --pad: 24px; gap: 16px; padding-top: 20px; }
@media (max-width: 640px) { .dv { --pad: 16px; gap: 12px; } }
.dv-sec { --pad: inherit; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: var(--pad); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; scroll-margin-top: 3.75rem; min-width: 0; }
.dv-sec > h3 { display: flex; align-items: center; gap: 6px; font-size: var(--fs-lg); font-weight: 800; letter-spacing: -0.03em; color: var(--heading); white-space: nowrap; }
.dv-sec > h3 .num, .dv-sub h4 .num { color: var(--ink-3); font-weight: 700; }
.dv-sub { display: grid; gap: 12px; min-width: 0; }
.dv-sub h4 { display: flex; align-items: center; gap: 6px; font-size: var(--fs-md); font-weight: 750; letter-spacing: -0.02em; white-space: nowrap; }
.dv-sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dv-empty { font-size: var(--fs-sm); color: var(--ink-3); }
.dv .pre { font-size: var(--fs-sm); color: var(--ink-2); white-space: pre-line; }

/* (i) 출처 버튼과 말풍선 */
.tip { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; margin-left: 2px; border-radius: 50%; color: var(--ink-3); flex: none; }
.tip:hover, .tip:focus-visible { background: var(--surface-2); color: var(--ink); }
.tip .i-xs { width: 15px; height: 15px; }
.tip-pop { position: fixed; z-index: 120; padding: 12px 14px; border-radius: 14px; background: #1c2621; color: #eef3f0; font-size: var(--fs-xs); line-height: 1.55; box-shadow: 0 12px 32px rgba(0,0,0,.28); display: grid; gap: 6px; }
.tip-pop p { margin: 0; white-space: normal; }
.tip-pop a { color: #8fe0b3; text-decoration: underline; }

/* 사진 모자이크: 넓으면 1(큰)+4, 좁으면 가로로 넘기는 슬라이드 */
.dv-hero { position: relative; max-width: 880px; margin: -3.75rem auto 0; display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px; height: clamp(260px, 38vw, 440px); padding: 0; border-radius: 0 0 20px 20px; overflow: hidden; background: var(--surface-2); }
.dv-hero-empty { display: grid; place-items: center; color: var(--ink-3); grid-template-columns: 1fr; }
.dv-shot { position: relative; display: block; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.dv-shot img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.dv-shot:hover img { transform: scale(1.03); }
.dv-shot:first-child { grid-row: 1 / span 2; }
.dv-shot:nth-child(n+6) { display: none; }
.dv-shot.sm img { image-rendering: auto; filter: saturate(1.05); }
.dv-hero.few { grid-template-columns: 1fr 1fr; }
.dv-hero.few .dv-shot:first-child:last-of-type { grid-column: 1 / -1; }
.dv-all { position: absolute; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 6px; min-height: 2.5rem; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.94); color: #17211c; font-size: var(--fs-sm); font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; }
@media (min-width: 1081px) { .dv-hero { margin-top: 0; border-radius: 20px; width: calc(100% - 48px); } }
@media (max-width: 720px) {
  .dv-hero { display: flex; height: clamp(240px, 70vw, 360px); gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 0; }
  .dv-hero::-webkit-scrollbar { display: none; }
  .dv-shot { flex: 0 0 100%; scroll-snap-align: start; }
  .dv-shot:nth-child(n+6) { display: block; }
  .dv-all { position: sticky; left: auto; right: 12px; bottom: 12px; align-self: flex-end; flex: none; margin-left: -10.5rem; }
}

/* 제목 · 한눈에 · 행동 버튼 */
.dv-title { display: grid; gap: 6px; padding: 0 4px; }
.dv-title h2 { font-size: var(--fs-2xl); font-weight: 850; letter-spacing: -0.04em; line-height: 1.25; }
.dv-line { font-size: var(--fs-md); color: var(--ink-2); }
.dv-loc { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); color: var(--ink-3); white-space: nowrap; }
.dv-themes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 4px; }
.dv-themes::-webkit-scrollbar { display: none; }
.dv-themes button { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 2rem; padding: 0 12px; border-radius: 999px; background: var(--green-tint); color: var(--green-press); font-size: var(--fs-xs); font-weight: 750; white-space: nowrap; }
.dv-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: 8px; }
.dv-stats > div { display: grid; justify-items: center; gap: 2px; padding: 14px 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: center; min-width: 0; }
.dv-stats span { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; margin-bottom: 4px; border-radius: 12px; background: var(--green-tint); color: var(--green-press); }
.dv-stats b { font-size: var(--fs-lg); font-weight: 850; letter-spacing: -0.03em; white-space: nowrap; }
.dv-stats small { font-size: var(--fs-2xs); color: var(--ink-3); font-weight: 650; white-space: nowrap; }
@media (max-width: 640px) {
  .dv-stats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .dv-stats::-webkit-scrollbar { display: none; }
  .dv-stats > div { flex: 0 0 5.75rem; padding: 12px 6px 10px; }
  .dv-stats span { width: 2.25rem; height: 2.25rem; border-radius: 10px; }
  .dv-stats b { font-size: var(--fs-md); }
}
/* 사진이 적으면(또는 불러오지 못해 빠지면) 격자를 줄인다 */
.dv-hero:not(:has(.dv-shot:nth-of-type(2))) { grid-template-columns: 1fr; }
.dv-hero:not(:has(.dv-shot:nth-of-type(2))) .dv-shot:first-child { grid-row: 1 / -1; }
.dv-hero:has(.dv-shot:nth-of-type(2)):not(:has(.dv-shot:nth-of-type(4))) { grid-template-columns: 2fr 1fr; }
.dv-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dv-actions > * { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-xs); font-weight: 700; color: var(--ink); white-space: nowrap; }
.dv-actions [aria-pressed="true"] { color: #e0457b; border-color: #f6c5d6; background: #fff3f7; }
.dv-actions [aria-disabled="true"] { color: var(--ink-3); }
.dv-nav { margin: 0 calc(-1 * var(--pad)); padding: 8px var(--pad); }

/* 예약 카드 */
.dv-book { border: 0; background: linear-gradient(160deg, var(--forest), #21583d); color: var(--on-forest); }
.dv-book > h3 { color: #fff; }
.dv-book-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.dv-dday { display: flex; align-items: center; gap: 14px; flex: 1 1 16rem; min-width: 0; }
.dv-dday > b { display: grid; place-items: center; min-width: 4.5rem; height: 4.5rem; padding: 0 10px; border-radius: 18px; background: #fff; color: var(--forest); font-size: var(--fs-xl); font-weight: 900; letter-spacing: -0.04em; white-space: nowrap; }
.dv-dday.none > span:first-child { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 16px; background: rgba(255,255,255,.14); }
.dv-dday > span:last-child { display: grid; gap: 2px; min-width: 0; }
.dv-dday small { font-size: var(--fs-2xs); color: rgba(255,255,255,.72); font-weight: 650; }
.dv-dday strong { font-size: var(--fs-lg); font-weight: 850; white-space: nowrap; }
.dv-dday em { font-style: normal; font-size: var(--fs-xs); color: rgba(255,255,255,.8); }
.dv-go { flex: 1 1 12rem; min-height: 3.25rem; background: #fff !important; color: var(--forest) !important; font-weight: 850; }
.dv-book .dv-chips span { background: rgba(255,255,255,.12); color: #fff; border-color: transparent; }
.dv-book .dv-chips span.on { background: #fff; color: var(--forest); }
.dv-book .sub, .dv-book .booking-path, .dv-book .rule, .dv-book .next-list li { color: var(--ink); }
.dv-more { border-radius: 14px; background: var(--surface-2); color: var(--ink); }
.dv-book .dv-more { background: rgba(255,255,255,.96); }
.dv-more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 3rem; padding: 0 16px; font-size: var(--fs-sm); font-weight: 750; cursor: pointer; white-space: nowrap; }
.dv-more > summary::-webkit-details-marker { display: none; }
.dv-more > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-right: 4px; transition: transform .2s; }
.dv-more[open] > summary::after { transform: rotate(-135deg); }
.dv-more > :not(summary) { margin: 0 16px 16px; }
.dv-book .sub { border-top: 0; padding-top: 0; }

/* 공통 칩 */
.dv-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dv-chips > * { display: inline-flex; align-items: center; gap: 4px; min-height: 2rem; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-xs); font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.dv-chips.links a { color: var(--ink); }
.dv-chips .fl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #9aa69f; }
.dv-chips .fl-GRASS::before { background: #4caf6d; } .dv-chips .fl-DECK::before { background: #b9824d; } .dv-chips .fl-CRUSHED_STONE::before { background: #8d96a0; } .dv-chips .fl-GRAVEL::before { background: #a8a29a; } .dv-chips .fl-SOIL::before { background: #c49a6c; }

/* 이런 곳이에요 */
.dv-good { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 9rem), 1fr)); gap: 8px; }
.dv-good > div { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); min-width: 0; }
.dv-good span { display: grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; border-radius: 10px; background: var(--surface); color: var(--green-press); }
.dv-good b { font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 사이트 타일 */
.dv-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 10rem), 1fr)); gap: 8px; }
.dv-site { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface-2); overflow: hidden; }
.dv-site > span { grid-row: 1 / span 2; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 12px; background: var(--surface); color: var(--green-press); }
.dv-site b { font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-site strong { font-size: var(--fs-xl); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }
.dv-site strong small { margin-left: 2px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); }
.dv-site i { position: absolute; left: 0; bottom: 0; height: 4px; width: var(--w); background: var(--green); border-radius: 0 4px 0 0; }

/* 후기 요금: 범위 막대 */
.dv-range { display: grid; gap: 6px; padding: 16px; border-radius: 16px; background: var(--surface-2); }
.dv-range-bar { position: relative; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #cdebd9, var(--green)); }
.dv-range-bar i { position: absolute; top: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--forest); transform: translateY(-50%); }
.dv-range-ends { display: flex; justify-content: space-between; font-size: var(--fs-sm); font-weight: 800; }
.dv-bands { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 8rem), 1fr)); gap: 8px; }
.dv-bands > div { display: grid; gap: 2px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); }
.dv-bands small { font-size: var(--fs-2xs); color: var(--ink-3); font-weight: 700; white-space: nowrap; }
.dv-bands b { font-size: var(--fs-md); font-weight: 900; white-space: nowrap; }
.dv-bands em { font-size: var(--fs-2xs); color: var(--ink-3); font-style: normal; }

/* 가로 레일(영상·상품): 카드 안쪽 여백만큼 밖으로 → 첫 항목이 제목과 같은 선 */
.dv-rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 2px var(--pad) 4px; scroll-padding-inline: var(--pad); scroll-snap-type: x proximity; }
.dv-rail::-webkit-scrollbar { display: none; }
.dv-rail > * { scroll-snap-align: start; flex: none; }
.dv-video { display: grid; gap: 6px; width: 15rem; text-align: left; align-content: start; }
.dv-video.short { width: 9.5rem; }
.dv-video-img { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #111; }
.dv-video.short .dv-video-img { aspect-ratio: 9 / 16; }
.dv-video-img img { width: 100%; height: 100%; object-fit: cover; }
.dv-video-img i { position: absolute; inset: 0; margin: auto; width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; }
.dv-video-img em { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 999px; background: #ff0033; color: #fff; font-size: var(--fs-2xs); font-style: normal; font-weight: 800; }
.dv-video b { font-size: var(--fs-sm); font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dv-video small { font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-rail .video-frame { width: min(100%, 28rem); flex: 0 0 min(100%, 28rem); }
.dv-product { display: grid; width: 15rem; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); align-content: start; }
.dv-product-img { position: relative; display: block; aspect-ratio: 4 / 3; background: var(--surface-2); cursor: zoom-in; }
.dv-product-img img { width: 100%; height: 100%; object-fit: cover; }
.dv-product-img em { position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: var(--fs-2xs); font-style: normal; font-weight: 800; }
.dv-product > div { display: grid; gap: 4px; padding: 12px 14px 14px; }
.dv-product b { font-size: var(--fs-base); font-weight: 800; }
.dv-product small { font-size: var(--fs-2xs); color: var(--ink-3); }
.dv-product dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
.dv-product dt { font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; }
.dv-product dd { margin: 0; text-align: right; font-size: var(--fs-sm); font-weight: 850; white-space: nowrap; }

/* 사진 격자(방문자·배치도) */
.dv-snaps, .dv-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(31%, 7.5rem), 1fr)); gap: 6px; }
.dv-snaps > button, .dv-thumbs > button { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.dv-snaps img, .dv-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.dv-thumbs img { object-fit: contain; background: #fff; }
.dv-snaps-more { display: grid; place-items: center; background: var(--forest) !important; color: #fff; font-size: var(--fs-lg); }

/* 후기 카드 + 정렬 */
.dv-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.dv-seg button { min-height: 2rem; padding: 0 10px; border-radius: 9px; font-size: var(--fs-xs); font-weight: 750; color: var(--ink-2); white-space: nowrap; flex: none; }
.dv-seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.dv-reviews { display: grid; gap: 4px; }
.dv-review { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 14px; padding: 12px; margin: 0 -12px; border-radius: 16px; align-items: start; }
.dv-review:hover { background: var(--surface-2); }
.dv-review-img { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--green-tint); color: var(--green-press); }
.dv-review-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dv-review-body { display: grid; gap: 4px; min-width: 0; }
.dv-review-body b { font-size: var(--fs-base); font-weight: 750; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dv-review-body p { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dv-review-meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dv-review-meta em { flex: none; padding: 1px 7px; border-radius: 6px; font-size: var(--fs-2xs); font-style: normal; font-weight: 800; white-space: nowrap; }
.dv-review-meta .k-blog { background: #e6f6ec; color: #138a48; } .dv-review-meta .k-cafe { background: #fff1dc; color: #a35c00; } .dv-review-meta .rich { background: #eaf0ff; color: #3657c9; }
.dv-review-meta small { font-size: var(--fs-2xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 시설 숫자 타일 · 규칙 배지 */
.dv-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dv-facts > div { display: grid; justify-items: center; gap: 2px; padding: 16px 8px; border-radius: 16px; background: var(--surface-2); }
.dv-facts span { color: var(--green-press); }
.dv-facts b { font-size: var(--fs-2xl); font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; }
.dv-facts small { font-size: var(--fs-2xs); color: var(--ink-3); font-weight: 700; }
.dv-rules { display: flex; flex-wrap: wrap; gap: 8px; }
.dv-rules span { display: inline-flex; align-items: center; gap: 6px; min-height: 2.25rem; padding: 0 12px; border-radius: 12px; font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; }
.dv-rules .on { background: var(--green-tint); color: var(--green-press); }
.dv-rules .off { background: #fdecec; color: #b3322f; }

/* 사이트별 현장 조건: 원천에 없는 값은 회색으로 남겨 ‘불가’로 오해하지 않게 한다. */
.dv-conditions { gap: 10px; }
.dv-condition-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.dv-condition { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 8px; align-items: start; min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.dv-condition > span { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 10px; color: var(--ink-3); background: var(--surface-2); }
.dv-condition div { min-width: 0; }
.dv-condition small { display: block; font-size: var(--fs-2xs); font-weight: 700; color: var(--ink-3); }
.dv-condition b { display: block; margin-top: 2px; font-size: var(--fs-sm); font-weight: 800; color: var(--ink); line-height: 1.35; }
.dv-condition p { margin-top: 4px; font-size: var(--fs-2xs); line-height: 1.45; color: var(--ink-3); }
.dv-condition.confirmed { border-color: color-mix(in srgb, var(--green) 30%, var(--line)); }
.dv-condition.confirmed > span { color: var(--green-press); background: var(--green-tint); }
.dv-condition.partial > span { color: #9a5b00; background: #fff0d4; }
.dv-condition.unknown { border-style: dashed; }
.dv-important { gap: 12px; border: 1px solid color-mix(in srgb, var(--green) 28%, var(--line)); background: color-mix(in srgb, var(--green-tint) 42%, var(--surface)); }
.dv-important > .dv-sub-head h3 { display: flex; align-items: center; gap: 6px; }
.dv-important-badge { display: inline-flex; align-items: center; min-height: 25px; padding: 3px 8px; border-radius: 999px; color: var(--green-press); background: var(--green-tint); font-size: var(--fs-2xs); font-weight: 800; white-space: nowrap; }
.dv-important-badge.muted { color: var(--ink-3); background: var(--surface-2); }
.dv-important-list { display: grid; gap: 8px; }
.dv-important-list article { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.dv-important-list article > span { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 6px; border-radius: 6px; color: var(--ink-2); background: var(--surface-2); font-size: var(--fs-2xs); font-weight: 800; }
.dv-important-list article.critical > span { color: #9a3900; background: #fff0df; }
.dv-important-list article.high > span { color: #895600; background: #fff5d8; }
.dv-important-list article div { min-width: 0; }
.dv-important-list b { display: block; font-size: var(--fs-sm); color: var(--ink); }
.dv-important-list p { margin-top: 2px; color: var(--ink-2); font-size: var(--fs-sm); line-height: 1.45; }
.dv-important-list a { display: inline-flex; align-items: center; gap: 2px; margin-top: 5px; color: var(--green-press); font-size: var(--fs-2xs); font-weight: 750; }
.dv-important-empty { padding: 11px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); }
.dv-important-empty b { display: block; font-size: var(--fs-sm); color: var(--ink); }
.dv-important-empty p { margin-top: 4px; color: var(--ink-3); font-size: var(--fs-2xs); line-height: 1.5; }
.dv-important-checks { display: flex; flex-wrap: wrap; gap: 6px; }
.dv-important-checks span { padding: 6px 8px; border-radius: 8px; background: var(--surface); color: var(--ink-3); font-size: var(--fs-2xs); }
.dv-important-checks b { margin-right: 4px; color: var(--ink-2); }
@media (max-width: 520px) { .dv-condition-grid { grid-template-columns: 1fr; } }

/* 기본 정보 */
.dv-info { display: grid; gap: 0; }
.dv-info > div { display: grid; grid-template-columns: 2rem 4.5rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.dv-info > div:first-child { border-top: 0; }
.dv-info span { color: var(--ink-3); }
.dv-info small { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; white-space: nowrap; }
.dv-info p { font-size: var(--fs-sm); font-weight: 600; }
@media (max-width: 420px) { .dv-info > div { grid-template-columns: 1.5rem minmax(0, 1fr) auto; } .dv-info small { display: none; } }

/* 주변: 기존 카드 위 간격만 맞춤 */
#sec-near .seg-tabs { margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); }
.dv .box, .dv .sub { border-top: 0; }

/* 라이트박스 */
html.lb-open, html.lb-open body { overflow: hidden; }
.lb { position: fixed; inset: 0; z-index: 200; background: rgba(8, 12, 10, .96); color: #fff; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.lb-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.lb-count { font-size: var(--fs-sm); font-weight: 700; color: rgba(255,255,255,.8); }
.lb-x { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; color: #fff; }
.lb-x:hover { background: rgba(255,255,255,.12); }
.lb-stage { position: relative; overflow: hidden; touch-action: pan-y; cursor: grab; }
.lb-stage:active { cursor: grabbing; }
.lb-track { display: flex; height: 100%; transition: transform .28s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.lb-slide { flex: 0 0 100%; height: 100%; margin: 0; display: grid; place-items: center; align-content: center; gap: 12px; padding: 8px 16px; user-select: none; }
.lb-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; pointer-events: none; }
.lb-slide.small img { width: min(80vw, 320px); max-height: 60vh; object-fit: contain; border-radius: 12px; }
.lb-orig { display: inline-flex; align-items: center; gap: 4px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: var(--fs-sm); font-weight: 700; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; }
.lb-nav:disabled { opacity: .25; }
.lb-prev { left: 16px; } .lb-next { right: 16px; }
.lb-cap { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); text-align: center; font-size: var(--fs-xs); color: rgba(255,255,255,.75); }
.lb-cap a { color: #8fe0b3; }
@media (max-width: 640px) { .lb-nav { display: none; } }
@media (prefers-color-scheme: dark) {
  .dv-actions [aria-pressed="true"] { background: #3a1724; border-color: #6b2a44; }
  .dv-rules .off { background: #3a1716; color: #f19d9a; }
  .dv-condition.partial > span { color: #f0b65a; background: #3a2a10; }
  .dv-review-meta .k-blog { background: #14301f; color: #5cce91; } .dv-review-meta .k-cafe { background: #3a2a10; color: #f0b65a; } .dv-review-meta .rich { background: #1c2547; color: #9db1ff; }
  .dv-all { background: rgba(21,29,25,.92); color: #e6eee9; }
}
/* 왼쪽 위 ‘목록’ 버튼이 떠 있는 폭에서는 목차가 그 뒤에서 시작하도록 비운다 */
@media (max-width: 1080px) { .dv-nav { padding-left: calc(var(--pad) + 5.5rem); } }

/* ===== 공통 사이트 헤더(홈·탐색·상세 동일) — 두 화면이 같은 규칙을 쓴다 ===== */
.gnb { position: sticky; top: 0; z-index: 70; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid #e3e8e2; }
.gnb-in { box-sizing: border-box; width: 100%; max-width: 1240px; height: 64px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 24px; }
.sh-brand { display: inline-flex; align-items: center; gap: 9px; flex: none; color: #173f2e; text-decoration: none; font-size: 1.125rem; font-weight: 900; letter-spacing: -.05em; white-space: nowrap; }
.sh-brand > span { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #1f9d5c; color: #fff; }
.sh-brand svg { width: 20px; height: 20px; }
.sh-nav { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.sh-nav a { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 999px; color: #46594f; text-decoration: none; font-size: .9375rem; font-weight: 700; white-space: nowrap; }
.sh-nav a:hover, .sh-nav a[aria-current="page"] { background: #e8f4ec; color: #17834b; }
.sh-nav svg, .sh-actions svg { width: 18px; height: 18px; flex: none; }
.sh-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
.sh-user { position: relative; }
.sh-badge { display: inline-flex; align-items: center; gap: 7px; height: 38px; max-width: 9.5rem; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid #e3e8e2; background: #fff; color: #17211c; font: inherit; font-size: .9375rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
.sh-badge b { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sh-av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; background: #1f9d5c; color: #fff; font-style: normal; font-size: .8125rem; font-weight: 900; line-height: 1; }
.sh-av.sh-plus { background: #eef1ec; color: #46594f; font-size: 1.1rem; }
.sh-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 80; min-width: 13.5rem; max-width: calc(100vw - 24px); padding: 8px; border-radius: 16px; background: #fff; border: 1px solid #e3e8e2; box-shadow: 0 12px 32px rgba(23,33,28,.16); display: grid; gap: 2px; }
.sh-menu[hidden] { display: none; }
.sh-menu p { margin: 2px 8px 6px; color: #7c8a82; font-size: .75rem; font-weight: 800; }
.sh-menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 8px; border: 0; border-radius: 12px; background: none; color: #17211c; font: inherit; font-size: .9375rem; font-weight: 700; text-align: left; cursor: pointer; white-space: nowrap; }
.sh-menu button:hover, .sh-menu button[aria-current="true"] { background: #f1f7f3; }
.sh-menu small, .sh-ulist small { margin-left: auto; color: #17834b; font-size: .75rem; font-weight: 800; }
.sh-dlg { width: min(30rem, calc(100vw - 24px)); max-height: calc(100dvh - 48px); padding: 0; border: 0; border-radius: 22px; background: #fff; color: #17211c; box-shadow: 0 24px 64px rgba(0,0,0,.25); }
.sh-dlg::backdrop { background: rgba(10,20,15,.45); }
.sh-dlg-in { display: grid; gap: 18px; padding: 18px 20px 22px; }
.sh-dlg svg { width: 18px; height: 18px; flex: none; }
.sh-dlg-head { display: flex; align-items: center; justify-content: space-between; }
.sh-dlg h2 { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: -.03em; }
.sh-dlg h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 800; }
.sh-dlg section > p { margin: 0 0 10px; color: #66766d; font-size: .8125rem; line-height: 1.5; word-break: keep-all; }
.sh-ulist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.sh-ulist li { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 14px; background: #f5f7f4; font-weight: 700; }
.sh-ulist b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-ulist button { margin-left: auto; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #d5ddd6; background: #fff; color: #17211c; font: inherit; font-size: .8125rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
.sh-ulist small + button, .sh-ulist button + button { margin-left: 6px; }
.sh-ulist .sh-del { color: #b4442c; }
.sh-add { display: flex; gap: 8px; }
.sh-add input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #d5ddd6; background: #fff; color: inherit; font: inherit; }
.sh-add button { display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #1f9d5c; color: #fff; font: inherit; font-weight: 800; cursor: pointer; white-space: nowrap; }
.sh-add svg { width: 16px; height: 16px; }
.sh-seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #eef1ec; }
.sh-seg button { min-height: 40px; padding: 0 4px; border: 0; border-radius: 10px; background: none; color: #46594f; font: inherit; font-size: .875rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
.sh-seg button[aria-checked="true"] { background: #fff; color: #17834b; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.sh-icon { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid #e3e8e2; background: #fff; color: #17211c; text-decoration: none; cursor: pointer; }
.sh-icon b { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; display: grid; place-items: center; background: #1f9d5c; color: #fff; font-size: .6875rem; font-weight: 800; }
.gnb-wide .gnb-in { max-width: none; padding: 0 clamp(16px, 2.5vw, 40px); }
/* 모바일 하단 탭(홈·탐색 동일) */
.gnb-tabbar { display: none; }
@media (max-width: 760px) {
  .gnb-in { height: 56px; gap: 8px; }

<script type="module">

const dayValue = (value) => /^\d{4}-\d{2}-\d{2}/.test(String(value ?? "")) ? Date.parse(`${String(value).slice(0, 10)}T00:00:00Z`) : NaN;

  return AVAILABILITY.records.filter((record) => record.campground_id === c.id && record.state === "OFFICIAL_APPLICATION_OPEN" && (!dateMatch || coversStay(record)));
};
// 시도 표기(강원도/강원특별자치도 등)가 섞여 있어 짧은 이름으로 묶는다: “강원 평창군”, “경북 경주시”
const SIDO_SHORT = [[/^서울/, "서울"], [/^부산/, "부산"], [/^대구/, "대구"], [/^인천/, "인천"], [/^광주/, "광주"], [/^대전/, "대전"], [/^울산/, "울산"], [/^세종/, "세종"], [/^경기/, "경기"], [/^강원/, "강원"], [/^충청북|^충북/, "충북"], [/^충청남|^충남/, "충남"], [/^전라북|^전북/, "전북"], [/^전라남|^전남/, "전남"], [/^경상북|^경북/, "경북"], [/^경상남|^경남/, "경남"], [/^제주/, "제주"]];
const sidoShort = (s) => SIDO_SHORT.find(([re]) => re.test(s ?? ""))?.[1] ?? (s ?? "");
const sggKey = (c) => (c._sgg ??= `${sidoShort(c.sido)} ${c.sigungu ?? ""}`.trim());
const sggLabel = (k) => k;
const haystack = (c) => (c._hay ??= [c.name, c.sido, sidoShort(c.sido), c.sigungu, c.addr, c.line, ...c.th.map((id) => THEME_LABEL[id] ?? ""), ...c.kinds.map(([k]) => KIND[k]?.[0] ?? ""), ...c.amenities, ...c.env, ...c.themes, OP[c.op], ...c.types, ...c.booking.methods].filter(Boolean).join(" ").toLowerCase().replace(/\s+/g, ""));
const THEME_LABEL = {};
const isRealtime = (c) => c.booking.methods.some((m) => /실시간/.test(m));
const hasChannel = (c, id) => c.booking.channels.some((channel) => channel.platform_id === id);
const hasPower = (c) => c.field_conditions?.power?.available === true || c.amenities.some((amenity) => /전기/.test(amenity));
const hasSiteSize = (c) => c.field_conditions?.site_size?.groups?.length > 0 || c.sizes.length > 0;
const hasFloor = (c) => c.field_conditions?.ground?.types?.length > 0 || c.floors.length > 0;
const petOk = (c) => /가능/.test(c.pets ?? "") && !/불가/.test(c.pets ?? "");
const dist = (a, b) => { const R = 6371, t = Math.PI / 180, x = (b.lat - a.lat) * t, y = (b.lng - a.lng) * t; const h = Math.sin(x / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

// 지도 마커는 “지도에 보이는 곳만” 조건을 빼고 그린다(지도를 옮기면 다른 곳도 보이도록).
function filtered({ forMap = false } = {}) {
  // 검색어는 띄어쓰기로 나눠 모두 포함하는 곳만(이름·지역·주소·한 줄 소개·테마·사이트 형태·시설·입지)
  const tokens = state.q.trim().toLowerCase().split(/\s+/).filter((t) => t && t !== "전국");
  const list = ALL.filter((c) => {
    if (state.savedOnly && !state.saved.has(c.id)) return false;
    if (!forMap && !inBounds(c)) return false;
    if (state.area !== "전국" && c.area !== state.area) return false;
    if (state.sgg && sggKey(c) !== state.sgg) return false;
    if (state.theme && !c.th.includes(state.theme)) return false;
    if (tokens.length && !tokens.every((t) => haystack(c).includes(t))) return false;
    if (state.kinds.size && !c.kinds.some(([k]) => state.kinds.has(k))) return false;
    if (state.realtime && !isRealtime(c)) return false;
    // 이 필터는 판매 재고가 아니라, 원천 API가 현재 “접수중”으로 응답한 상품만
    // 남긴다. 날짜가 있으면 이용 기간이 모든 숙박일을 덮는지도 함께 확인한다.
    if (state.availabilityOnly && !officialOpenRecords(c, { dateMatch: Boolean(state.checkIn && state.checkOut) }).length) return false;
    if (state.pet && !petOk(c)) return false;
    if (state.fee && !c.fee?.min) return false;
    if (state.toilet && !(c.nearby_toilets?.nearest?.[0]?.m <= 500)) return false;
    if (state.power && !hasPower(c)) return false;
    if (state.siteSize && !hasSiteSize(c)) return false;
    if (state.floor && !hasFloor(c)) return false;
    if (state.naverBooking && !hasChannel(c, "naver")) return false;
    if (state.camfitBooking && !hasChannel(c, "camfit")) return false;
    return fits(c);
  });
  if (state.sort === "near" && state.here) list.sort((a, b) => dist(state.here, a) - dist(state.here, b));
  else if (state.sort === "fee") list.sort((a, b) => (a.fee?.min ?? 9e9) - (b.fee?.min ?? 9e9));
  else if (state.sort === "best") list.sort((a, b) => richness(b) - richness(a) || sortName(a).localeCompare(sortName(b), "ko"));
  else list.sort((a, b) => sortName(a).localeCompare(sortName(b), "ko"));
  return list;
}

    </span></button>`;

/* ---------- 지도(카카오) ---------- */
function initMap() {
  const el = $("#map");
  if (!KAKAO_KEY) { el.innerHTML = `<div class="map-empty"><div>${ic("#l-map")}<p data-wrap-ok>지도 키가 설정되지 않아 목록만 표시합니다.</p></div></div>`; return; }
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_KEY)}&autoload=false&libraries=clusterer`;
  s.onload = () => kakao.maps.load(() => {
    map = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(36.4, 127.8), level: 13 });
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    clusterer = new kakao.maps.MarkerClusterer({ map, averageCenter: true, minLevel: 8, disableClickZoom: false,
      styles: [{ width: "42px", height: "42px", background: "rgba(31,157,92,.88)", color: "#fff", borderRadius: "50%", textAlign: "center", lineHeight: "42px", fontWeight: "800", fontSize: "13px" }] });
    renderMarkers(filtered({ forMap: true }));
    renderChips();
    // 지도를 옮기거나 확대하면 “지도에 보이는 곳만” 목록을 다시 계산한다.
    kakao.maps.event.addListener(map, "idle", () => { if (state.inView) { state.shown = PAGE; renderListOnly(); } });
  });
  s.onerror = () => { el.innerHTML = `<div class="map-empty"><p data-wrap-ok>지도를 불러오지 못했습니다(도메인 등록 확인). 목록은 그대로 쓸 수 있어요.</p></div>`; };
  document.head.append(s);
}
function renderMarkers(list) {
  if (!map || !clusterer) return;
  clusterer.clear(); markers.clear();
  const ms = list.map((c) => {
    const m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(c.lat, c.lng), title: c.name });
    kakao.maps.event.addListener(m, "click", () => openDetail(c.id));
    markers.set(c.id, m); return m;
  });
  clusterer.addMarkers(ms);
}

function priceMentionsBlock(d) {

// 6) 후기: 영상 가로 레일 · 방문자 사진 격자 · 글(필터: 추천/최신/정확/작년 이맘때)
const REVIEW_MODES = [["rec", "추천"], ["new", "최신순"], ["acc", "정확순"], ["ly", "작년 이맘때"]];
const doy = (t) => { const x = new Date(t); return Math.floor((x - new Date(x.getFullYear(), 0, 0)) / 864e5); };
function reviewItems(d) {
  return [...(d?.reviews ?? []).map((r) => ({ ...r, kind: "블로그" })), ...(d?.cafe ?? []).map((r) => ({ ...r, kind: "카페" }))]
    .map((r) => ({ ...r, scored: r.q != null, q: r.q ?? Math.round(20 + Math.min(String(r.snippet ?? "").length, 160) / 4 + (r.thumb ? 10 : 0)), t: Date.parse(r.date ?? "") || 0 }));
}
function sortReviews(list, mode) {
  const now = Date.now(), year = new Date().getFullYear();
  const lastYear = (r) => r.t && new Date(r.t).getFullYear() < year && Math.abs(doy(r.t) - doy(now)) <= 45;
  const byDate = (a, b) => b.t - a.t, byQ = (a, b) => b.q - a.q || b.t - a.t;
  if (mode === "new") return [...list].sort(byDate);
  if (mode === "acc") return [...list].sort(byQ);
  if (mode === "ly") return list.filter(lastYear).sort((a, b) => Math.abs(doy(a.t) - doy(now)) - Math.abs(doy(b.t) - doy(now)));
  // 추천: 최근 60일 → 정보량 많은 글 → 작년 이맘때 → 나머지(최신순)
  const recent = list.filter((r) => now - r.t <= 60 * 864e5).sort(byDate);
  const rest = list.filter((r) => !recent.includes(r));
  const rich = rest.filter((r) => r.q >= 70).sort(byQ);
  const ly = rest.filter((r) => !rich.includes(r) && lastYear(r)).sort(byDate);
  return [...recent, ...rich, ...ly, ...rest.filter((r) => !rich.includes(r) && !ly.includes(r)).sort(byDate)];
}

function reviewsBlock(c, d) {

/* ---------- (i) 출처 안내: 본문에서 빼고 제목 옆 버튼으로 ---------- */
// 상세의 .trust(출처·확인 시각·주의 문구)를 가까운 제목 옆 (i) 버튼으로 옮긴다. 누르면 말풍선으로 보인다.
function tipify(root) {
  root.querySelectorAll(".trust").forEach((el) => {
    const html = el.innerHTML.replace(/<svg[\s\S]*?<\/svg>/g, "").trim();
    const box = el.closest(".dv-sub, .dv-sec, details, .sub, .box");
    const head = box?.querySelector(":scope > h4, :scope > h3, :scope > .dv-sub-head h4, :scope > summary");
    el.remove();
    if (!html) return;
    let btn = head?.querySelector(":scope > .tip");
    if (!btn) {
      btn = document.createElement("button");
      btn.type = "button"; btn.className = "tip"; btn.setAttribute("aria-label", "출처·안내 보기");
      btn.innerHTML = ic("#l-info", "i-xs");
      btn.dataset.tip = "";
      if (head) head.append(btn); else box?.prepend(btn);
    }
    btn.dataset.tip += `<p>${html}</p>`;
  });
}
function showTip(btn) {
  let pop = document.getElementById("tipPop");
  if (pop && pop.dataset.for === btn.dataset.tipId) { pop.remove(); return; }
  pop?.remove();
  btn.dataset.tipId ||= Math.random().toString(36).slice(2);
  pop = document.createElement("div");
  pop.id = "tipPop"; pop.className = "tip-pop"; pop.setAttribute("role", "tooltip"); pop.dataset.for = btn.dataset.tipId;
  pop.innerHTML = btn.dataset.tip;
  document.body.append(pop);
  const r = btn.getBoundingClientRect(), w = Math.min(320, innerWidth - 24);
  pop.style.width = `${w}px`;
  pop.style.left = `${Math.max(12, Math.min(innerWidth - w - 12, r.left + r.width / 2 - w / 2))}px`;
  const below = r.bottom + 8 + pop.offsetHeight < innerHeight;
  pop.style.top = `${below ? r.bottom + 8 : r.top - pop.offsetHeight - 8}px`;
}

/* ---------- 라이트박스: 넘기기(스와이프·드래그)·키보드·이전/다음 ---------- */
const lb = { group: null, i: 0, items: [], el: null, x0: null, dx: 0 };
function lbOpen(group, i) {
  const items = LB.get(group) ?? [];
  if (!items.length) return;
  Object.assign(lb, { group, i: Math.max(0, Math.min(items.length - 1, i)), items, back: document.activeElement });
  if (!lb.el) {
    lb.el = document.createElement("div");
    lb.el.className = "lb"; lb.el.setAttribute("role", "dialog"); lb.el.setAttribute("aria-modal", "true"); lb.el.setAttribute("aria-label", "사진 크게 보기");
    lb.el.innerHTML = `<div class="lb-top"><span class="lb-count num"></span><button type="button" class="lb-x" data-lb-close aria-label="닫기">${ic("#l-x")}</button></div>
      <div class="lb-stage"><div class="lb-track"></div></div>
      <button type="button" class="lb-nav lb-prev" data-lb-step="-1" aria-label="이전 사진">${ic("#l-chevron-left")}</button>
      <button type="button" class="lb-nav lb-next" data-lb-step="1" aria-label="다음 사진">${ic("#l-chevron-right")}</button>
      <div class="lb-cap"></div>`;
    document.body.append(lb.el);
    const stage = lb.el.querySelector(".lb-stage");
    stage.addEventListener("pointerdown", (e) => { lb.x0 = e.clientX; lb.dx = 0; stage.setPointerCapture(e.pointerId); lb.el.querySelector(".lb-track").style.transition = "none"; });
    stage.addEventListener("pointermove", (e) => { if (lb.x0 == null) return; lb.dx = e.clientX - lb.x0; lbPlace(); });
    const end = () => { if (lb.x0 == null) return; const dx = lb.dx; lb.x0 = null; lb.dx = 0; lb.dragged = Math.abs(dx) > 5; lb.el.querySelector(".lb-track").style.transition = ""; if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1); else lbPlace(); };
    stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
    // 사진 바깥(어두운 바탕)을 누르면 닫는다. 넘기기(드래그) 끝에 생기는 클릭은 무시한다.
    stage.addEventListener("click", (e) => { if (lb.dragged) { lb.dragged = false; return; } if (!e.target.closest("img, .lb-orig")) lbClose(); });
  }
  lb.el.querySelector(".lb-track").innerHTML = items.map((p, k) => `<figure class="lb-slide${p.small ? " small" : ""}"><img data-src="${esc(p.src)}" alt="${esc(p.cap ?? "")}" ${p.remote ? 'referrerpolicy="no-referrer"' : ""} draggable="false">${p.small && p.link ? `<a class="lb-orig" href="${esc(p.link)}" target="_blank" rel="noopener">원문에서 크게 보기${ic("#l-arrow-up-right", "i-xs")}</a>` : ""}</figure>`).join("");
  lb.el.hidden = false;
  document.documentElement.classList.add("lb-open");
  lbShow();
  lb.el.querySelector(".lb-x").focus();
}
function lbPlace() { lb.el.querySelector(".lb-track").style.transform = `translateX(calc(${-lb.i * 100}% + ${lb.dx}px))`; }
function lbShow() {
  const slides = lb.el.querySelectorAll(".lb-slide img");
  [lb.i - 1, lb.i, lb.i + 1].forEach((k) => { const im = slides[k]; if (im && !im.src) im.src = im.dataset.src; });
  lbPlace();
  const p = lb.items[lb.i];
  lb.el.querySelector(".lb-count").textContent = `${lb.i + 1} / ${lb.items.length}`;
  lb.el.querySelector(".lb-cap").innerHTML = `${esc(p.cap ?? "")}${p.link && !p.small ? ` · <a href="${esc(p.link)}" target="_blank" rel="noopener">원문</a>` : ""}`;
  lb.el.querySelector(".lb-prev").disabled = lb.i === 0;
  lb.el.querySelector(".lb-next").disabled = lb.i === lb.items.length - 1;
}
function lbStep(n) { lb.i = Math.max(0, Math.min(lb.items.length - 1, lb.i + n)); lbShow(); }
function lbClose() { if (!lb.el || lb.el.hidden) return false; lb.el.hidden = true; document.documentElement.classList.remove("lb-open"); lb.back?.focus?.(); return true; }

function introHtml(t) {

function setDetailScrollLock(locked) {

function openDetail(id) {

// 캠핑장별 상세 파일(data/camps/{id}.json)은 처음 열 때 한 번만 받는다.
async function loadDetail(c) {
  if (!DETAIL.has(c.id)) {
    try { const r = await fetch(`data/camps/${c.id}.json`); DETAIL.set(c.id, r.ok ? await r.json() : {}); } catch { DETAIL.set(c.id, {}); }
    if (state.open !== c.id) return;
    const panel = $(".sheet-panel"), top = panel?.scrollTop ?? 0;
    if (panel) { panel.innerHTML = detail(c); panel.scrollTop = top; }
  }
  const slot = $("#introSlot"); if (slot) slot.innerHTML = introHtml(DETAIL.get(c.id));
  tipify($(".sheet-panel"));
  mountGiscus(c);
}
function mountGiscus(c) {
  const g = window.GISCUS, el = $(".giscus");
  if (!g?.repoId || !el || el.dataset.mounted) return;
  el.dataset.mounted = "1";
  const s = document.createElement("script");
  Object.entries({ src: "https://giscus.app/client.js", "data-repo": g.repo, "data-repo-id": g.repoId, "data-category": g.category, "data-category-id": g.categoryId, "data-mapping": "specific", "data-term": `camp-${c.id} ${c.name}`, "data-strict": "1", "data-reactions-enabled": "1", "data-input-position": "top", "data-theme": "preferred_color_scheme", "data-lang": "ko", "data-loading": "lazy", crossorigin: "anonymous" }).forEach(([k, v]) => s.setAttribute(k, v));
  s.async = true; el.append(s);
}
function mountRoadview(value, name) {
  const slot = $("#roadviewSlot");
  const [lat, lng] = String(value ?? "").split(",").map(Number);
  if (!slot || !Number.isFinite(lat) || !Number.isFinite(lng)) return;
  const fallback = `<a class="mini" href="${esc(mapLink(name, lat, lng))}" target="_blank" rel="noopener">카카오 지도에서 주변 보기${ic("#l-arrow-up-right", "i-xs")}</a>`;
  if (!KAKAO_KEY || !window.kakao?.maps?.Roadview || !window.kakao?.maps?.RoadviewClient) {
    slot.innerHTML = `<div class="roadview-empty"><b>${esc(name)} 로드뷰</b><p data-wrap-ok>이 화면의 카카오 지도 키가 준비되지 않아 로드뷰를 표시할 수 없습니다.</p>${fallback}</div>`;
    return;
  }
  slot.innerHTML = `<div class="roadview-head"><b>${esc(name)} 주변 카카오 로드뷰</b>${fallback}</div><div class="roadview-canvas" aria-label="${esc(name)} 주변 도로 파노라마"></div>`;
  const position = new kakao.maps.LatLng(lat, lng);
  const roadview = new kakao.maps.Roadview($(".roadview-canvas", slot));
  const client = new kakao.maps.RoadviewClient();
  // Kakao 공식 예제와 같이 가까운 파노라마만 찾는다. 촬영 지점이 없으면 억지로 다른 장소를 보여 주지 않는다.
  client.getNearestPanoId(position, 100, (panoId) => {
    if (panoId) { roadview.setPanoId(panoId, position); return; }
    slot.innerHTML = `<div class="roadview-empty"><b>${esc(name)} 근처의 로드뷰가 없습니다.</b><p data-wrap-ok>도로 촬영 지점은 장소마다 다릅니다. 지도로 위치와 진입로를 확인하세요.</p>${fallback}</div>`;
  });
}
// 탐색 상태(테마·권역·시군구)를 주소에 남겨 그대로 공유할 수 있게 한다.
function syncHash() {
  if (state.open) return;
  const h = new URLSearchParams();
  if (state.theme) h.set("t", state.theme);
  if (state.area !== "전국") h.set("a", state.area);
  if (state.sgg) h.set("g", state.sgg);
  if (state.q.trim()) h.set("q", state.q.trim());
  if (state.kinds.size) h.set("k", [...state.kinds].join(","));
  if (state.checkIn) h.set("ci", state.checkIn);
  if (state.checkOut) h.set("co", state.checkOut);
  if (state.availabilityOnly) h.set("av", "1");
  history.replaceState(null, "", h.toString() ? `#${h}` : location.pathname);
}
const share = (c) => shareUrl(campUrl(c), `${c.name} · 모여라 캠핑`);
// 캠핑장마다 오픈그래프가 있는 정적 페이지(c/{id}/)가 있으면 그 주소로 공유한다.
const campUrl = (c) => new URL(`c/${c.id}/`, location.href.replace(/[#?].*$/, "")).toString();
async function shareUrl(url, title) {
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url); toast("링크를 복사했어요");
  } catch (e) { if (e?.name !== "AbortError") toast("링크를 복사하지 못했어요"); }
}
function toast(msg, ms = 2000) {
  $$(".toast").forEach((x) => x.remove());
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.append(el); setTimeout(() => el.remove(), ms);
}
function closeDetail({ fromPop = false } = {}) {
  lbClose(); document.getElementById("tipPop")?.remove();
  document.title = BASE_TITLE; state.open = null; $("#sheetRoot").innerHTML = ""; setDetailScrollLock(false);
  if (!fromPop) { if (history.state?.c) history.back(); else { history.replaceState(null, "", location.pathname); syncHash(); } }
}
// 주소의 #q=·#k=·#t=·#a=·#g=를 직접 바꾸거나 링크로 들어오면 그 조건으로 다시 그린다.
window.addEventListener("hashchange", () => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("c")) return;
  state.q = h.get("q") ?? ""; state.kinds = new Set(h.get("k") ? h.get("k").split(",") : []);
  state.theme = h.get("t") ?? ""; state.area = AREAS.includes(h.get("a")) ? h.get("a") : "전국"; state.sgg = h.get("g") ?? "";
  state.checkIn = /^\d{4}-\d{2}-\d{2}$/.test(h.get("ci") ?? "") ? h.get("ci") : "";
  state.checkOut = /^\d{4}-\d{2}-\d{2}$/.test(h.get("co") ?? "") ? h.get("co") : "";
  state.availabilityOnly = h.get("av") === "1";
  $("#q").value = state.q; rerender();
});
window.addEventListener("popstate", () => {
  const id = new URLSearchParams(location.hash.slice(1)).get("c");
  if (id && id !== state.open) openDetail(id); else if (!id && state.open) closeDetail({ fromPop: true });
});

/* ---------- 이벤트 ---------- */
function rerender(resetPage = true) { if (resetPage) state.shown = PAGE; save(); renderAvailabilityQuery(); renderChips(); renderList(); }
document.addEventListener("click", (e) => {
  // (i) 출처 말풍선 · 라이트박스 · 후기 정렬은 다른 클릭보다 먼저 처리한다.
  const tipBtn = e.target.closest(".tip");
  if (tipBtn) { e.preventDefault(); return showTip(tipBtn); }
  if (!e.target.closest(".tip-pop")) document.getElementById("tipPop")?.remove();
  const lbBtn = e.target.closest("[data-lb]");
  if (lbBtn) { e.preventDefault(); return lbOpen(lbBtn.dataset.lb, Number(lbBtn.dataset.lbI) || 0); }
  if (e.target.closest("[data-lb-close]")) return lbClose();
  const step = e.target.closest("[data-lb-step]");
  if (step) return lbStep(Number(step.dataset.lbStep));
  const rv = e.target.closest("[data-rv]");
  if (rv) {
    $$("[data-rv]").forEach((b) => b.setAttribute("aria-selected", String(b === rv)));
    const list = $("#reviewList"); if (list) list.innerHTML = reviewCards(DETAIL.get(state.open), rv.dataset.rv);
    return;
  }
  const t = e.target.closest("[data-open],[data-close],[data-save],[data-share],[data-share-theme],[data-jump],[data-near],[data-copy],[data-video],[data-roadview],[data-th],[data-sgg],[data-area],[data-kind],[data-toggle],#moreBtn,#viewSwitch,#clearQ,#nearBtn,#availabilityRun,#availabilityClear");
  if (!t) return;
  if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); return el?.scrollIntoView({ behavior: "smooth", block: "start" }); }
  if (t.dataset.near) {
    $$("[data-near]").forEach((b) => b.setAttribute("aria-selected", String(b === t)));
    $$("[data-near-panel]").forEach((p) => { p.hidden = p.dataset.nearPanel !== t.dataset.near; });
    return;
  }
  if (t.dataset.roadview) return mountRoadview(t.dataset.roadview, t.dataset.roadviewName || "주변 시설");
  if (t.dataset.copy) { navigator.clipboard?.writeText(t.dataset.copy).then(() => toast("주소를 복사했어요"), () => toast("복사하지 못했어요")); return; }
  if (t.dataset.video) {
    // 유튜브 공식 임베드(쿠키 최소화 도메인)로만 재생한다.
    t.outerHTML = `<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(t.dataset.video)}?autoplay=1" title="영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    return;
  }
  if (t.dataset.th !== undefined && t.hasAttribute("data-close-then")) { closeDetail(); state.theme = t.dataset.th; syncHash(); rerender(); return $(".list-col")?.scrollIntoView({ block: "start" }); }
  if (t.dataset.save) {
    const id = t.dataset.save, on = !state.saved.has(id);
    on ? state.saved.add(id) : state.saved.delete(id);
    t.setAttribute("aria-pressed", String(on)); t.innerHTML = `${ic("#l-heart")}${on ? "저장됨" : "관심"}`;
    toast(on ? `${window.moyeoraUser?.active().name ?? ""}님 관심에 저장했어요`.trim() : "관심에서 뺐어요");
    return rerender(false);
  }
  if (t.dataset.share) return share(ALL.find((x) => x.id === t.dataset.share));
  if (t.dataset.open) return openDetail(t.dataset.open);
  if (t.hasAttribute("data-close")) return closeDetail();
  if (t.id === "availabilityRun") {
    const checkIn = $("#checkIn").value, checkOut = $("#checkOut").value;
    if (!checkIn || !checkOut) return toast("입실일과 퇴실일을 모두 골라 주세요");
    if (!(dayValue(checkIn) < dayValue(checkOut))) return toast("퇴실일은 입실일 다음 날짜여야 해요");
    state.checkIn = checkIn; state.checkOut = checkOut; state.availabilityOnly = true; syncHash(); rerender();
    return $(".list-col")?.scrollIntoView({ block: "start", behavior: "smooth" });
  }
  if (t.id === "availabilityClear") { state.checkIn = ""; state.checkOut = ""; state.availabilityOnly = false; syncHash(); return rerender(); }
  if (t.dataset.area) { state.area = t.dataset.area; state.sgg = ""; syncHash(); return rerender(); }
  if (t.dataset.sgg !== undefined) { state.sgg = t.dataset.sgg; syncHash(); return rerender(); }
  if (t.dataset.th !== undefined) { state.theme = t.dataset.th; syncHash(); rerender(); return $(".list-col")?.scrollIntoView({ block: "start", behavior: "smooth" }); }
  if (t.hasAttribute("data-share-theme")) return shareUrl(`${location.origin}${location.pathname}${location.hash}`, `${META.themes.find((x) => x.id === state.theme)?.label ?? ""} 캠핑장 · 모여라 캠핑`);
  if (t.dataset.kind) { state.kinds.has(t.dataset.kind) ? state.kinds.delete(t.dataset.kind) : state.kinds.add(t.dataset.kind); syncHash(); return rerender(); }
  if (t.dataset.toggle) { state[t.dataset.toggle] = !state[t.dataset.toggle]; syncHash(); return rerender(); }
  if (t.id === "moreBtn") { state.shown += PAGE; return renderList(); }
  if (t.id === "clearQ") { state.q = ""; $("#q").value = ""; return rerender(); }
  if (t.id === "viewSwitch") {
    const toMap = document.body.dataset.view !== "map";
    document.body.dataset.view = toMap ? "map" : "list";
    t.innerHTML = toMap ? `${ic("#l-list", "i-sm")}목록 보기` : `${ic("#l-map", "i-sm")}지도 보기`;
    if (map) setTimeout(() => map.relayout(), 50);
  }
  if (t.id === "nearBtn") {
    // 이미 내 주변 순이면 한 번 더 눌러 끈다.
    if (state.sort === "near" && state.here) { state.sort = "best"; $("#sort").value = "best"; t.setAttribute("aria-pressed", "false"); return rerender(); }
    return locate(t);
  }
});
// 현재 위치: 권한·시간 초과·위치 없음마다 이유를 알려 주고, 찾으면 가까운 순 정렬 + 지도 이동 + 내 위치 표시.
let hereMarker = null;
function locate(btn = $("#nearBtn")) {
  if (!navigator.geolocation) return toast("이 브라우저는 위치 기능을 지원하지 않아요");
  if (!window.isSecureContext) return toast("보안 연결(https)에서만 위치를 쓸 수 있어요");
  btn?.classList.add("busy"); btn?.setAttribute("aria-busy", "true");
  toast("현재 위치를 확인하는 중…");
  navigator.geolocation.getCurrentPosition((p) => {
    btn?.classList.remove("busy"); btn?.removeAttribute("aria-busy"); btn?.setAttribute("aria-pressed", "true");
    state.here = { lat: p.coords.latitude, lng: p.coords.longitude }; state.sort = "near"; $("#sort").value = "near";
    rerender();
    if (map) {
      const at = new kakao.maps.LatLng(state.here.lat, state.here.lng);
      hereMarker?.setMap(null);
      hereMarker = new kakao.maps.CustomOverlay({ position: at, content: '<span class="here-dot" title="내 위치"></span>', zIndex: 5 });
      hereMarker.setMap(map); map.setLevel(9); map.panTo(at);
    }
    $(".list-col")?.scrollIntoView({ block: "start", behavior: "smooth" });
    toast("내 위치에서 가까운 순으로 정렬했어요");
  }, (err) => {
    btn?.classList.remove("busy"); btn?.removeAttribute("aria-busy");
    const msg = err.code === 1 ? "위치 권한이 꺼져 있어요. 주소창의 자물쇠(또는 설정 → 사이트 권한)에서 위치를 허용한 뒤 다시 눌러 주세요."
      : err.code === 3 ? "위치를 찾는 데 시간이 너무 걸려요. 잠시 뒤 다시 눌러 주세요."
      : "현재 위치를 찾지 못했어요. 기기의 위치 서비스(GPS)가 켜져 있는지 확인해 주세요.";
    toast(msg, 5000);
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
}
document.addEventListener("change", (e) => {
  if (e.target.matches("[data-gear]")) { state.gear = e.target.value; rerender(); }
  if (e.target.id === "sort") {
    state.sort = e.target.value;
    if (state.sort === "near" && !state.here) { locate(); return; }
    rerender();
  }
});
// 말풍선은 스크롤하면 닫는다(위치가 어긋나지 않게).
document.addEventListener("scroll", () => document.getElementById("tipPop")?.remove(), true);
let qTimer;
document.addEventListener("input", (e) => { if (e.target.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; rerender(); syncHash(); }, 200); } });
document.addEventListener("keydown", (e) => {
  if (lb.el && !lb.el.hidden) {
    if (e.key === "Escape") { e.preventDefault(); lbClose(); } else if (e.key === "ArrowRight") lbStep(1); else if (e.key === "ArrowLeft") lbStep(-1);
    return;
  }
  if (e.key === "Escape" && document.getElementById("tipPop")) { document.getElementById("tipPop").remove(); return; }
  if (e.key === "Escape" && state.open) closeDetail();
});
const head = () => { const h = $(".gnb")?.offsetHeight ?? 64; document.documentElement.style.setProperty("--top", `${h}px`); document.documentElement.style.setProperty("--head", `${h + $(".bar").offsetHeight}px`); };
new ResizeObserver(head).observe(document.body);

const BASE_TITLE = document.title;
async function boot() {
  load();
  // 댓글(giscus) 설정은 배포 시 메타 태그로 넣는다. 없으면 댓글 칸에 준비 중 안내.
  try { window.GISCUS = JSON.parse(document.querySelector('meta[name="giscus"]')?.content || "null"); } catch {}
  try {
    const [cg, meta, availability] = await Promise.all([
      fetch("data/campgrounds.json").then((r) => r.json()),
      fetch("data/meta.json").then((r) => r.json()).catch(() => null),
      fetch("data/availability.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).catch(() => null),
    ]);
    ALL = cg.map(withDefaults); META = meta; AVAILABILITY = availability;
    for (const t of META?.themes ?? []) THEME_LABEL[t.id] = t.label;
  } catch (e) {
    $("#cards").innerHTML = `<div class="empty">${ic("#l-circle-alert")}<b>데이터를 불러오지 못했어요</b><span data-wrap-ok>잠시 후 다시 시도해 주세요.</span></div>`;
    return;
  }
  if (state.q) $("#q").value = state.q;
  renderAvailabilityQuery(); renderChips(); renderList(); head(); initMap();
  // 목록 끝에 닿으면 자동으로 더 불러온다(수백 곳도 끊김 없이).
  new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting) && !$("#moreBtn").hidden) { state.shown += PAGE; renderListOnly(); } }, { rootMargin: "600px" }).observe($("#moreBtn"));
  if (state.open) openDetail(state.open);
  if (state.nearOnBoot) locate();
}
boot();

</script>
