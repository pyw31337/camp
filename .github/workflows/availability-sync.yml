name: Reservation status sync

on:
  # GitHub Actions 스케줄은 지연될 수 있으므로 화면은 expires_at을 반드시 확인한다.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}  # land-on-main.sh (gh)

concurrency:
  group: reservation-status-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh official application status
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - name: Read Seoul public reservation status
        # 서울 Open API의 캠핑 관련 상품만 읽는다. 로그인·우회·화면 크롤링은 하지 않는다.
        run: npm run sync:seoul-yeyak
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
      - name: Build short-lived public status payload
        run: |
          if [ ! -s out/seoul-yeyak.json ]; then
            echo "::notice title=Reservation status unchanged::서울 원천을 받지 못해 이전 공개본을 유지합니다."
            exit 0
          fi
          npm run build:availability
          cp out/explore/availability.json ../camping-atlas/public/explore/data/availability.json
      - name: Publish only the refreshed status payload
        working-directory: .
        run: |
          if [ ! -f camping-atlas/public/explore/data/availability.json ]; then
            echo "상태 파일이 없어 커밋하지 않습니다."
            exit 0
          fi
          git add camping-atlas/public/explore/data/availability.json
          if git diff --cached --quiet; then
            echo "공개 상태 변경 없음."
            exit 0
          fi
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(availability): refresh official application status"
          # 장시간 기준 데이터 수집과 경합할 수 있다. 이 커밋은 새 상태만 담으므로 새 결과를 우선한다.
          bash "$GITHUB_WORKSPACE/.github/scripts/land-on-main.sh" availability
