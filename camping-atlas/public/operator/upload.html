<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>렛츠 캠핑 · 운영자 사이트 사진 올리기(미리보기)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ink:#1b241c; --muted:#5c6b5e; --bg:#f5f6f4; --card:#fff; --line:#c9d4c6; --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { width: min(760px, 100%); margin: 0 auto; padding: 20px 16px 72px; min-width: 0; }
  h1 { margin: 0 0 6px; font: 800 1.25rem/1.3 inherit; overflow-wrap: anywhere; word-break: keep-all; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; word-break: keep-all; }
  .banner { padding: 10px 12px; border-radius: 10px; background: #fff6d8; color: #5a4a10; font-size: .85rem; margin-bottom: 16px; overflow-wrap: anywhere; }
  a { color: #2f5d32; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="banner">미리보기 전용입니다. 인증번호는 화면에만 보이고, 사진은 이 브라우저 검수 대기열에만 들어갑니다. 운영 Supabase에는 보내지 않아요.</p>
    <h1 data-title>운영자 사이트 사진 올리기</h1>
    <p class="sub">시험용: <a href="?id=100193">고캠핑 전화 있는 곳</a> · <a href="?id=1511">플랫폼으로 채운 전화</a> · <a href="?id=102035">등록 전화 없음</a></p>
    <p class="sub" data-sub>캠핑장을 읽는 중…</p>
    <div data-opp-host></div>
    <p class="sub"><a href="../admin/operator-photos/">검수 대기열 열기</a></p>
  </main>
  <script type="module">
    import { mountPhotos } from "./photos.js";
    const SAMPLES = {
      "100193": { id: "100193", name: "선장포노을캠핑장", tel: "041-532-0106", st: ["PITCH", "AUTO", "CARAVAN", "RV", "CAR_CAMP"] },
      "1511": { id: "1511", name: "산으로 캠핑장", tel: "010-3436-7676", tel_src: { by: "kakao" }, st: ["AUTO", "DECK", "RV", "HOUSE"] },
      "102035": { id: "102035", name: "루트 247", st: ["AUTO", "PITCH"] },
      "11": { id: "11", name: "양촌여울체험캠프", tel: "055-271-2012", st: ["PITCH", "AUTO", "DECK", "GLAMPING", "CARAVAN", "RV", "HOUSE", "CAR_CAMP"] },
    };
    const DATA = "https://pyw31337.github.io/camp/explore/data/";
    const id = new URLSearchParams(location.search).get("id") || "100193";
    let camp = SAMPLES[id] || { ...SAMPLES["100193"], id, name: `캠핑장 ${id}` };
    try {
      const r = await fetch(`${DATA}campgrounds.lite.json`);
      const rows = await r.json();
      const list = Array.isArray(rows) ? rows : (rows.camps || []);
      const hit = list.find((c) => String(c.id) === String(id));
      if (hit) camp = hit;
    } catch {}
    document.querySelector("[data-title]").textContent = `${camp.name} · 사이트 사진 올리기`;
    document.title = `${camp.name} · 사이트 사진 올리기(미리보기)`;
    const telNote = camp.tel_src ? "고캠핑 등록 전화가 없어 사업자번호로 확인합니다." : (camp.tel ? "고캠핑 등록 전화로만 인증합니다." : "등록 전화가 없어 사업자번호로 확인합니다.");
    document.querySelector("[data-sub]").textContent = telNote + " 사진은 관리자 승인 전에 공개되지 않습니다.";
    mountPhotos(document.querySelector("[data-opp-host]"), camp, { preview: true });
  </script>
</body>
</html>
