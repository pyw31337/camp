name: Publish LetsHub observability

on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letscamp-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish persisted data evidence
        run: python3 scripts/record_observability.py
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observability/latest.json
          git diff --staged --quiet || (git commit -m "chore(ops): publish campground observability [skip ci]" && git push origin main)
