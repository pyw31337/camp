name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "camping-atlas/**"
      - "design/explore/**"
      - "design/site-header.mjs"
      - "scripts/publish-explorer-pages.mjs"
      - ".github/workflows/deploy-pages.yml"
  # Data sync가 GITHUB_TOKEN으로 커밋한 데이터는 push 이벤트를 만들지 않으므로, 수집이 끝나면 다시 배포한다.
  workflow_run:
    workflows: ["Data sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camping-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: camping-atlas/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm run install:ci
      - run: npm run lint
      - run: npm run build:pages
      - name: Refresh the explorer screen to the latest design
        # 데이터는 매일 Data sync가 커밋하고, 화면(design/explore)은 바뀌면 배포 때 바로 반영한다.
        working-directory: .
        run: node scripts/publish-explorer-pages.mjs --shell-only camping-atlas/dist/client/explore
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY || secrets.KAKAO_JS_KEY }}
          GISCUS_CONFIG: ${{ vars.GISCUS_CONFIG }}
      - name: Add self-hosted official images from the media branch
        # data-sync가 media 브랜치(공식 사진 webp, 한 커밋)를 갱신한다. 있으면 /camp/media/ 로 함께 배포한다.
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin media >/dev/null 2>&1; then
            git fetch --depth=1 origin +media:refs/remotes/origin/media
            mkdir -p camping-atlas/dist/client/media
            git archive origin/media | tar -x -C camping-atlas/dist/client/media
            du -sh camping-atlas/dist/client/media
          else
            echo "::notice::media 브랜치가 없어 이미지 없이 배포합니다."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: camping-atlas/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
