name: Periodic Review Digest & AI Intelligence Sync

# 후기·영상 수집(카카오 다음 검색, 14일 주기 순환)과 장단점 분석·탐색 데이터 재생성은 매일 Data sync가 한다
# (data-sync.yml: sync:social → build-spec-sheet → build-review-digest → … → 커밋).
# 이 워크플로는 그 결과(커밋된 camping-atlas/public/explore/data)를 매주 Supabase 운영 DB에 적재만 한다.
# 2026-10-19 수정: 예전에는 여기서도 sync:social을 9,100회 더 호출하고 캐시 없이 탐색 데이터를 다시 만들어 커밋하려 했다.
#   - 같은 UTC 날짜에 Data sync(9,100회)와 겹쳐 카카오 일일 쿼터 절반 상한(AGENTS.md 무과금 원칙 3)을 넘고,
#   - 캐시(.cache/social-search.json)·사이트 타입·운영자 사실 단계 없이 다시 만든 데이터로 매일 결과를 덮어쓸 위험이 있었다.
#   - 첫 정기 실행(2026-10-18)은 마지막 커밋 단계의 경로 오류로 실패해 덮어쓰기는 일어나지 않았다.
on:
  schedule:
    # 매주 월요일 04:00 KST (일요일 19:00 UTC) — Data sync(03:17 KST) 커밋 뒤
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-digest-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-supabase:
    name: Load committed review intelligence into Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Sync intelligence to Supabase PostgreSQL
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::DATABASE_URL 없음 — 적재 건너뜀"; exit 0; fi
          npm run db:import-supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
