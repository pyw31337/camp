<title>모여라 캠핑 · 전국 캠핑장 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --green: #1f9d5c; --green-press: #17834b; --green-tint: #e5f4eb; --on-green: #ffffff;
  --forest: #173f2e; --on-forest: #f1f6f2; --heading: #173f2e;
  --ember: #e8702f; --ember-tint: #fdeee4;
  --ink: #17211c; --ink-2: #57635c; --ink-3: #8a948e;
  --bg: #f4f5f2; --surface: #ffffff; --surface-2: #eef1ec; --line: #e1e6e0;
  --glass: rgba(16, 32, 24, .42); --scrim: rgba(10, 20, 15, .45);
  --shadow-1: 0 1px 2px rgba(23,33,28,.06);
  --shadow-2: 0 12px 32px -8px rgba(23,33,28,.18);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-1: 10px; --r-2: 16px; --r-3: 24px; --r-4: 32px;
  --gutter: clamp(16px, 4vw, 48px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --green: #3dbb78; --green-press: #5cce91; --green-tint: #14301f; --on-green: #04170c;
  --forest: #0f2a1f; --on-forest: #e6eee9; --heading: #e6eee9;
  --ember: #f4945a; --ember-tint: #3a2416;
  --ink: #e6eee9; --ink-2: #a3afa8; --ink-3: #737f78;
  --bg: #0d1310; --surface: #151d19; --surface-2: #1d2722; --line: #29342e;
  --glass: rgba(6, 14, 10, .5); --scrim: rgba(0, 0, 0, .6);
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --green: #3dbb78; --green-press: #5cce91; --green-tint: #14301f; --on-green: #04170c;
  --forest: #0f2a1f; --on-forest: #e6eee9; --heading: #e6eee9;
  --ember: #f4945a; --ember-tint: #3a2416;
  --ink: #e6eee9; --ink-2: #a3afa8; --ink-3: #737f78;
  --bg: #0d1310; --surface: #151d19; --surface-2: #1d2722; --line: #29342e;
  --glass: rgba(6, 14, 10, .5); --scrim: rgba(0, 0, 0, .6);
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* 라벨·버튼·칩·제목은 줄바꿈 금지. 좁은 화면에서는 .s(짧은 문구)로 바꾼다. 문장 단락만 data-wrap-ok로 줄바꿈 허용 */
.btn, .pill, .tag, .cat, .bell, .nav a, .tabbar a, .search-tabs button, .seg button, .d-tabs button, .more, .trust, .sort, .back,
.sfield small, .sfield b, .stat-tile small, .stat-tile b, .fact small, .fact b, .wtile small, .wtile b, .wtile span,
.sec-head h2, .sec-head p, .card h3, .card-loc, .fit, .mode, .open-when, .open-title h3, .open-title p, .provider li span, .provider-head h3, .provider-head p,
.zone b, .zone small, .ag h3, .ag p, .mini-tl span, .mini-tl time, .countdown small, .countdown p, .book-head b, .book-head small, .near b, .near small,
.link-card b, .link-card small, .stepper b, .stepper small, .opt b, .opt small, .feed-row b, .feed-row code, .toast, .cal-legend span, .d-meta span, .d-title h1,
.results-head h1, .cal-nav b, .agenda h2, .g-loc, .site-tip, .step b, .step p, .sheet-head h2, .logo { white-space: nowrap; }
.card h3, .card-loc, .fit, .open-title h3, .open-title p, .provider li span, .zone b, .zone small, .ag h3, .ag p, .mini-tl span, .countdown p, .book-head b,
.near b, .near small, .link-card b, .link-card small, .opt b, .opt small, .feed-row code, .d-title h1, .step p, .wtile span, .wtile b, .sec-head p { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.s { display: none !important; }
@media (max-width: 640px) { .l { display: none !important; } .s { display: inline !important; } }
[data-wrap-ok] { white-space: normal; text-wrap: pretty; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font); letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
li { list-style: none; }
h1, h2 { text-wrap: balance; color: var(--heading); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { width: 100%; max-width: 1280px; margin-inline: auto; padding-inline: var(--gutter); }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 16px; height: 16px; }
.i-xs { width: 14px; height: 14px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }


/* ---------- 탐색 화면 ---------- */
body { min-height: 100dvh; }
.top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { height: 60px; display: flex; align-items: center; gap: 16px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -0.04em; color: var(--heading); white-space: nowrap; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--green); color: var(--on-green); display: grid; place-items: center; }
.top-links { margin-left: auto; display: flex; gap: 4px; }
.top-links a { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.top-links a:hover { background: var(--surface); color: var(--ink); }

.bar { position: sticky; top: 60px; z-index: 30; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
.bar .wrap { display: grid; gap: 10px; }
.q { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); border: 1px solid var(--line); min-width: 0; }
.q input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.q .clear { color: var(--ink-3); display: grid; place-items: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; flex: none; }
.pill[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: var(--on-forest); }
.pill .num { color: inherit; opacity: .7; font-weight: 700; }
.sep { width: 1px; background: var(--line); flex: none; margin: 6px 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 0; }
.list-col { padding: 16px var(--gutter) 96px; min-width: 0; }
.map-col { position: sticky; top: var(--head, 172px); height: calc(100dvh - var(--head, 172px)); border-left: 1px solid var(--line); background: var(--surface-2); }
#map { width: 100%; height: 100%; }
.map-empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }
.results-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-width: 0; }
.results-head h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }
.results-head .faint { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sort { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; flex: none; }
.sort select { border: 0; background: transparent; font-weight: 700; outline: 0; }

.cards { display: grid; gap: 12px; }
.card { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: var(--r-2); background: var(--surface); box-shadow: var(--shadow-1); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.card:hover, .card[aria-current="true"] { border-color: var(--green); }
.thumb { width: 132px; height: 104px; border-radius: 12px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { min-width: 0; display: grid; gap: 5px; align-content: start; }
.card-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card-title h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.loc { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; max-height: 52px; overflow: hidden; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag-green { background: var(--green-tint); color: var(--green-press); }
.tag-dark { background: var(--forest); color: var(--on-forest); }
.price { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.price b { font-size: 15px; color: var(--ink); font-weight: 800; }
.more-btn { margin: 16px auto 0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; width: 100%; max-width: 320px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; white-space: nowrap; }
.empty { padding: 48px 16px; text-align: center; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }

/* 상세 시트 */
.sheet { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-columns: 1fr minmax(0, 560px); }
.sheet-scrim { background: var(--scrim); }
.sheet-panel { background: var(--bg); overflow-y: auto; overscroll-behavior: contain; box-shadow: var(--shadow-2); }
.sheet-close { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px 12px; background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent)); }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-1); }
.d-hero { margin: -60px 0 0; height: 260px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); overflow: hidden; position: relative; }
.d-hero img { width: 100%; height: 100%; object-fit: cover; }
.d-hero .credit { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.d-body { padding: 18px 20px 120px; display: grid; gap: 18px; }
.d-title h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
.d-title p { margin-top: 4px; color: var(--ink-2); font-size: 14px; }
.d-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.act { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); padding: 16px; display: grid; gap: 10px; }
.box h3 { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.box-book { border-color: var(--green); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 14px; font-weight: 800; font-size: 16px; white-space: nowrap; }
.btn-primary { background: var(--green); color: var(--on-green); }
.btn-primary:hover { background: var(--green-press); }
.btn-line { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.fact small { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.fact b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .m { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.note { font-size: 12.5px; color: var(--ink-3); }
.pre { white-space: pre-line; font-size: 14px; }
.ev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: 14px; }
.ev time { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trust { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.trust.ok { color: var(--green-press); }

.mobile-switch { display: none; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .map-col { display: none; position: fixed; inset: var(--head, 172px) 0 0 0; height: auto; z-index: 20; border: 0; }
  body[data-view="map"] .map-col { display: block; }
  body[data-view="map"] .list-col { display: none; }
  .mobile-switch { display: inline-flex; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50; align-items: center; gap: 6px; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--forest); color: var(--on-forest); font-weight: 800; box-shadow: var(--shadow-2); white-space: nowrap; }
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .sheet-scrim { display: none; }
}
@media (max-width: 480px) {
  .card { grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 10px; }
  .thumb { width: 96px; height: 96px; }
  .top-links .l-only { display: none; }
}

</style>

-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></symbol><symbol id="l-ruler" viewBox="0 0 24 24"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z" /> <path d="m14.5 12.5 2-2" /> <path d="m11.5 9.5 2-2" /> <path d="m8.5 6.5 2-2" /> <path d="m17.5 15.5 2-2" /></symbol><symbol id="l-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></symbol><symbol id="l-shield-check" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /> <path d="m9 12 2 2 4-4" /></symbol><symbol id="l-toilet" viewBox="0 0 24 24"><path d="M7 12h13a1 1 0 0 1 1 1 5 5 0 0 1-5 5h-.598a.5.5 0 0 0-.424.765l1.544 2.47a.5.5 0 0 1-.424.765H5.402a.5.5 0 0 1-.424-.765L7 18" /> <path d="M8 18a5 5 0 0 1-5-5V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8" /></symbol><symbol id="l-warehouse" viewBox="0 0 24 24"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11" /> <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z" /> <path d="M6 13h12" /> <path d="M6 17h12" /></symbol><symbol id="l-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></symbol><symbol id="l-zap" viewBox="0 0 24 24"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" /></symbol><symbol id="t-building-pavilion" viewBox="0 0 24 24"><path d="M3 21h7v-3a2 2 0 0 1 4 0v3h7" /> <path d="M6 21l0 -9" /> <path d="M18 21l0 -9" /> <path d="M6 12h12a3 3 0 0 0 3 -3a9 8 0 0 1 -9 -6a9 8 0 0 1 -9 6a3 3 0 0 0 3 3" /></symbol><symbol id="t-caravan" viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /> <path d="M11 18h7a2 2 0 0 0 2 -2v-7a2 2 0 0 0 -2 -2h-9.5a5.5 5.5 0 0 0 -5.5 <div id="sheetRoot"></div>

<script type="module">
// 모여라 캠핑 · 전국 캠핑장 탐색. 데이터: data/campgrounds.json, data/meta.json (pipeline build:explore)
const KAKAO_KEY = document.querySelector('meta[name="kakao-js-key"]')?.content ?? "";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="${id}"/></svg>`;
const won = (n) => `${Math.round(n / 1000) * 1000 >= 10000 ? (n / 10000).toFixed(n % 10000 ? 1 : 0) + "만" : n.toLocaleString()}원`;
const ymd = (s) => { const d = new Date(s); return Number.isNaN(+d) ? "" : `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`; };
const KIND = { AUTO_PITCH: ["오토캠핑", "#l-car"], PITCH: ["일반 캠핑", "#t-tent"], GLAMPING: ["글램핑", "#l-bed-double"], CARAVAN_RENTAL: ["카라반", "#t-caravan"], RV_PITCH: ["개인 카라반", "#t-caravan"], TARP_ZONE: ["타프존", "#t-building-pavilion"], SHELTER_ZONE: ["쉘터존", "#l-warehouse"], CAMPNIC_DAY: ["캠프닉", "#t-grill"] };
const AREAS = ["전국", "서울·경기", "강원", "충청", "전라", "경상", "제주"];
const OP = { LOCAL_GOVERNMENT: "지자체", PRIVATE: "민간", NATIONAL_PARK: "국립공원", NATURAL_RECREATION_FOREST: "자연휴양림", PUBLIC_LEISURE: "국민여가", UNKNOWN: "" };
const GEAR = [["", "장비 크기 무관"], ["4x4", "돔텐트 4×4m"], ["5.5x8", "리빙쉘 5.5×8m"], ["6x9.5", "텐트+타프 6×9.5m"], ["8x10", "대형 8×10m"]];
const PAGE = 30;
// 이름순 정렬은 “(주)”, “(에드203)” 같은 괄호 접두어와 법인 표기를 빼고 비교한다.
const sortName = (c) => (c._sort ??= c.name.replace(/^[\s(（［\[]*[^)）］\]]*[)）］\]]\s*/, "").replace(/^(주식회사|㈜|유한회사|농업회사법인)\s*/, "") || c.name);
// 데이터는 빈 값을 빼고 배포하므로 화면에서 기본값을 채운다.
const withDefaults = (c) => ({ kinds: [], sizes: [], floors: [], amenities: [], env: [], themes: [], rental: [], seasons: [], days: [], types: [], ...c, booking: { methods: [], url: null, provider: null, ...(c.booking ?? {}) } });

const state = { q: "", area: "전국", kinds: new Set(), realtime: false, pet: false, fee: false, toilet: false, gear: "", sort: "best", shown: PAGE, here: null, open: null };
let ALL = [], META = null, map = null, clusterer = null, markers = new Map();

function load() {
  try { const s = JSON.parse(localStorage.getItem("moyeora-explore") ?? "{}"); Object.assign(state, { area: s.area ?? "전국", gear: s.gear ?? "" }); } catch {}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("c")) state.open = h.get("c");
}
const save = () => { try { localStorage.setItem("moyeora-explore", JSON.stringify({ area: state.area, gear: state.gear })); } catch {} };

const fits = (c) => {
  if (!state.gear) return true;
  if (c.kinds.length && c.kinds.every(([k]) => ["GLAMPING", "CARAVAN_RENTAL", "CAMPNIC_DAY"].includes(k))) return true;
  const [w, d] = state.gear.split("x").map(Number);
  return c.sizes.some(([sw, sd]) => (sw >= w && sd >= d) || (sw >= d && sd >= w));
};
// 추천순: 바로 예약할 수 있고 정보가 풍부한 곳을 먼저(온라인 실시간 예약 > 예약 링크 > 사진 > 사이트 구성·크기 > 요금 안내 > 주변 화장실)
const richness = (c) => (c._rich ??= (isRealtime(c) ? 8 : 0) + (c.booking.url ? 6 : c.homepage ? 2 : 0) + (c.img ? 4 : 0) + (c.kinds.length ? 2 : 0) + (c.sizes.length ? 1 : 0) + (c.fee ? 2 : 0) + (c.nearby_toilets ? 1 : 0));
const isRealtime = (c) => c.booking.methods.some((m) => /실시간/.test(m));
const petOk = (c) => /가능/.test(c.pets ?? "") && !/불가/.test(c.pets ?? "");
const dist = (a, b) => { const R = 6371, t = Math.PI / 180, x = (b.lat - a.lat) * t, y = (b.lng - a.lng) * t; const h = Math.sin(x / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

function filtered() {
  const q = state.q.trim().replace(/\s+/g, "");
  const list = ALL.filter((c) => {
    if (state.area !== "전국" && c.area !== state.area) return false;
    if (q && !`${c.name}${c.sido}${c.sigungu}${c.addr}`.replace(/\s+/g, "").includes(q)) return false;
    if (state.kinds.size && !c.kinds.some(([k]) => state.kinds.has(k))) return false;
    if (state.realtime && !isRealtime(c)) return false;
    if (state.pet && !petOk(c)) return false;
    if (state.fee && !c.fee?.min) return false;
    if (state.toilet && !(c.nearby_toilets?.nearest?.[0]?.m <= 500)) return false;
    return fits(c);
  });
  if (state.sort === "near" && state.here) list.sort((a, b) => dist(state.here, a) - dist(state.here, b));
  else if (state.sort === "fee") list.sort((a, b) => (a.fee?.min ?? 9e9) - (b.fee?.min ?? 9e9));
  else if (state.sort === "best") list.sort((a, b) => richness(b) - richness(a) || sortName(a).localeCompare(sortName(b), "ko"));
  else list.sort((a, b) => sortName(a).localeCompare(sortName(b), "ko"));
  return list;
}

function card(c) {
  const kinds = c.kinds.map(([k, n]) => KIND[k] ? `<span class="tag">${ic(KIND[k][1], "i-xs")}${KIND[k][0]} <span class="num">${n}</span></span>` : "").join("");
  const km = state.here ? ` · ${dist(state.here, c).toFixed(0)}km` : "";
  return `<button class="card" type="button" data-open="${c.id}" aria-current="${state.open === c.id}">
    <span class="thumb">${c.img ? `<img src="${esc(c.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ic("#t-tent")}</span>
    <span class="card-body">
      <span class="card-title"><h3>${esc(c.name)}</h3></span>
      <span class="loc">${ic("#l-map-pin", "i-xs")}${esc([c.sido, c.sigungu].filter(Boolean).join(" "))}${km}${OP[c.op] ? ` · ${OP[c.op]}` : ""}</span>
      <span class="tags">${isRealtime(c) ? `<span class="tag tag-green">${ic("#l-zap", "i-xs")}온라인 실시간 예약</span>` : ""}${kinds}${petOk(c) ? `<span class="tag">${ic("#l-dog", "i-xs")}반려견</span>` : ""}</span>
      <span class="price">${c.fee?.min ? `<b>${won(c.fee.min)}~</b><span>공식 안내 요금</span>` : `<span>요금은 예약처에서 확인</span>`}</span>
    </span></button>`;
}

function renderChips() {
  const count = (pred) => ALL.filter(pred).length;
  $("#areaChips").innerHTML = AREAS.map((a) => `<button class="pill" type="button" data-area="${a}" aria-pressed="${state.area === a}">${a}</button>`).join("");
  $("#filterChips").innerHTML = [
    `<button class="pill" type="button" data-toggle="realtime" aria-pressed="${state.realtime}">${ic("#l-zap", "i-sm")}실시간 예약 <span class="num">${count(isRealtime)}</span></button>`,
    ...Object.entries(KIND).filter(([k]) => k !== "RV_PITCH").map(([k, [l, i]]) => `<button class="pill" type="button" data-kind="${k}" aria-pressed="${state.kinds.has(k)}">${ic(i, "i-sm")}${l}</button>`),
    `<span class="sep"></span>`,
    `<button class="pill" type="button" data-toggle="pet" aria-pressed="${state.pet}">${ic("#l-dog", "i-sm")}반려견</button>`,
    `<button class="pill" type="button" data-toggle="fee" aria-pressed="${state.fee}">${ic("#t-coin", "i-sm")}요금 안내 있음</button>`,
    `<button class="pill" type="button" data-toggle="toilet" aria-pressed="${state.toilet}">${ic("#l-toilet", "i-sm")}공중화장실 500m</button>`,
    `<label class="pill">${ic("#l-ruler", "i-sm")}<select data-gear aria-label="내 장비 크기">${GEAR.map(([v, l]) => `<option value="${v}" ${state.gear === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>`,
  ].join("");
}

function renderList() {
  const list = filtered();
  $("#resultTitle").textContent = `캠핑장 ${list.length.toLocaleString()}곳`;
  $("#resultSub").textContent = META ? `고캠핑 ${ymd(META.sources[0]?.fetched_at)} 기준` : "";
  $("#cards").innerHTML = list.length ? list.slice(0, state.shown).map(card).join("")
    : `<div class="empty">${ic("#t-tent-off")}<b>조건에 맞는 캠핑장이 없어요</b><span data-wrap-ok>필터를 줄여 보세요.</span></div>`;
  $("#moreBtn").hidden = list.length <= state.shown;
  $("#moreBtn").innerHTML = `${ic("#l-chevron-down", "i-sm")}더 보기 <span class="num">${Math.min(PAGE, list.length - state.shown)}</span>`;
  renderMarkers(list);
}

/* ---------- 지도(카카오) ---------- */
function initMap() {
  const el = $("#map");
  if (!KAKAO_KEY) { el.innerHTML = `<div class="map-empty"><div>${ic("#l-map")}<p data-wrap-ok>지도 키가 설정되지 않아 목록만 표시합니다.</p></div></div>`; return; }
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_KEY)}&autoload=false&libraries=clusterer`;
  s.onload = () => kakao.maps.load(() => {
    map = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(36.4, 127.8), level: 13 });
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    clusterer = new kakao.maps.MarkerClusterer({ map, averageCenter: true, minLevel: 8, disableClickZoom: false,
      styles: [{ width: "42px", height: "42px", background: "rgba(31,157,92,.88)", color: "#fff", borderRadius: "50%", textAlign: "center", lineHeight: "42px", fontWeight: "800", fontSize: "13px" }] });
    renderMarkers(filtered());
  });
  s.onerror = () => { el.innerHTML = `<div class="map-empty"><p data-wrap-ok>지도를 불러오지 못했습니다(도메인 등록 확인). 목록은 그대로 쓸 수 있어요.</p></div>`; };
  document.head.append(s);
}
function renderMarkers(list) {
  if (!map || !clusterer) return;
  clusterer.clear(); markers.clear();
  const ms = list.map((c) => {
    const m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(c.lat, c.lng), title: c.name });
    kakao.maps.event.addListener(m, "click", () => openDetail(c.id));
    markers.set(c.id, m); return m;
  });
  clusterer.addMarkers(ms);
}

/* ---------- 상세 ---------- */
function providerBlock(c) {
  const p = META?.providers?.find((x) => x.id === c.booking.provider);
  if (!p) return "";
  const evs = p.events.slice(0, 4).map((e) => { const d = new Date(e.at); return `<time>${d.getMonth() + 1}.${String(d.getDate()).padStart(2, "0")}${e.time_known ? ` ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : ""}</time><span>${esc(e.label)}${e.needs_verification ? " · 확인 필요" : ""}</span>`; }).join("");
  return `<div class="box"><h3>${ic("#l-calendar", "i-sm")}${esc(p.name)} 예약 규칙</h3>
    ${p.rules.map((r) => `<p class="pre" data-wrap-ok>${esc(r.summary ?? r.label)}</p><span class="trust ${["A", "B"].includes(r.source?.tier) ? "ok" : ""}">${ic(["A", "B"].includes(r.source?.tier) ? "#l-shield-check" : "#l-circle-help", "i-xs")}${["A", "B"].includes(r.source?.tier) ? "공식 원문" : "확인 필요"} · ${esc(r.source?.checked_at ?? "")}</span>`).join("")}
    ${evs ? `<div class="ev">${evs}</div>` : ""}</div>`;
}
function detail(c) {
  const kinds = c.kinds.filter(([k]) => KIND[k]).map(([k, n]) => `<div class="fact"><small>${KIND[k][0]}</small><b class="num">${n}면</b></div>`).join("");
  const sizes = c.sizes.length ? c.sizes.map(([w, d, n]) => `${w}×${d}m${n ? ` ${n}면` : ""}`).join(" · ") : "정보 없음";
  const floors = c.floors.length ? c.floors.map(([f, n]) => `${f} ${n}`).join(" · ") : "정보 없음";
  const bookUrl = c.booking.url || c.homepage;
  const toilets = c.nearby_toilets?.nearest?.length ? c.nearby_toilets.nearest.map((t) => `<div class="row">${ic("#l-toilet", "i-sm")}<span>${esc(t.name)}${t.h24 ? " · 24시간" : ""}</span><span class="m">${t.m < 1000 ? `${t.m}m` : `${(t.m / 1000).toFixed(1)}km`}</span></div>`).join("") : `<p class="note">반경 2km 안 공중화장실 정보 없음</p>`;
  return `<div class="sheet-close"><button class="round" type="button" data-close aria-label="닫기">${ic("#l-x")}</button></div>
  <div class="d-hero">${c.img ? `<img src="${esc(c.img)}" alt="${esc(c.name)} 대표 사진" referrerpolicy="no-referrer"><span class="credit">사진: 고캠핑(운영자 등록)</span>` : ic("#t-tent")}</div>
  <div class="d-body">
    <div class="d-title"><h2>${esc(c.name)}</h2><p data-wrap-ok>${esc(c.addr ?? "")}</p></div>
    <div class="d-actions">
      <a class="act" href="https://map.kakao.com/link/to/${encodeURIComponent(c.name)},${c.lat},${c.lng}" target="_blank" rel="noopener">${ic("#l-navigation")}길찾기</a>
      ${c.tel ? `<a class="act" href="tel:${esc(c.tel.replace(/[^\d+]/g, ""))}">${ic("#l-phone")}전화</a>` : `<span class="act" aria-disabled="true">${ic("#l-phone")}전화 없음</span>`}
      ${c.homepage ? `<a class="act" href="${esc(c.homepage)}" target="_blank" rel="noopener">${ic("#l-globe")}홈페이지</a>` : `<span class="act" aria-disabled="true">${ic("#l-globe")}홈페이지 없음</span>`}
    </div>
    <div class="box box-book">
      <h3>${ic("#l-calendar", "i-sm")}예약</h3>
      <div class="tags">${c.booking.methods.map((m) => `<span class="tag ${/실시간/.test(m) ? "tag-green" : ""}">${esc(m)}</span>`).join("") || `<span class="tag">예약 방법 정보 없음</span>`}</div>
      ${bookUrl ? `<a class="btn btn-primary" href="${esc(bookUrl)}" target="_blank" rel="noopener">${ic("#l-external-link", "i-sm")}예약하러 가기</a>` : c.tel ? `<a class="btn btn-primary" href="tel:${esc(c.tel.replace(/[^\d+]/g, ""))}">${ic("#l-phone", "i-sm")}전화로 예약</a>` : ""}
      <p class="note" data-wrap-ok>빈자리와 최종 요금은 예약처 화면에서 확인됩니다. 모여라 캠핑은 결제를 받지 않고 공식 예약처로 연결합니다.${c.booking.url ? "" : c.homepage ? " (고캠핑에 예약 링크가 없어 홈페이지로 연결)" : c.tel ? " (온라인 예약 링크가 없어 전화 예약)" : " 고캠핑에 예약 링크·홈페이지·전화가 없어 운영자 확인이 필요합니다."}</p>
    </div>
    <div class="box"><h3>${ic("#t-coin", "i-sm")}요금</h3>
      ${c.fee ? `<p class="pre" data-wrap-ok>${esc(c.fee.text)}</p><span class="trust">${ic("#l-info", "i-xs")}한국관광공사 등록 안내 문구 · ${ymd(c.fee.checked_at)} 확인 · <a href="${esc(c.fee.url)}" target="_blank" rel="noopener">원문</a></span>` : `<p class="note" data-wrap-ok>공식 원천에 등록된 요금 안내가 없습니다. 예약처에서 확인하세요.</p>`}
    </div>
    <div class="box"><h3>${ic("#t-tent", "i-sm")}사이트</h3>
      <div class="facts">${kinds || `<div class="fact"><small>구성</small><b>정보 없음</b></div>`}</div>
      <div class="row">${ic("#l-ruler", "i-sm")}<span>${esc(sizes)}</span></div>
      <div class="row">${ic("#l-layers", "i-sm")}<span>바닥 ${esc(floors)}</span></div>
    </div>
    <div class="box"><h3>${ic("#l-info", "i-sm")}시설·규칙</h3>
      <div class="facts">
        <div class="fact"><small>반려견</small><b>${esc(c.pets ?? "정보 없음")}</b></div>
        <div class="fact"><small>화로대</small><b>${esc(c.fire ?? "정보 없음")}</b></div>
        <div class="fact"><small>화장실·샤워·개수대</small><b class="num">${c.toilets ?? "-"} · ${c.showers ?? "-"} · ${c.sinks ?? "-"}</b></div>
        <div class="fact"><small>운영</small><b>${esc([c.seasons.join("·"), c.days.join("·")].filter(Boolean).join(" / ") || "정보 없음")}</b></div>
      </div>
      ${c.amenities.length ? `<div class="tags">${c.amenities.map((a) => `<span class="tag">${esc(a)}</span>`).join("")}</div>` : ""}
      ${c.env.length || c.themes.length ? `<p class="note" data-wrap-ok>${esc([...c.env, ...c.themes].join(" · "))}</p>` : ""}
    </div>
    ${providerBlock(c)}
    <div class="box"><h3>${ic("#l-toilet", "i-sm")}주변 공중화장실</h3>${toilets}
      <p class="note" data-wrap-ok>행정안전부 공중화장실정보·OpenStreetMap, 직선거리 기준</p></div>
    <p class="note" data-wrap-ok>출처: 한국관광공사 고캠핑(${ymd(c.modified_at)} 수정) · 정보가 다르면 운영자 공지가 우선합니다.</p>
  </div>`;
}
function openDetail(id) {
  const c = ALL.find((x) => x.id === id);
  if (!c) return;
  state.open = id;
  history.replaceState(null, "", `#c=${id}`);
  $("#sheetRoot").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}"><div class="sheet-scrim" data-close></div><div class="sheet-panel">${detail(c)}</div></div>`;
  document.body.style.overflow = "hidden";
  if (map) { map.setLevel(Math.min(map.getLevel(), 7)); map.panTo(new kakao.maps.LatLng(c.lat, c.lng)); }
  $$(".card").forEach((el) => el.setAttribute("aria-current", String(el.dataset.open === id)));
}
function closeDetail() { state.open = null; $("#sheetRoot").innerHTML = ""; document.body.style.overflow = ""; history.replaceState(null, "", location.pathname); }

/* ---------- 이벤트 ---------- */
function rerender(resetPage = true) { if (resetPage) state.shown = PAGE; save(); renderChips(); renderList(); }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-open],[data-close],[data-area],[data-kind],[data-toggle],#moreBtn,#viewSwitch,#clearQ,#nearBtn");
  if (!t) return;
  if (t.dataset.open) return openDetail(t.dataset.open);
  if (t.hasAttribute("data-close")) return closeDetail();
  if (t.dataset.area) { state.area = t.dataset.area; return rerender(); }
  if (t.dataset.kind) { state.kinds.has(t.dataset.kind) ? state.kinds.delete(t.dataset.kind) : state.kinds.add(t.dataset.kind); return rerender(); }
  if (t.dataset.toggle) { state[t.dataset.toggle] = !state[t.dataset.toggle]; return rerender(); }
  if (t.id === "moreBtn") { state.shown += PAGE; return renderList(); }
  if (t.id === "clearQ") { state.q = ""; $("#q").value = ""; return rerender(); }
  if (t.id === "viewSwitch") {
    const toMap = document.body.dataset.view !== "map";
    document.body.dataset.view = toMap ? "map" : "list";
    t.innerHTML = toMap ? `${ic("#l-list", "i-sm")}목록 보기` : `${ic("#l-map", "i-sm")}지도 보기`;
    if (map) setTimeout(() => map.relayout(), 50);
  }
  if (t.id === "nearBtn") {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((p) => { state.here = { lat: p.coords.latitude, lng: p.coords.longitude }; state.sort = "near"; $("#sort").value = "near"; rerender(); }, () => alert("위치 권한이 없어 가까운 순으로 정렬할 수 없어요."));
  }
});
document.addEventListener("change", (e) => {
  if (e.target.matches("[data-gear]")) { state.gear = e.target.value; rerender(); }
  if (e.target.id === "sort") {
    state.sort = e.target.value;
    if (state.sort === "near" && !state.here) { $("#nearBtn").click(); return; }
    rerender();
  }
});
let qTimer;
document.addEventListener("input", (e) => { if (e.target.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; rerender(); }, 160); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.open) closeDetail(); });
const head = () => document.documentElement.style.setProperty("--head", `${$(".top").offsetHeight + $(".bar").offsetHeight}px`);
new ResizeObserver(head).observe(document.body);

async function boot() {
  load();
  try {
    const [cg, meta] = await Promise.all([fetch("data/campgrounds.json").then((r) => r.json()), fetch("data/meta.json").then((r) => r.json()).catch(() => null)]);
    ALL = cg.map(withDefaults); META = meta;
  } catch (e) {
    $("#cards").innerHTML = `<div class="empty">${ic("#l-circle-alert")}<b>데이터를 불러오지 못했어요</b><span data-wrap-ok>잠시 후 다시 시도해 주세요.</span></div>`;
    return;
  }
  renderChips(); renderList(); head(); initMap();
  if (state.open) openDetail(state.open);
}
boot();

</script>
