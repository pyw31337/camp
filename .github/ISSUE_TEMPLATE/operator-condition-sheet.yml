name: 운영자 공식 조건표 제출(무료)
description: 캠핑장 운영자가 사이트·구역별 조건을 직접 등록·갱신합니다. 순위 구매·광고와 무관한 무료 등록입니다.
title: "[운영자 조건표] "
labels: ["operator-sheet"]
body:
  - type: markdown
    attributes:
      value: |
        모여라캠핑은 이 내용을 **운영자 제출(검수 전)** 으로 받고, 고캠핑 등록 전화번호 또는 공식 홈페이지로 운영자 본인임을 확인한 뒤 ‘원문 대조’ 조건표로 공개합니다.
        모르는 항목은 비워 두세요. 빈칸은 화면에 ‘확인 필요’로 남고, 가능·불가로 추정하지 않습니다. 입력 의미는 `docs/PILOT_INTAKE_CONTRACT.md` 3~5절을 따릅니다.
  - type: input
    id: campground
    attributes:
      label: 캠핑장 이름과 고캠핑 ID(아는 경우)
    validations:
      required: true
  - type: input
    id: verify_channel
    attributes:
      label: 본인 확인 방법
      description: 고캠핑에 등록된 대표 전화로 회신받기 / 공식 홈페이지 공지에 확인 문구 게시 중 선택해 적어 주세요. 개인 연락처는 적지 마세요.
    validations:
      required: true
  - type: textarea
    id: zones
    attributes:
      label: 구역별 규격·바닥·주차
      description: 구역마다 한 줄. "구역명 | 가로×세로(m) | 바닥 | 주차(텐트 옆/공용 주차장/하차 후 이동/짐수레) | 면수"
      placeholder: |
        A구역 | 8×10 | 파쇄석 | 텐트 옆 | 18
        D구역 | 6×7 | 데크 | 공용 주차장 도보 1분 | 10
    validations:
      required: true
  - type: textarea
    id: power
    attributes:
      label: 전기
      description: 사이트당 최대 W 또는 A, 추가 요금, 적용 구역
      placeholder: "전 구역 사이트당 1,000W(약 4.5A), 기본 포함"
  - type: textarea
    id: fire
    attributes:
      label: 장작·숯·화로대
      description: 장작 허용(허용/금지/지정 구역만), 숯, 화로대 받침 필수 여부, 장작 판매
  - type: textarea
    id: shelter
    attributes:
      label: 텐트·타프·캐노피
      description: 사이트당 텐트·타프 수, 3×3m 캐노피 가능 여부, 최대 규격
  - type: textarea
    id: sanitary
    attributes:
      label: 화장실·샤워·개수대
      description: 공용/개별, 개수, 온수 시간
  - type: textarea
    id: rentals
    attributes:
      label: 대여 품목·요금
      description: 품목 | 1박 요금 | 보증금 | 사전 예약 필요 여부
  - type: textarea
    id: kids
    attributes:
      label: 아이 시설·물놀이·체험
      description: 시설명 | 운영 기간 | 이용료 | 나이 제한
  - type: input
    id: valid_from
    attributes:
      label: 이 조건이 적용되는 시작일
      placeholder: "2026-11-01"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 확인
      options:
        - label: 위 내용은 캠핑장 운영자로서 사실이며, 모여라캠핑이 출처(운영자 제출)와 확인일을 표시해 공개하는 데 동의합니다.
          required: true
