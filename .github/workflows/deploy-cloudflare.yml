name: Deploy to Cloudflare Pages

# main에 반영되거나 매일 데이터 동기화 시각 뒤에 정적 사이트와 캘린더 구독 피드를 배포한다.
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID Secret이 없으면 조립까지만 하고 배포는 건너뛴다.
on:
  # PR에서는 미리보기 주소로, main에서는 정식 주소로 배포한다.
  pull_request:
    paths:
      - "design/mockup-v2/**"
      - "design/explore/**"
      - "pipeline/**"
      - "scripts/assemble-site.mjs"
      - ".github/workflows/deploy-cloudflare.yml"
  push:
    branches: [main]
    paths:
      - "design/mockup-v2/**"
      - "design/explore/**"
      - "pipeline/**"
      - "scripts/assemble-site.mjs"
      - ".github/workflows/deploy-cloudflare.yml"
  schedule:
    # 매일 03:47 KST (18:47 UTC) — 예약 규칙에서 다가오는 일정을 다시 계산
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Assemble and deploy
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'moyeora' }}
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && 'preview' || 'main' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build calendar feeds
        working-directory: pipeline
        run: |
          npm run validate
          npm run ics -- 120
      - name: Reuse the last published explorer data
        # 화면만 바뀐 배포는 같은 주소에 마지막으로 공개된 탐색 데이터를 그대로 쓴다(데이터 갱신은 Data sync가 배포).
        run: |
          base="https://moyeora-6pd.pages.dev"; [ "$DEPLOY_BRANCH" = "preview" ] && base="https://preview.moyeora-6pd.pages.dev"
          mkdir -p pipeline/out/explore
          curl -fsS "$base/data/campgrounds.json" -o pipeline/out/explore/campgrounds.json && curl -fsS "$base/data/meta.json" -o pipeline/out/explore/meta.json \
            || { rm -f pipeline/out/explore/*.json; echo "::notice::공개된 탐색 데이터가 아직 없어 시안을 첫 화면으로 배포합니다."; }
      - run: node scripts/assemble-site.mjs
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY || secrets.KAKAO_JS_KEY }}
      - name: Skip notice
        if: env.HAS_CF != 'true'
        run: echo "Cloudflare Secret이 없어 배포를 건너뜁니다. docs/OWNER_TODO.md 3단계를 참고하세요."
      - name: Ensure Pages project exists
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler@4.92.0 pages project create "$PROJECT" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler@4.92.0 pages deploy site --project-name="$PROJECT" --branch="$DEPLOY_BRANCH" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
