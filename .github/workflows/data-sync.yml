name: Data sync

on:
  schedule:
    # 매일 03:17 KST (18:17 UTC)
    - cron: "17 18 * * *"
  workflow_dispatch:
  # 같은 저장소의 PR에서도 실행해 인증키·수집기를 병합 전에 확인한다(포크 PR에는 Secret이 전달되지 않음).
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/data-sync.yml"

permissions:
  contents: write

concurrency:
  # PR 검증의 장시간 보조 수집이 main의 실제 기준 카탈로그 발행을 막지 않게
  # ref별로 대기열을 분리한다. 같은 ref 안에서는 순차 실행되어 원본 파일 충돌을 막는다.
  group: data-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync public sources and build open calendar
    runs-on: ubuntu-latest
    # 그날 수집한 데이터를 실행마다 새로 띄우는 PostgreSQL에 실제로 넣어 대조한다(Claude 담당, docs/DB_BUILD_PLAN.md 6).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate
      - run: npm run calendar -- 120
      - run: npm run ics -- 120
      - name: Check data.go.kr key (never prints the key)
        run: npm run check:keys
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY || secrets.KAKAO_JS_KEY }}
      - name: Sync GoCamping (skips when the key secret is not set)
        run: npm run sync:gocamping
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Migrate PostgreSQL and import the GoCamping snapshot
        # DATABASE_URL은 운영 DB에서만 제공한다. 값이 없을 때 공개 카탈로그
        # 발행은 계속 가능하지만, DB 적재를 성공한 것으로 표기하지 않는다.
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=PostgreSQL import skipped::DATABASE_URL secret is not configured."
            exit 0
          fi
          npm run db:migrate
          npm run db:import-gocamping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ vars.DATABASE_SSL }}
      # 전국 기준 시설·예약 캘린더는 부가 시설 수집 실패와 관계없이 먼저 공개한다.
      - name: Build the read-only GitHub Pages data payload
        run: npm run publish:web-catalog
        env:
          # 공개 카탈로그에 기준 시설을 내보내려면 공공데이터포털의 보존·재배포 조건을
          # 검토한 뒤 repository variable을 정확히 true로 설정한다.
          PUBLISH_GOCAMPING_CATALOG: ${{ vars.GOCAMPING_CATALOG_PUBLISH_APPROVED }}
      - name: Publish refreshed calendar and approved discovery data
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          if git diff --quiet -- camping-atlas/public/data; then
            echo "No public data changes to commit."
            exit 0
          fi
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camping-atlas/public/data
          git commit -m "chore(data): refresh public camping catalog"
          git push
      - name: Probe undocumented data.go.kr endpoints
        continue-on-error: true
        run: npm run probe
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/geocode-toilets.json
            pipeline/.cache/osm-toilets.json
            pipeline/.cache/osm-rest-stops.json
          key: geocode-v3-${{ github.run_id }}
          restore-keys: geocode-v3-
      - name: Sync public toilets and link to campgrounds
        continue-on-error: true
        run: npm run sync:toilets
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Sync rest areas and drowsy shelters
        continue-on-error: true
        run: npm run sync:rest-stops
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
      - name: Collect campground licences (LOCALDATA) and match to GoCamping
        # 키 불필요. 고캠핑에 없는 숨은 캠핑장 후보·폐업 교차 확인·시설 규모 등 인허가 세부 정보.
        run: npm run sync:localdata-campgrounds
        continue-on-error: true
      - name: Discover free public camp sites (candidates only)
        continue-on-error: true
        run: npm run discover:public-free
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Load today's data into a throwaway PostgreSQL and reconcile
        # 운영 DB가 없어도 마이그레이션·적재·건수 대조·품질 규칙을 매일 검증한다.
        # 임시 DB 전용으로 이용허락 미확인 원천도 넣어 본다(운영 DB 적재는 위 단계가 data_source 허용값을 지킨다).
        if: always()
        run: |
          if [ ! -f out/campgrounds.json ]; then echo "::notice::고캠핑 결과가 없어 DB 검증을 건너뜁니다."; exit 0; fi
          npm run db:migrate
          npm run db:import-gocamping
          npm run db:import-enrichment
          npm run db:import-enrichment
          npm run db:verify-load
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          IMPORT_UNVERIFIED_LICENSES: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-out
          path: pipeline/out/
          retention-days: 14
