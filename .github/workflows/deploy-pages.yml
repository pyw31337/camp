name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "camping-atlas/**"
      - "design/renewal/**"
      - "scripts/publish-explorer-pages.mjs"
      - ".github/workflows/deploy-pages.yml"
  # Data sync가 GITHUB_TOKEN으로 커밋한 데이터는 push 이벤트를 만들지 않으므로, 수집이 끝나면 다시 배포한다.
  workflow_run:
    workflows: ["Data sync", "Weekly forecast", "Trip extras", "Culture events", "Trending mentions"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 끊지 않는다(cancel-in-progress: false). 대기열에는 최신 1건만 남으므로 결국 최신 main이 배포된다.
# true였을 때 데이터 자동 커밋이 몇 분마다 들어와 코드 수정 배포가 계속 취소돼 라이브 반영이 굶었다(2026-10-20 레일 고장).
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camping-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: camping-atlas/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm run install:ci
      - run: npm run lint
      - run: npm run build:pages
      - name: Refresh the explorer screen to the latest design
        # 데이터는 매일 Data sync가 커밋하고, 화면(design/explore)은 바뀌면 배포 때 바로 반영한다.
        working-directory: .
        run: |
          # 고캠핑에서 지워진 원본(카드 사진 동기화의 failures.json)을 색인에서 빼려고 media 브랜치를 먼저 받는다.
          git fetch --depth=1 origin +media:refs/remotes/origin/media || true
          node scripts/build-renewal-data.mjs
          node scripts/publish-explorer-pages.mjs --shell-only camping-atlas/dist/client
          # 목록용 가벼운 카탈로그 + 상세용 원본 샤드(내용 동일, 원본 campgrounds.json도 그대로 둠)
          # t41u: 비현실 값(민간 1박 2만원 미만 요금 등) 표시값 보정 — 원본은 *_raw로 보관
          node pipeline/scripts/apply-fee-sanity.mjs --data camping-atlas/dist/client/explore/data
          # t41u-2: 이름표 값 상식 범위(전기 W·사이트 수·규격·입퇴실·매너타임·인원·거리 등, lib/value-sanity.mjs) 밖은 화면에서만 숨김(_hid에 보관)
          node pipeline/scripts/apply-value-sanity.mjs --data camping-atlas/dist/client/explore/data
          node scripts/split-catalog.mjs camping-atlas/dist/client/explore/data
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY || secrets.KAKAO_JS_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://zgnetdxqzsnmzdvoxzbw.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Add self-hosted official images from the media branch
        # data-sync가 media 브랜치(공식 사진 webp, 한 커밋)를 갱신한다. 있으면 /camp/media/ 로 함께 배포한다.
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin media >/dev/null 2>&1; then
            git fetch --depth=1 origin +media:refs/remotes/origin/media
            mkdir -p camping-atlas/dist/client/media
            git archive origin/media | tar -x -C camping-atlas/dist/client/media
            du -sh camping-atlas/dist/client/media
            node scripts/dedupe-media-cards.mjs camping-atlas/dist/client/media
            node scripts/verify-official-media.mjs camping-atlas/dist/client
          else
            echo "::error::공식 사진 media 브랜치를 찾지 못했습니다. 사진이 빠진 탐색 화면은 배포하지 않습니다."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: camping-atlas/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
