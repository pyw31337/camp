name: Pipeline quality

on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-quality.yml"
      - "camping-atlas/public/explore/data/campgrounds.json"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-quality.yml"
      - "camping-atlas/public/explore/data/campgrounds.json"

permissions:
  contents: read

jobs:
  test:
    name: Test and validate registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      # 사진 중복 거르기 테스트가 package.json의 sharp를 쓴다.
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: 당일 장소 시드 멱등(다시 돌려도 발행 데이터 그대로)
        run: node scripts/check-dayuse-idempotent.mjs
      - run: npm run calendar -- 90
      - run: npm run ics -- 120
