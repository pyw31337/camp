name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "camping-atlas/**"
      - ".github/workflows/deploy-pages.yml"
  # Data sync가 GITHUB_TOKEN으로 커밋한 데이터는 push 이벤트를 만들지 않으므로, 수집이 끝나면 다시 배포한다.
  workflow_run:
    workflows: ["Data sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camping-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: camping-atlas/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm run install:ci
      - run: npm run lint
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: camping-atlas/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
