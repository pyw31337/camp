name: Naver API free-tier watch

# 네이버 검색 API(NAVER API HUB)가 유료로 바뀌지 않았는지 매일 확인한다(소유자 지시: 절대 유료로 쓰지 않기).
# - NCP 공식 가이드의 “한시적으로 무료” 문장이 사라지거나 유료 전환 표현이 보이거나 페이지를 못 읽으면 실패 + 이슈로 알림.
# - 같은 확인을 discover-naver.mjs도 호출 전에 매번 하므로, 감지되는 즉시 수집은 자동으로 멈춘다.
# - 완전히 끄려면 저장소 Settings → Variables에 NAVER_API_ENABLED=false.
on:
  schedule:
    # 매일 08:53 KST
    - cron: "53 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/lib/naver-guard.mjs"
      - ".github/workflows/naver-free-tier-watch.yml"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check NAVER API HUB free tier
        id: check
        run: node scripts/check-naver-free-tier.mjs
      - name: Open an alert issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ 네이버 API HUB 무료 확인 실패 — 네이버 수집 자동 중단됨"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "이미 열린 알림 이슈가 있습니다."; exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<'BODY'
          매일 감시(naver-free-tier-watch)에서 NCP 공식 가이드의 ‘한시적으로 무료’ 문장을 확인하지 못했습니다.
          - 수집기(discover-naver.mjs)는 같은 확인에 실패하면 네이버 API를 **호출하지 않습니다**(자동 중단).
          - 원문: https://guide.ncloud-docs.com/docs/apihub-overview
          - 확인할 것: NCP 콘솔 공지·요금 페이지에서 유료 전환 여부. 유료라면 저장소 변수 `NAVER_API_ENABLED=false`로 완전히 끄고, HUB Application을 삭제하세요.
          - 단순 접속 오류였다면 다음 날 감시가 통과하면 이 이슈를 닫으면 됩니다.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY
          )"
