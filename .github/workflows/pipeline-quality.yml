name: Pipeline quality

on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-quality.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline-quality.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test and validate registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm run calendar -- 90
      - run: npm run ics -- 120
