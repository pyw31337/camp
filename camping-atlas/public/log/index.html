<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찜 기록 · 모여라캠핑</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; background: #f6f5f1; color: #1c1b18; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #fff; border-bottom: 1px solid #e6e2d8; }
  header a { color: #3d3a9c; text-decoration: none; font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { margin: 0 0 6px; font-size: 1.4rem; }
  .muted { color: #6b675f; font-size: .9rem; }
  .warn { background: #fff6e5; border: 1px solid #f0d9a0; border-radius: 10px; padding: 14px 16px; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: .9rem; vertical-align: top; }
  th { background: #faf9f6; font-weight: 700; }
  .add { color: #1a7f37; font-weight: 700; }
  .remove { color: #b42318; font-weight: 700; }
  .empty { padding: 40px; text-align: center; color: #6b675f; }
</style>
</head>
<body>
<header>
  <strong>모여라캠핑 · 찜 기록</strong>
  <a href="../explore/">← 사이트로</a>
</header>
<main>
  <h1>찜 기록</h1>
  <p class="muted">누가 언제 찜하거나 해제했는지 최근 200건입니다.</p>
  <div id="status"></div>
  <div id="table"></div>
</main>
<script>
const SB = {
  url: "https://zgnetdxqzsnmzdvoxzbw.supabase.co",
  key: "" // ← Supabase anon key를 여기에 넣어야 합니다
};
async function load() {
  const status = document.getElementById("status");
  const box = document.getElementById("table");
  if (!SB.key) {
    status.innerHTML = `<div class="warn"><b>아직 연결 키가 없습니다.</b><br>Supabase 대시보드 → Settings → API → <code>anon</code> 키를 이 페이지 코드의 <code>SB.key</code>에 넣어 주세요. 키를 넣기 전에는 기록을 불러올 수 없습니다.</div>`;
    return;
  }
  status.innerHTML = `<p class="muted">불러오는 중…</p>`;
  try {
    const r = await fetch(`${SB.url}/rest/v1/save_log?select=created_at,action,campground_id,ip,language,timezone,screen,platform,user_agent&order=created_at.desc&limit=200`, {
      headers: { apikey: SB.key, Authorization: `Bearer ${SB.key}` }
    });
    if (!r.ok) { status.innerHTML = `<div class="warn">불러오기 실패 (${r.status}). SQL을 실행했는지, 키가 맞는지 확인해 주세요.</div>`; return; }
    const rows = await r.json();
    status.innerHTML = `<p class="muted">${rows.length}건</p>`;
    if (!rows.length) { box.innerHTML = `<div class="empty">아직 기록이 없습니다.</div>`; return; }
    box.innerHTML = `<table><thead><tr><th>시각</th><th>동작</th><th>업장 ID</th><th>IP</th><th>기기</th></tr></thead><tbody>${rows.map(x => `<tr>
      <td>${new Date(x.created_at).toLocaleString("ko-KR")}</td>
      <td class="${x.action === "add" ? "add" : "remove"}">${x.action === "add" ? "찜" : "해제"}</td>
      <td>${x.campground_id}</td>
      <td>${x.ip || "-"}</td>
      <td>${x.platform || ""} ${x.screen || ""}<br><span class="muted">${(x.user_agent || "").slice(0, 90)}</span></td>
    </tr>`).join("")}</tbody></table>`;
  } catch (e) {
    status.innerHTML = `<div class="warn">오류: ${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
