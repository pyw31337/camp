name: Data sync

on:
  schedule:
    # 매일 03:17 KST (18:17 UTC)
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      geocode_max_calls:
        description: "공중화장실 주소 지오코딩 최대 호출 수 (기본 2000, 초기 전량 보강만 30000 지정)"
        required: false
        default: "2000"
        type: string
      sync_profile:
        description: "공유 data.go.kr 일일 한도 배분 (auto는 사진 보강일·관광 보강일을 교차 실행)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - media-backfill
          - tour-enrichment
          - free-audit
      naver_mention_max_calls:
        description: "네이버 웹 언급 최대 호출 수 (기본 8000). 같은 날 다시 돌릴 때는 일 한도 25,000의 절반(12,500) 안에서 남은 만큼만"
        required: false
        default: "8000"
        type: string
  # 같은 저장소의 PR에서도 실행해 인증키·수집기를 병합 전에 확인한다(포크 PR에는 Secret이 전달되지 않음).
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/data-sync.yml"

permissions:
  contents: write

concurrency:
  # PR 검증의 장시간 보조 수집이 main의 실제 기준 카탈로그 발행을 막지 않게
  # ref별로 대기열을 분리한다. 같은 ref 안에서는 순차 실행되어 원본 파일 충돌을 막는다.
  group: data-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync public sources and build open calendar
    runs-on: ubuntu-latest
    # 그날 수집한 실제 파일을 실행마다 새로 띄우는 PostgreSQL에 넣어 본다(아래 마지막 단계, 비용 없음).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate
      - run: npm run calendar -- 120
      - run: npm run ics -- 120
      - name: Check data.go.kr key (never prints the key)
        run: npm run check:keys
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATA_GO_KR_CHECK_SCOPE: ESSENTIAL
      - name: Plan shared data.go.kr request budget
        # 고캠핑 imageList와 TourAPI는 개발 키의 일일 1,000건 한도를 공유한다.
        # 사진이 없는 시설을 빨리 메우는 날과 TourAPI 상품·요금을 넓히는 날을 분리한다.
        id: source-plan
        shell: bash
        run: |
          requested="${{ inputs.sync_profile || 'auto' }}"
          profile="$requested"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            profile="verify"
          elif [ "$profile" = "auto" ] || [ -z "$profile" ]; then
            # 다음 정기 실행(수·금)은 사진 공백을 먼저 메우고, 나머지 날은 TourAPI를 보강한다.
            case "$(TZ=Asia/Seoul date +%u)" in
              3|5) profile="media-backfill" ;;
              7) profile="free-audit" ;;
              *) profile="tour-enrichment" ;;
            esac
          fi
          case "$profile" in
            media-backfill)
              image_calls=880; max_stored_per_camp=1; nearby_calls=0; fee_calls=0; product_calls=0; collect_tour=false; collect_free=false ;;
            tour-enrichment)
              image_calls=0; max_stored_per_camp=0; nearby_calls=150; fee_calls=220; product_calls=500; collect_tour=true; collect_free=false ;;
            free-audit)
              image_calls=0; max_stored_per_camp=0; nearby_calls=100; fee_calls=180; product_calls=420; collect_tour=true; collect_free=true ;;
            verify)
              image_calls=0; max_stored_per_camp=0; nearby_calls=0; fee_calls=0; product_calls=0; collect_tour=false; collect_free=false ;;
            *) echo "알 수 없는 sync_profile: $profile" >&2; exit 1 ;;
          esac
          {
            echo "profile=$profile"
            echo "image_calls=$image_calls"
            echo "max_stored_per_camp=$max_stored_per_camp"
            echo "nearby_calls=$nearby_calls"
            echo "fee_calls=$fee_calls"
            echo "product_calls=$product_calls"
            echo "collect_tour=$collect_tour"
            echo "collect_free=$collect_free"
          } >> "$GITHUB_OUTPUT"
          echo "data.go.kr profile=$profile imageList=$image_calls photos_per_camp=$max_stored_per_camp nearby=$nearby_calls fee=$fee_calls products=$product_calls free_audit=$collect_free"
      - name: Sync GoCamping (skips when the key secret is not set)
        run: npm run sync:gocamping
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      # 전국 기준 시설·예약 캘린더는 부가 시설 수집 실패와 관계없이 먼저 공개한다.
      - name: Build the read-only GitHub Pages data payload
        run: npm run publish:web-catalog
        env:
          # 공개 카탈로그에 기준 시설을 내보내려면 공공데이터포털의 보존·재배포 조건을
          # 검토한 뒤 repository variable을 정확히 true로 설정한다.
          PUBLISH_GOCAMPING_CATALOG: ${{ vars.GOCAMPING_CATALOG_PUBLISH_APPROVED }}
          # 권리 철회처럼 공개 카탈로그를 의도적으로 내릴 때만 별도로 true를 준다.
          # 일시적 API 실패·취소된 실행은 직전 검증 카탈로그를 유지한다.
          ALLOW_GOCAMPING_CATALOG_WITHDRAWAL: ${{ vars.ALLOW_GOCAMPING_CATALOG_WITHDRAWAL }}
      - name: Restore GoCamping imageList cache
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/gocamping-images.json
          key: gocamping-images-v1-${{ github.run_id }}
          restore-keys: gocamping-images-v1-
      - name: Check out the media branch (orphan, images only)
        # 사진 수집은 TourAPI·무료 후보 조사보다 먼저 실행한다. 같은 키의 일일 한도가
        # 앞 단계에서 소진되어 공식 사진이 0건으로 끝나는 문제를 막는다.
        id: media
        continue-on-error: true
        working-directory: .
        run: |
          MEDIA_DIR="$RUNNER_TEMP/media"
          if git ls-remote --exit-code --heads origin media >/dev/null 2>&1; then
            git fetch --depth=1 origin +media:refs/remotes/origin/media
            git worktree add -B media "$MEDIA_DIR" origin/media
          else
            git worktree add --detach "$MEDIA_DIR"
            git -C "$MEDIA_DIR" switch --orphan media
          fi
          echo "dir=$MEDIA_DIR" >> "$GITHUB_OUTPUT"
      - name: Sync official campground images (webp)
        id: images
        if: steps.media.outcome == 'success'
        continue-on-error: true
        run: npm run sync:images
        env:
          MEDIA_DIR: ${{ steps.media.outputs.dir }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          IMAGE_LIST_MAX_CALLS: ${{ steps.source-plan.outputs.image_calls }}
          IMAGE_MAX_STORED_PER_CAMP: ${{ steps.source-plan.outputs.max_stored_per_camp }}
          IMAGE_MAX_DOWNLOADS: ${{ github.event_name == 'pull_request' && '20' || '1500' }}
          IMAGE_MAX_PER_CAMP: ${{ vars.IMAGE_MAX_PER_CAMP || '6' }}
          IMAGE_MAX_BYTES: '12000000'
      - name: Publish the media branch (single commit, force push)
        # 소유자 요청(2026-10-13)으로 공식 사진을 자체 저장한다. 권리자 요청 시 media 브랜치에서 지우고 재배포한다.
        if: steps.images.outcome == 'success' && github.event_name != 'pull_request' && vars.GOCAMPING_IMAGES_PUBLISH != 'false'
        working-directory: ${{ steps.media.outputs.dir }}
        run: |
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then echo "이미지 변경 없음."; exit 0; fi
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore(media): official campground images $(date -u +%Y-%m-%dT%H:%MZ)"
          if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend -m "$MSG"; else git commit -q -m "$MSG"; fi
          git push --force origin media
          du -sh --exclude=.git .
      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/geocode-toilets.json
            pipeline/.cache/osm-toilets.json
            pipeline/.cache/osm-rest-stops.json
            pipeline/.cache/tour-intro.json
            pipeline/.cache/tour-pois.json
            pipeline/.cache/osm-shops.json
            pipeline/.cache/tour-stay.json
            pipeline/.cache/tour-products.json
            pipeline/.cache/social-search.json
            pipeline/.cache/web-mentions.json
          key: source-cache-v4-${{ github.run_id }}
          restore-keys: |
            source-cache-v4-
            source-cache-v3-
      - name: Week key for the OSM extract
        id: osmweek
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore OSM Korea extract
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/osm-extract.json
          key: osm-extract-v1-${{ steps.osmweek.outputs.week }}
          restore-keys: osm-extract-v1-
      - name: Build OSM extract from Geofabrik (weekly)
        # 공용 Overpass 서버가 자주 504라, 한국 전체 OSM 파일(Geofabrik)을 주 1회 받아 화장실·마트·편의점·주유·의료·휴게소만 뽑는다.
        # 이후 단계는 OSM_EXTRACT가 있으면 네트워크 질의 없이 이 추출본을 쓴다.
        continue-on-error: true
        timeout-minutes: 15
        run: |
          AGE=$(node -e 'try{const d=require("./.cache/osm-extract.json");console.log(Math.floor((Date.now()-Date.parse(d.fetched_at))/864e5))}catch{console.log(999)}')
          if [ "$AGE" -lt 7 ]; then
            echo "이번 주 OSM 추출본 사용(${AGE}일 전)"
          else
            sudo apt-get install -y -qq osmium-tool >/dev/null
            curl -fsSL --retry 2 -o "$RUNNER_TEMP/kr.pbf" https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
            ls -lh "$RUNNER_TEMP/kr.pbf"
            osmium tags-filter "$RUNNER_TEMP/kr.pbf" \
              nwr/shop=supermarket,convenience,butcher,greengrocer,hardware,outdoor \
              nwr/amenity=fuel,pharmacy,hospital,toilets,charging_station \
              nwr/highway=services,rest_area \
              -o "$RUNNER_TEMP/pois.pbf" --overwrite
            osmium export "$RUNNER_TEMP/pois.pbf" -f geojsonseq --attributes type,id -o "$RUNNER_TEMP/pois.geojsonseq" --overwrite
            node scripts/osm-extract.mjs "$RUNNER_TEMP/pois.geojsonseq" .cache/osm-extract.json
          fi
          echo "OSM_EXTRACT=$PWD/.cache/osm-extract.json" >> "$GITHUB_ENV"
      - name: Sync public toilets and link to campgrounds
        continue-on-error: true
        run: npm run sync:toilets
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          # 카카오 로컬 일일 한도는 앱 하나에 공유된다. PR 실행은 캐시만 쓰고(0), main 예약·수동 실행이 채운다.
          # 캐시는 브랜치별로 분리된다. main 정기 실행은 2,000건씩 이어서 보강하고,
          # 초기 전량 보강만 workflow_dispatch 입력값으로 30,000건을 명시한다.
          GEOCODE_MAX_CALLS: ${{ github.event_name == 'pull_request' && '0' || (github.event_name == 'workflow_dispatch' && inputs.geocode_max_calls) || '2000' }}
      - name: Restore collected caches from the shared data branch
        # 여러 날에 걸쳐 쌓는 후기·웹 언급 캐시는 Actions 캐시만으로는 잃기 쉽다(실패한 실행은 저장 안 됨, 일부만 복원).
        # collected-data 브랜치(단일 커밋)가 원본이다. 다른 에이전트도 git fetch origin collected-data로 바로 읽는다.
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin collected-data >/dev/null 2>&1; then
            git fetch -q --depth=1 origin +collected-data:refs/remotes/origin/collected-data
            for f in social-search web-mentions; do
              if git cat-file -e "origin/collected-data:cache/$f.json.gz" 2>/dev/null; then
                git show "origin/collected-data:cache/$f.json.gz" | gunzip > ".cache/$f.json.branch"
                # 브랜치 쪽이 더 크면(더 많이 쌓였으면) 그것을 쓴다.
                if [ ! -s ".cache/$f.json" ] || [ "$(stat -c%s ".cache/$f.json.branch")" -ge "$(stat -c%s ".cache/$f.json")" ]; then mv ".cache/$f.json.branch" ".cache/$f.json"; else rm ".cache/$f.json.branch"; fi
              fi
            done
            ls -la .cache/social-search.json .cache/web-mentions.json 2>/dev/null || true
          else
            echo "collected-data 브랜치가 아직 없습니다(첫 저장 때 만들어짐)."
          fi
      - name: Sync campground social search (Kakao Daum blog/cafe/image/video)
        # 사람들의 후기·사진·영상(링크와 썸네일 주소만 저장, 이미지 재호스팅 안 함). 다음 검색 한도 일 5만·종류별 3만. 캠핑장당 7회(후기·카페·사진·영상 + 배치도 글·배치도 사진·요금 후기)로 하루 약 1,300곳.
        continue-on-error: true
        run: npm run sync:social
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SOCIAL_MAX_CALLS: ${{ github.event_name == 'pull_request' && '0' || '9100' }}
      - name: Sync web mentions (NAVER search blog·cafe·web·kin + robots-allowed blog text)
        # 네이버 검색 API(HUB, 한시 무료 월 775,000건) 요약과 robots가 허용한 블로그(티스토리 등) 본문의 사실 문장.
        # 캠핑장당 7회, 14일 순환. 한 실행 8,000회(일 한도 25,000의 절반 미만). naver-guard가 0원 확인·월 예산·402 즉시 중단.
        # 네이버 블로그·카페·예약처럼 robots가 AI 수집기를 막은 곳은 본문을 읽지 않는다(API 요약만).
        continue-on-error: true
        timeout-minutes: 50
        run: node scripts/sync-web-mentions.mjs
        env:
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          NAVER_API_ENABLED: ${{ vars.NAVER_API_ENABLED }}
          NAVER_MONTHLY_CAP: ${{ vars.NAVER_MONTHLY_CAP }}
          NAVER_MENTION_MAX_CALLS: ${{ github.event_name == 'pull_request' && '0' || (github.event_name == 'workflow_dispatch' && inputs.naver_mention_max_calls) || '8000' }}
          BODY_MINUTES: ${{ github.event_name == 'pull_request' && '0' || '30' }}
      - name: Save collected caches to the shared data branch (single commit, force push)
        # 수집 직후 바로 저장한다(뒤 단계가 실패해도 남게). 다른 에이전트 공유용: cache/*.json.gz(누적 캐시), out/*.json.gz(이번 결과), MANIFEST.json
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          DIR="$RUNNER_TEMP/collected"
          if git ls-remote --exit-code --heads origin collected-data >/dev/null 2>&1; then
            git worktree add -q -B collected-data "$DIR" origin/collected-data
          else
            git worktree add -q --detach "$DIR" && git -C "$DIR" switch -q --orphan collected-data
          fi
          mkdir -p "$DIR/cache" "$DIR/out"
          for f in social-search web-mentions; do [ -s ".cache/$f.json" ] && gzip -9c ".cache/$f.json" > "$DIR/cache/$f.json.gz"; done
          for f in campground-social campground-web; do [ -s "out/$f.json" ] && gzip -9c "out/$f.json" > "$DIR/out/$f.json.gz"; done
          node -e '
            const fs=require("fs"),z=require("zlib");const m={updated_at:new Date().toISOString(),run:process.env.RUN_URL,files:{}};
            for(const f of ["out/campground-social.json.gz","out/campground-web.json.gz"]){const p=process.argv[1]+"/"+f;if(!fs.existsSync(p))continue;
              const j=JSON.parse(z.gunzipSync(fs.readFileSync(p)));const c=j.campgrounds??{};m.files[f]={campgrounds:Object.keys(c).length,bytes:fs.statSync(p).size};}
            fs.writeFileSync(process.argv[1]+"/MANIFEST.json",JSON.stringify(m,null,1));' "$DIR"
          cp ../docs/COLLECTED_DATA.md "$DIR/README.md" 2>/dev/null || true
          cd "$DIR" && git add -A
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore(collected): social·web mention caches $(date -u +%Y-%m-%dT%H:%MZ)"
          if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend -m "$MSG"; else git commit -q -m "$MSG"; fi
          git push -q --force origin collected-data
          cat MANIFEST.json; du -sh --exclude=.git .
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish collected web mentions to the site now (incremental)
        # 수집 직후 최신 main 데이터에 새 글만 덧붙이고 파생 정보를 다시 계산해 바로 커밋한다(실행 끝까지 기다리지 않음).
        # 커버리지가 줄면 커밋하지 않는다. 사이트는 main 푸시로 곧바로 다시 배포된다.
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/publish-incremental.sh "Naver web mentions" --web out/campground-web.json
      - name: Sync rest areas and drowsy shelters
        continue-on-error: true
        run: npm run sync:rest-stops
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
      - name: Collect nearby context (TourAPI tourism/food, OSM marts/fuel/medical, rest stops)
        # TourAPI는 콘텐츠 유형별 대량 페이지(7일 캐시), Overpass는 0.5° 타일(14일 캐시, 타일 단위로 이어서)로 모은다.
        run: npm run sync:nearby
        continue-on-error: true
        timeout-minutes: 20
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NEARBY_TOUR_MAX_CALLS: ${{ steps.source-plan.outputs.nearby_calls }}
          NEARBY_OSM_TIME_BUDGET_MS: '480000'
      - name: Discover free public camp sites (candidates only)
        if: steps.source-plan.outputs.collect_free == 'true'
        continue-on-error: true
        run: npm run discover:public-free
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Collect official fee notes (TourAPI) and match to GoCamping
        # 관광공사에 운영자가 등록한 안내 요금·예약 안내 문구. 하루 호출 한도 안에서 캐시로 나눠 채운다.
        if: steps.source-plan.outputs.collect_tour == 'true'
        run: npm run sync:tour-fees
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          TOUR_DAILY_CAP: ${{ steps.source-plan.outputs.fee_calls }}
      - name: Collect official products & photos (TourAPI stay/campsite) and match to GoCamping
        # 관광공사 숙박(32)·야영장(28) 객실/사이트 상품·공식 등록 기준가·공식 사진. 하루 상한 안에서 캐시로 나눠 채운다.
        if: steps.source-plan.outputs.collect_tour == 'true'
        run: npm run sync:tour-products
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PRODUCT_MAX_CALLS: ${{ steps.source-plan.outputs.product_calls }}
      - name: Collect Seoul public reservation status (camping)
        # 서울시·자치구 공영 캠핑장 예약 상품의 접수 상태·접수 기간(서울 열린데이터광장). 키 없으면 건너뜀.
        run: npm run sync:seoul-yeyak
        continue-on-error: true
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
      - name: Collect campground licences (LOCALDATA) and match to GoCamping
        # 키 불필요. 고캠핑에 없는 숨은 캠핑장 후보, 인허가 폐업인데 고캠핑에 남은 곳, 시설 규모 등 인허가 세부 정보.
        run: npm run sync:localdata-campgrounds
        continue-on-error: true
      - name: Migrate PostgreSQL and import the full source snapshot
        # PR에서는 운영 DB에 절대 쓰지 않는다. PostgreSQL schema verification
        # workflow가 별도 임시 DB에서 마이그레이션·중복 적재를 검증한다.
        # DATABASE_URL이 없으면 Pages 데이터 발행은 계속하되 DB 적재 성공으로
        # 표기하지 않는다.
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=PostgreSQL import skipped::DATABASE_URL secret is not configured."
            exit 0
          fi
          npm run db:migrate
          npm run db:import-gocamping
          npm run db:import-context
          npm run db:import-licences
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ vars.DATABASE_SSL }}
      - name: Load today's real files into a throwaway PostgreSQL (twice)
        # 고정 표본 검증(database-verify.yml)이 못 잡는 실데이터 문제(중복 키·범위 밖 값 등)를 운영 DB 전에 잡는다.
        if: always()
        run: |
          if [ ! -f out/campgrounds.json ]; then echo "::notice::고캠핑 결과가 없어 실데이터 DB 검증을 건너뜁니다."; exit 0; fi
          npm run db:migrate
          for _ in 1 2; do
            npm run db:import-gocamping
            npm run db:import-context
            npm run db:import-licences
          done
          psql "$DATABASE_URL" -At -c "SELECT 'campgrounds=' || count(*) FROM campground" \
            -c "SELECT 'toilets=' || count(*) || ' located=' || count(latitude) FROM public_toilet" \
            -c "SELECT 'road_stops=' || count(*) FROM road_stop" \
            -c "SELECT 'licence_candidates=' || count(*) || ' matched=' || count(matched_campground_id) FROM campground_candidate WHERE discovery_method = 'LOCALDATA_LICENCE'" \
            -c "SELECT 'booking_events=' || count(*) FROM booking_rule_event"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build and publish the refreshed public catalog and explorer
        # 생성물은 마지막에 한 번만 커밋한다. 중간에 catalog를 먼저 push하면 장시간 주변 정보
        # 수집 중 들어온 main 변경과 비FF 충돌해 explorer 발행이 실패할 수 있다.
        if: always()
        run: |
          npm run build:explore
          # 서울 Open API가 응답한 경우에만 짧은 TTL의 공식 접수 상태를 붙인다.
          # 원천이 없거나 실패하면 직전 상태 파일을 보존하되, 화면은 expires_at 이후 이를 무시한다.
          if [ -s out/seoul-yeyak.json ]; then npm run build:availability; else echo "::notice::서울 공공예약 원천이 없어 상태 파일을 새로 만들지 않습니다."; fi
          cd .. && node scripts/publish-explorer-pages.mjs
          # 공개 카탈로그의 현장 조건을 같은 추출 규칙(survey-extractor)으로 다시 계산한다.
          # 이 단계를 빼면 다음 동기화가 전수조사 등급(SURVEYED/CONFIRMED)과 파일럿 VERIFIED 구분을 잃는다.
          node pipeline/scripts/survey-all-campgrounds.mjs
          # 운영자 자체 홈페이지 문장(registry/operator-site-snippets.json)에서 전력 W·주차·불멍·차박 배지 사실을 붙인다.
          node pipeline/scripts/build-operator-facts.mjs
          # 운영자 공지·공식 소개·후기 요약에서 이용 정보 스펙(입·퇴실, 얼리/레이트, 매너타임, 추가 요금, 할인 등)을 정리한다.
          node pipeline/scripts/build-spec-sheet.mjs
          # 후기 요약에서 장점·단점 한 줄(건수 포함)을 만들고, 홈 썸네일(featured.json)에 배지·장단점을 붙인다.
          node pipeline/scripts/build-review-digest.mjs
          # 주변 인허가 데이터(편의점·마트·정육점·주유소·약국·동물병원)를 카탈로그와 상세에 반영한다.
          node pipeline/scripts/build-nearby-facts.mjs
          # 모든 원천을 18개 항목 프로필로 합치고, 확인된 값만으로 한 줄 요약·분류 태그를 만든다.
          node pipeline/scripts/build-campground-profiles.mjs
          # 1박 요금 및 사이트 단서를 집계하여 campgrounds.json에 주입한다.
          node pipeline/scripts/build-site-pricing-facts.mjs
          # 업장별 사이트·상품 타입(일반·오토·데크·복층 데크·타프존·글램핑·카라반·캠핑카·숙박동·차박·반려견 전용 등)을 근거와 함께 붙인다.
          node pipeline/scripts/build-site-types.mjs
          # 업장 정보 커버리지(요금·입퇴실·매너타임·주차·전기 W·사이트 타입 등, 목표 2,500곳)를 meta.json에 남긴다.
          node pipeline/scripts/report-coverage.mjs
          # 모든 원천을 (캠핑장·속성·값·등급·원천·근거) 원자 사실로 풀어 묶음별 NDJSON(data/facts)으로 쓴다. 여러 에이전트의 공유 원장.
          node pipeline/scripts/build-fact-store.mjs
          # PR은 생성만 검사한다. main은 catalog·explorer를 원자적으로 갱신한다.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR에서는 공개 생성물을 커밋하지 않습니다."; exit 0
          fi
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 실행 시작 시점 코드·일부만 복원된 캐시로 만든 결과가 최신 데이터를 줄이면 발행하지 않는다(2026-10-19 후기 2,686→1,272 사고 방지).
          git fetch -q origin main && git show origin/main:camping-atlas/public/explore/data/meta.json > "$RUNNER_TEMP/base-meta.json"
          node pipeline/scripts/coverage-guard.mjs "$RUNNER_TEMP/base-meta.json" camping-atlas/public/explore/data/meta.json
          git add camping-atlas/public/data camping-atlas/public/explore data/facts pipeline/registry/naver-usage.json
          if git diff --cached --quiet; then
            echo "공개 데이터 변경 없음."; exit 0
          fi
          git commit -m "chore(data): refresh public camping catalog and explorer"
          # 오래 실행되는 수집 중 main이 전진할 수 있다. 이 커밋은 생성물만 담는다.
          # 주의: rebase에서 -X ours는 "main 쪽"을 뜻해, 겹치는 생성물(meta.json 등)이 이전 실행 결과로
          # 되돌아가고 새 데이터와 섞인다(2026-10-13 후기·영상 반영 누락 원인). 생성물 충돌은
          # 방금 만든 최신 결과(-X theirs = 재배치되는 이 커밋)를 우선한다.
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY || secrets.KAKAO_JS_KEY }}
          MEDIA_DIR: ${{ steps.media.outputs.dir }}
          GISCUS_CONFIG: ${{ vars.GISCUS_CONFIG }}
      - name: Load the fact store into the throwaway PostgreSQL (twice)
        # data/facts(원자 사실)가 db/011 제약(확정 등급은 원천 URL 필수 등)을 지키는지 실데이터로 확인한다.
        if: always()
        run: |
          if [ ! -f ../data/facts/manifest.json ]; then echo "::notice::사실 저장소가 없어 건너뜁니다."; exit 0; fi
          npm run db:migrate
          node scripts/import-facts-postgres.mjs
          node scripts/import-facts-postgres.mjs
          psql "$DATABASE_URL" -At -c "SELECT 'facts=' || count(*) || ' campgrounds=' || count(DISTINCT external_campground_id) FROM campground_fact"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-out
          path: pipeline/out/
          retention-days: 14
