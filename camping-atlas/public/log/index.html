<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>운영 기록 · 모여라캠핑</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; background: #f6f5f1; color: #1c1b18; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #fff; border-bottom: 1px solid #e6e2d8; }
  header a { color: #3d3a9c; text-decoration: none; font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { margin: 0 0 6px; font-size: 1.4rem; }
  .muted { color: #6b675f; font-size: .9rem; }
  .warn { background: #fff6e5; border: 1px solid #f0d9a0; border-radius: 10px; padding: 14px 16px; margin: 16px 0; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  .stat { background: #fff; border: 1px solid #e6e2d8; border-radius: 12px; padding: 12px 14px; min-width: 120px; }
  .stat b { display: block; font-size: 1.3rem; }
  .tabs { display: flex; gap: 8px; margin: 12px 0; }
  .tabs button { border: 1px solid #ddd; background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  .tabs button.on { background: #1c1b18; color: #fff; border-color: #1c1b18; }
  .tools { display: flex; gap: 8px; margin: 8px 0 14px; }
  .tools input { flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; font: inherit; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: .9rem; vertical-align: top; }
  th { background: #faf9f6; font-weight: 700; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #faf9f6; }
  .add { color: #1a7f37; font-weight: 700; }
  .remove { color: #b42318; font-weight: 700; }
  .empty { padding: 40px; text-align: center; color: #6b675f; }
  a.camp { color: #3d3a9c; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <strong>모여라캠핑 · 운영 기록</strong>
  <a href="../explore/">← 사이트로</a>
</header>
<main>
  <h1>운영 기록</h1>
  <p class="muted">찜·댓글을 한곳에서 보고, 행을 누르면 해당 캠핑장으로 이동합니다.</p>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button type="button" class="on" data-tab="saves">찜 기록</button>
    <button type="button" data-tab="comments">댓글 기록</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="업장·내용·IP 검색" aria-label="기록 검색">
  </div>
  <div id="status"></div>
  <div id="table"></div>
</main>
<script>
const SB = {
  url: "https://zgnetdxqzsnmzdvoxzbw.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnbmV0ZHhxenNubXpkdm94emJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMjUzMzIsImV4cCI6MjEwNzcwMTMzMn0.ZMsY5TT2LVTOFctHxSB7IiAuCCR3VKvX2-Y7PDdrO88"
};
const headers = { apikey: SB.key, Authorization: `Bearer ${SB.key}` };
const campUrl = (id) => `../explore/#/c/${encodeURIComponent(id)}`;
let tab = "saves", saves = [], comments = [], names = new Map();

async function loadNames() {
  try {
    const r = await fetch("../explore/data/campgrounds.json");
    const camps = await r.json();
    names = new Map(camps.map((c) => [String(c.id), c.name]));
  } catch {}
}
function nameOf(id) { return names.get(String(id)) || id; }
function when(s) { try { return new Date(s).toLocaleString("ko-KR"); } catch { return s; } }

async function load() {
  const status = document.getElementById("status");
  status.textContent = "불러오는 중…";
  await loadNames();
  const [sr, cr] = await Promise.all([
    fetch(`${SB.url}/rest/v1/save_log?select=created_at,action,campground_id,ip,language,timezone,screen,platform,user_agent&order=created_at.desc&limit=200`, { headers }),
    fetch(`${SB.url}/rest/v1/campground_comment?select=id,campground_id,nickname,content,created_at,is_deleted&order=created_at.desc&limit=200`, { headers }),
  ]);
  saves = sr.ok ? await sr.json() : [];
  comments = cr.ok ? await cr.json() : [];
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${saves.length}</b><span class="muted">찜 기록</span></div>
    <div class="stat"><b>${saves.filter((x) => x.action === "add").length}</b><span class="muted">찜</span></div>
    <div class="stat"><b>${comments.filter((x) => !x.is_deleted).length}</b><span class="muted">댓글</span></div>
    <div class="stat"><b>${new Set(saves.map((x) => x.ip).filter(Boolean)).size}</b><span class="muted">접속 IP</span></div>`;
  status.textContent = "";
  render();
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("table");
  if (tab === "saves") {
    const rows = saves.filter((x) => !q || `${nameOf(x.campground_id)} ${x.campground_id} ${x.ip} ${x.user_agent}`.toLowerCase().includes(q));
    if (!rows.length) { box.innerHTML = `<div class="empty">찜 기록이 없습니다.</div>`; return; }
    box.innerHTML = `<table><thead><tr><th>시각</th><th>동작</th><th>업장</th><th>IP</th><th>기기</th></tr></thead><tbody>${rows.map((x) => `<tr class="clickable" data-href="${campUrl(x.campground_id)}">
      <td>${when(x.created_at)}</td>
      <td class="${x.action === "add" ? "add" : "remove"}">${x.action === "add" ? "찜" : "해제"}</td>
      <td><a class="camp" href="${campUrl(x.campground_id)}">${nameOf(x.campground_id)}</a></td>
      <td>${x.ip || "-"}</td>
      <td>${x.platform || ""} ${x.screen || ""}<br><span class="muted">${(x.user_agent || "").slice(0, 80)}</span></td>
    </tr>`).join("")}</tbody></table>`;
  } else {
    const rows = comments.filter((x) => !q || `${nameOf(x.campground_id)} ${x.nickname} ${x.content}`.toLowerCase().includes(q));
    if (!rows.length) { box.innerHTML = `<div class="empty">댓글이 없습니다.</div>`; return; }
    box.innerHTML = `<table><thead><tr><th>시각</th><th>업장</th><th>작성자</th><th>내용</th><th>상태</th></tr></thead><tbody>${rows.map((x) => `<tr class="clickable" data-href="${campUrl(x.campground_id)}">
      <td>${when(x.created_at)}</td>
      <td><a class="camp" href="${campUrl(x.campground_id)}">${nameOf(x.campground_id)}</a></td>
      <td>${x.nickname || "-"}</td>
      <td>${(x.content || "").slice(0, 120)}</td>
      <td>${x.is_deleted ? "삭제" : "게시"}</td>
    </tr>`).join("")}</tbody></table>`;
  }
  box.querySelectorAll("tr.clickable").forEach((tr) => tr.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    location.href = tr.dataset.href;
  }));
}
document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("on", x === b));
  render();
}));
document.getElementById("q").addEventListener("input", render);
load();
</script>
</body>
</html>
