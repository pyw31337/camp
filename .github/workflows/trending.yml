name: Trending mentions

# 홈 ‘실시간 인기’: 최근 7일 블로그·카페·뉴스·동영상 글의 캠핑장 언급 순위 → camping-atlas/public/context/trending.json
# 무료 한도 안에서만 호출한다(docs/TRENDING.md): Daum 검색 종류별 실행당 최대 blog 3,000 · cafe 3,000 · vclip 800
# (일 한도 종류별 20,000~30,000), 네이버 검색 실행당 최대 1,500(일 25,000 · 월 상한은 Data sync와 공용).
# Data sync(03:17 KST)와 겹치지 않게 22:47 KST에 돈다 — 카카오·네이버 일 한도가 자정에 새로 차므로 서로의 하루치를 쓰지 않는다.
on:
  schedule:
    - cron: "47 13 * * *" # 매일 22:47 KST
  workflow_dispatch:
  pull_request:
    paths:
      - "pipeline/lib/trending*.mjs"
      - "pipeline/scripts/sync-trending.mjs"
      - ".github/workflows/trending.yml"

permissions:
  contents: write

concurrency:
  group: trending-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and rank (PR는 호출 없이 저장된 글로만)
        working-directory: pipeline
        env:
          KAKAO_REST_API_KEY: ${{ github.event_name != 'pull_request' && secrets.KAKAO_REST_API_KEY || '' }}
          NAVER_API_HUB_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.NAVER_API_HUB_CLIENT_ID || '' }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.NAVER_API_HUB_CLIENT_SECRET || '' }}
          TRENDING_DRY: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/sync-trending.mjs
      - name: Check output
        run: node -e 'const x=JSON.parse(require("fs").readFileSync("camping-atlas/public/context/trending.json"));console.log("date",x.date,"top",x.top.length,"posts",x.totals.posts);if(!Array.isArray(x.top))process.exit(1)'
      - name: Commit (main only)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camping-atlas/public/context/trending.json pipeline/registry/trending-posts.json pipeline/registry/trending-usage.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "chore(data): refresh trending mentions"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
