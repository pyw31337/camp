name: Quality supervisor

on:
  schedule:
    # 수집 작업과 겹치지 않는 시간에 하루 한 번 읽기 전용 점검
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: letscamp-quality-supervisor
  cancel-in-progress: false

jobs:
  audit:
    name: Audit workflows and published data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Run read-only data sanity checks
        id: sanity
        continue-on-error: true
        run: |
          mkdir -p quality-supervisor
          node pipeline/scripts/publish-sanity.mjs --check > quality-supervisor/publish-sanity.log 2>&1
          node pipeline/scripts/apply-value-sanity.mjs --check --baseline pipeline/registry/value-sanity-baseline.json > quality-supervisor/value-sanity.log 2>&1

      - name: Inspect recent workflow failures
        id: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p quality-supervisor
          gh api "repos/${{ github.repository }}/actions/runs?branch=main&per_page=100" > quality-supervisor/workflow-runs.json
          node <<'NODE'
          const fs = require('node:fs');
          const runs = JSON.parse(fs.readFileSync('quality-supervisor/workflow-runs.json', 'utf8')).workflow_runs || [];
          const since = Date.now() - 24 * 60 * 60 * 1000;
          const failures = runs.filter(r => r.conclusion === 'failure' && Date.parse(r.updated_at || r.created_at) >= since);
          const byWorkflow = {};
          for (const r of failures) (byWorkflow[r.name] ||= []).push({id:r.id, run:r.run_number, url:r.html_url});
          const report = { generated_at: new Date().toISOString(), failures_last_24h: failures.length, by_workflow: byWorkflow };
          fs.writeFileSync('quality-supervisor/workflow-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          // 한 번의 외부 timeout이 아니라 같은 워크플로의 반복 실패만 감독 실패로 판정한다.
          const repeated = Object.values(byWorkflow).some(rows => rows.length >= 2);
          if (repeated) process.exitCode = 1;
          NODE

      - name: Write supervisor summary
        if: always()
        run: |
          {
            echo "## 품질 감독 결과"
            echo
            echo "- 데이터 상식 검사: ${{ steps.sanity.outcome }}"
            echo "- 최근 24시간 워크플로 반복 실패 검사: ${{ steps.workflows.outcome }}"
            echo
            echo "실패가 한 번뿐인 외부 timeout·취소는 경고로만 기록하고, 같은 작업이 반복 실패할 때만 조치 대상으로 표시합니다."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-supervisor-report
          path: quality-supervisor/
          retention-days: 14

      - name: Fail only on repeated failures or sanity regressions
        if: steps.sanity.outcome == 'failure' || steps.workflows.outcome == 'failure'
        run: |
          echo "::error::반복 실패 또는 발행 데이터 상식 회귀가 감지되었습니다. artifact의 감독 보고서를 확인하세요."
          exit 1
