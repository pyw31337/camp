name: Web quality

on:
  pull_request:
    paths:
      - "camping-atlas/**"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "camping-atlas/**"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camping-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: camping-atlas/package-lock.json
      - run: npm run install:ci
      - run: npm run lint
      - run: npm run build
