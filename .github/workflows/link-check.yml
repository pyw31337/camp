name: Link check

# 화면에 보이는 예약·홈페이지 링크가 살아 있는지 주 1회 확인한다(소유자 2026-10-20: 깨진 예약 링크).
# robots.txt 준수·봇 이름 공개·호스트별 1초 간격. 네이버 예약·지도·블로그·카페, 카카오맵, 캠핏, 인스타그램처럼
# 자동 접근을 막은 곳은 열지 않는다(UNVERIFIED). 외부 API·유료 호출 없음.
# 결과(registry/link-health.json) → build-link-health.mjs가 c.dl로 표시 → 화면 버튼에서 뺀다(증분 발행으로 바로 반영).
on:
  schedule:
    # 매주 수요일 04:17 KST
    - cron: "17 19 * * 2"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "이 일수 안에 OK였던 링크는 건너뜀 (기본 7)"
        required: false
        default: "7"
      verify_max_age_days:
        description: "예약 링크 정밀 검수: 이 일수 안에 판정한 쌍은 건너뜀 (기본 14, 0이면 전부 다시)"
        required: false
        default: "14"

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}  # land-on-main.sh (gh)

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: node --test test/link-check.test.mjs test/card-fallback.test.mjs test/booking-verify.test.mjs
      - name: Check links
        run: node scripts/check-links.mjs --max-age-days "${{ github.event.inputs.max_age_days || '7' }}"
      # 예약 링크 정밀 검수(소유자 2026-10-23: 404만이 아니라 ‘열린 페이지가 정말 그 업장 예약인지’).
      # 업장 이름·전화·주소 확인, 다른 업장·도메인 판매·서비스 종료(modoo!)·도박 사이트·옛 예약 엔진 주소 → registry/booking-verify.json
      - name: Install Chromium (render script-drawn booking pages)
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      # 공용 예약 사이트(숲나들e·국립공원) 업장 목록 갱신 → 예약 버튼을 메인 대신 업장 페이지로(build-portal-links.mjs)
      - name: Refresh public booking portal directory
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/sync-portal-directory.mjs
      - name: Verify booking links belong to the camp
        continue-on-error: true
        timeout-minutes: 120
        run: node scripts/verify-booking-links.mjs --max-age-days "${{ github.event.inputs.verify_max_age_days || '14' }}"
      # 후기 글·사진 내용 판정(AI)은 2026-10-30부터 매일 도는 content-judge.yml로 옮겼다(새 후기가 7일 동안 판정 없이 나가지 않게).
      # 카드 대체 사진 고르기(pick-card-fallback)는 여전히 CLIP을 쓴다.
      - name: Install photo judge (transformers.js)
        continue-on-error: true
        run: npm i --no-save @huggingface/transformers@3.8.1
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache/hf
          key: hf-clip-vit-base-patch32-v1
      # 공식 사진이 없는 곳의 카드 사진: 상세의 검색 썸네일(130px)을 잠깐 받아 배치도·안내판·야간 사진과 음식·인물 사진을 거른다(저장 없음).
      - name: Pick card photos for places without official photos
        continue-on-error: true
        run: node scripts/pick-card-fallback.mjs
      - name: Commit registry
        if: always()
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f registry/link-health.json ] || exit 0
          git add registry/link-health.json
          [ -f registry/booking-verify.json ] && git add registry/booking-verify.json
          [ -f registry/portal-directory.json ] && git add registry/portal-directory.json
          [ -f registry/card-fallback.json ] && git add registry/card-fallback.json
          [ -f registry/photo-judgments.json ] && git add registry/photo-judgments.json
          if git diff --cached --quiet; then echo "변경 없음."; exit 0; fi
          git commit -m "chore(data): refresh link health"
          bash "$GITHUB_WORKSPACE/.github/scripts/land-on-main.sh" link-check
      - name: Publish to the site now (incremental)
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/publish-incremental.sh "link health"
