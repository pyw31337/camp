name: Weekly forecast

# 캠핑장별 주간 날씨(단기 오늘~3일 + 중기 4~10일, 특보·미세먼지 보조) 수집. 하루 2회, 각 서비스 무료 일일 한도 안에서만 부른다.
# 공공데이터포털 인증키(DATA_GO_KR_SERVICE_KEY) 하나로 부르지만 서비스마다 활용신청이 따로 필요하다(docs/WEEKLY_FORECAST.md).
# 키가 없거나 활용신청 전인 서비스는 건너뛰고(로그에 사유) 실패로 처리하지 않는다.
on:
  schedule:
    - cron: "40 20 * * *" # 05:40 KST (05시 단기예보 발표 뒤)
    - cron: "40 8 * * *"  # 17:40 KST (17시 단기예보 발표 뒤)
  workflow_dispatch:
    inputs:
      rebuild_mapping:
        description: "측정소·조석 지점 대응표를 다시 만들기(활용신청 직후 1회)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "pipeline/lib/conditions.mjs"
      - "pipeline/lib/astro.mjs"
      - "pipeline/lib/kma-grid.mjs"
      - "pipeline/lib/trip-extras.mjs"
      - "pipeline/scripts/sync-forecast.mjs"
      - "pipeline/scripts/build-condition-mapping.mjs"
      - "camping-atlas/public/conditions/**"
      - ".github/workflows/conditions-sync.yml"

permissions:
  contents: write

concurrency:
  group: conditions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Which data.go.kr services are registered (never prints the key)
        run: node scripts/check-data-go-kr.mjs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Build campground ↔ station mapping when stations are missing
        run: |
          # PR에서는 대응표 스크립트가 바뀐 때만 다시 만든다(측정소·조석 지점 조회가 data.go.kr 지연 시 수십 분 걸림).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --quiet "origin/${{ github.base_ref }}" -- scripts/build-condition-mapping.mjs 2>/dev/null; then echo "PR: 대응표 유지"; exit 0; fi
          fi
          if [ "${{ inputs.rebuild_mapping }}" = "true" ] || [ "${{ github.event_name }}" = "pull_request" ] || ! grep -q '"with_air":[1-9]' registry/condition-mapping.json; then
            node scripts/build-condition-mapping.mjs
          else
            echo "대응표 유지"
          fi
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - name: Collect weekly forecast
        run: node scripts/sync-forecast.mjs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          # PR 검증에서는 단기예보를 격자 20곳만 불러 응답 형태를 확인한다.
          CONDITIONS_SHORT_MAX: ${{ github.event_name == 'pull_request' && '20' || '1800' }}
      - name: Keep the dry-run output (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: conditions-dry-run
          path: |
            camping-atlas/public/conditions/forecast.json
            pipeline/registry/condition-mapping.json
          retention-days: 7
      - name: Commit (main only)
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camping-atlas/public/conditions pipeline/registry/condition-mapping.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "chore(data): refresh weekly forecast"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
