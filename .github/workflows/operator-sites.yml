name: Operator homepage facts

# (0) 카카오 공식 API로 홈페이지가 없거나 죽은 곳의 운영자 홈페이지를 찾고,
# 운영자 자체 홈페이지(고캠핑 등록 홈페이지 중 플랫폼이 아닌 곳 + 발굴 홈페이지)에서 이용 안내 문장을 주 1회 다시 읽는다.
# robots.txt 준수, 호스트별 1초 간격, 사이트당 최대 6쪽, 전문 저장 금지(문장·URL·확인 시각만).
# 결과(registry/operator-site-snippets.json)는 data-sync가 배지 사실(build-operator-facts)·스펙 시트에 쓴다.
on:
  schedule:
    # 매주 일요일 03:41 KST
    - cron: "41 18 * * 6"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "이 일수보다 오래된 확인값만 다시 읽기 (기본 14)"
        required: false
        default: "14"
      naver_max_calls:
        description: "네이버 지역 검색 호출 상한 (기본 4000, 유료 전환 시 0)"
        required: false
        default: "4000"
      kakao_max_calls:
        description: "카카오 발굴 호출 상한 (기본 8000)"
        required: false
        default: "8000"

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}  # land-on-main.sh (gh)

concurrency:
  group: operator-sites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 자바스크립트로 그리는 운영자 사이트를 읽기 위한 Chromium(렌더링 폴백)
      - run: npx playwright install --with-deps chromium
      - run: node --test test/operator-site.test.mjs test/kakao-discovery.test.mjs test/naver-discovery.test.mjs
      # 카카오 공식 API(로컬 키워드·Daum 웹 검색): 장소 맞춤 + 홈페이지 없는·죽은 곳의 운영자 홈페이지 발굴.
      # 30일 지난 곳만 다시 묻는다. 로컬·웹 검색 한도는 소셜 검색(blog·cafe·image·vclip)과 종류가 달라 겹치지 않는다.
      - name: Discover places and homepages (Kakao official API)
        continue-on-error: true
        run: node scripts/discover-kakao.mjs --max-calls "${{ github.event.inputs.kakao_max_calls || '8000' }}"
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      # 네이버 검색 API(NAVER API HUB 지역 검색, 한시 무료): 업장이 네이버에 등록한 홈페이지 링크·전화. 30일 지난 곳만.
      - name: Match Naver local places (NAVER API HUB)
        continue-on-error: true
        run: node scripts/discover-naver.mjs --max-calls "${{ github.event.inputs.naver_max_calls || '4000' }}"
        env:
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          # 유료 방지: 저장소 변수로 끄기·월 상한 조정(기본 250,000건, 무료 한도 775,000건)
          NAVER_API_ENABLED: ${{ vars.NAVER_API_ENABLED }}
          NAVER_MONTHLY_CAP: ${{ vars.NAVER_MONTHLY_CAP }}
      # 장소 맞춤 결과는 홈페이지 읽기(수십 분~수 시간)를 기다리지 않고 바로 커밋한다.
      # 읽기가 실패·취소돼도 카카오·네이버 매칭 결과는 남는다.
      - name: Commit place matches (Kakao · Naver) now
        if: always()
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in registry/kakao-places.json registry/naver-places.json registry/naver-usage.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "장소 맞춤 변경 없음."; exit 0; fi
          git commit -m "chore(data): refresh Kakao·Naver place matches"
          bash "$GITHUB_WORKSPACE/.github/scripts/land-on-main.sh" operator-sites
      - name: Install Korean OCR (tesseract) for image-only guide pages
        # 요금표·이용안내가 이미지뿐인 운영자 페이지를 읽는다(운영자 자체 이미지, robots 준수). 실패해도 OCR만 빠진다.
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor >/dev/null && tesseract --list-langs
      - name: Read operator homepages
        # 2026-10-19: 공공 예약 사이트(지자체·공단) 채널도 시작 주소, 타임아웃 20초, 글이 적은 곳은 이미지 OCR(--ocr),
        #             죽은 주소는 네이버 웹문서 검색으로 찾은 새 홈페이지(discover-naver)로 다시 시도한다.
        run: node scripts/crawl-operator-sites.mjs --concurrency 10 --render --retry-failed --ocr --max-age-days "${{ github.event.inputs.max_age_days || '14' }}"
      - name: Commit refreshed snippets
        # 읽기가 중간에 실패·취소돼도 그때까지 저장된 문장은 남긴다(크롤러는 25곳마다 파일에 저장).
        if: always()
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/operator-site-snippets.json
          for f in registry/kakao-places.json registry/naver-places.json registry/naver-usage.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "변경 없음."; exit 0; fi
          git commit -m "chore(data): refresh operator homepage snippets"
          bash "$GITHUB_WORKSPACE/.github/scripts/land-on-main.sh" operator-sites
      - name: Publish operator facts to the site now (incremental)
        # 새 문장을 기다리지 않고 바로 화면에 반영한다: 최신 main 데이터 위에서 파생 정보(스펙·프로필·요금·사이트 타입·사실 저장소)를
        # 다시 계산해 커밋한다. 커버리지가 줄면 커밋하지 않는다(scripts/publish-incremental.sh).
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/publish-incremental.sh "operator homepage facts"
