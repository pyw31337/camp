name: Daily brief mail

# 매일 아침 운영 브리핑 메일(소유자 2026-10-31): 새로 등록된 장소 · 수집량(어제 대비) · 실패한 자동 작업 · 진단.
# 본문은 pipeline/scripts/daily-brief.mjs. 보내기는 네이버 SMTP(렛츠캘린더와 같은 방식).
# 필요: Secrets NAVER_SMTP_APP_PASSWORD(네이버 메일 앱 비밀번호) · Variables NAVER_SMTP_ACCOUNT(보내는 네이버 주소), BRIEF_TO(받는 주소, 없으면 보내는 주소).
# 설정이 없으면 본문만 실행 로그에 남기고 성공으로 끝난다.
on:
  schedule:
    # 매일 07:23 KST
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mailer
        run: mkdir -p /tmp/m && cd /tmp/m && npm init -y >/dev/null && npm i nodemailer@6.9.16 pg@8.13.1 >/dev/null
      - name: Build and send the brief
        env:
          NODE_PATH: /tmp/m/node_modules
          GITHUB_TOKEN: ${{ github.token }}
          NAVER_SMTP_ACCOUNT: ${{ vars.NAVER_SMTP_ACCOUNT }}
          NAVER_SMTP_APP_PASSWORD: ${{ secrets.NAVER_SMTP_APP_PASSWORD }}
          BRIEF_TO: ${{ vars.BRIEF_TO }}
          # 사용 지표(event_log) 읽기 — 없으면 그 칸만 빠진다
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ vars.DATABASE_SSL }}
        run: |
          ln -s /tmp/m/node_modules pipeline/scripts/node_modules 2>/dev/null || true
          node pipeline/scripts/daily-brief.mjs --send --out "$RUNNER_TEMP/brief.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-brief
          path: ${{ runner.temp }}/brief.html
          retention-days: 7
