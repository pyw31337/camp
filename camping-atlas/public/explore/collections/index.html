<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠핑 컬렉션 · 모여라 캠핑</title><meta name="description" content="사진과 조건으로 둘러보는 전국 캠핑 컬렉션"><meta name="theme-color" content="#1f9d5c">
<link rel="icon" href="../../favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#1f9d5c;--f:#173f2e;--bg:#f4f5f2;--s:#fff;--s2:#eef1ec;--i:#17211c;--i2:#57635c;--line:#e1e6e0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--i)}*{box-sizing:border-box}body{margin:0;background:var(--bg);line-height:1.55;word-break:keep-all}.top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top>div,.main{max-width:1120px;margin:auto;padding:0 clamp(16px,4vw,42px)}.top>div{height:60px;display:flex;align-items:center;gap:16px}.brand{font-weight:900;font-size:1.15rem;color:var(--f);text-decoration:none}.nav{margin-left:auto;display:flex;gap:6px}.nav a{padding:7px 10px;border-radius:999px;color:var(--i2);font-size:.875rem;font-weight:750;text-decoration:none}.nav a:hover{background:var(--s)}.main{padding-top:32px;padding-bottom:64px}.eyebrow{color:var(--g);font-size:.8rem;font-weight:900;letter-spacing:.05em}.hero{padding:clamp(24px,7vw,64px);border-radius:26px;color:#f3f8f4;background:radial-gradient(circle at 78% 16%,#4aa575 0,transparent 24%),linear-gradient(135deg,#173f2e,#21583d);overflow:hidden}.hero h1{max-width:760px;margin:8px 0;font-size:clamp(2rem,6vw,4.2rem);letter-spacing:-.065em;line-height:1.1}.hero p{max-width:620px;margin:0;color:#d6e8dc}.section{margin-top:32px}.section h2{margin:0 0 12px;font-size:1.35rem;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.card{display:grid;overflow:hidden;min-height:220px;border:1px solid var(--line);border-radius:18px;background:var(--s);color:inherit;text-decoration:none}.card img,.placeholder{width:100%;height:135px;object-fit:cover;background:linear-gradient(145deg,#d3ecdd,#accab8)}.card>span{display:grid;gap:3px;padding:13px}.card b{font-size:1rem}.card small{color:var(--i2)}.tag{width:max-content;padding:3px 8px;border-radius:999px;color:#167441;background:#e5f4eb;font-size:.75rem;font-weight:800}.guide{display:grid;gap:10px}.guide article{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--s)}.step{width:2.1rem;height:2.1rem;display:grid;place-items:center;border-radius:10px;color:var(--g);background:#e5f4eb;font-weight:900}.guide h3{margin:0;font-size:1rem}.guide p{margin:4px 0 0;color:var(--i2);font-size:.92rem}.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.links a{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--f);font-size:.82rem;font-weight:800;text-decoration:none}.status{padding:18px;border:1px dashed #9ab9a6;border-radius:16px;color:var(--i2);background:var(--s)}.passport-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0}.passport-stat div{padding:13px;border-radius:14px;background:var(--s);border:1px solid var(--line)}.passport-stat b{display:block;font-size:1.6rem;color:var(--f)}.passport-stat small{color:var(--i2);font-weight:700}@media(max-width:560px){.nav a:not(:last-child){display:none}.hero{padding:28px 22px}.passport-stat{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header class="top"><div><a class="brand" href="../">△ 모여라 캠핑</a><nav class="nav"><a href="../">전국 찾기</a><a href="../collections/">컬렉션</a><a href="../guide/">예약 가이드</a><a href="../passport/">패스포트</a></nav></div></header><main class="main"><section class="hero"><span class="eyebrow">CAMP COLLECTIONS</span><h1>목적지보다 먼저,<br>떠나고 싶은 장면을 고르세요.</h1><p>발행된 전국 시설 데이터에서 사진과 운영 정보가 있는 테마를 모았습니다. 선택하면 전체 목록의 같은 조건으로 바로 이어집니다.</p></section><section class="section"><h2>지금 둘러볼 컬렉션</h2><div class="grid" id="collections"><p class="status">컬렉션을 불러오는 중입니다.</p></div></section></main><script>
const root=document.getElementById('collections');
fetch('../data/featured.json').then(r=>r.json()).then(data=>{root.replaceChildren();(data.themes||[]).forEach(t=>{const c=t.camps&&t.camps[0];const a=document.createElement('a');a.className='card';a.href='../#t='+encodeURIComponent(t.id);if(c&&c.ph){const img=document.createElement('img');img.loading='lazy';img.src='../media/'+c.ph;img.alt=c.name+' 대표 사진';a.append(img)}else{const x=document.createElement('div');x.className='placeholder';a.append(x)}const s=document.createElement('span');const tag=document.createElement('i');tag.className='tag';tag.textContent=(t.count||0).toLocaleString()+'곳';const b=document.createElement('b');b.textContent=t.label;const p=document.createElement('small');p.textContent=t.desc||'테마별 캠핑장 보기';s.append(tag,b,p);a.append(s);root.append(a)})}).catch(()=>{root.innerHTML='<p class="status">컬렉션 데이터가 준비되는 중입니다. 잠시 후 다시 시도해 주세요.</p>'});
</script></body></html>
