  :root {

    --ink: #101414; --ink-2: #4b5350; --ink-3: #747c78;

    --good: #00875a; --good-tint: #e6f6ee;
    --warn: #b26a00; --warn-tint: #fff4e0;

  .subnav { position: sticky; top: var(--head-h, 0px); z-index: 20; background: rgba(245,246,244,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }

  .sec p { margin: 0; color: var(--ink-3); font-size: .8rem; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-s); padding: 14px 16px; min-width: 0; }
  .panel h3 { margin: 0 0 10px; font-size: .92rem; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel h3 small { font-weight: 650; color: var(--ink-3); font-size: .75rem; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 980px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

  /* 요약 타일 */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow-s); display: grid; gap: 4px; min-width: 0; }
  .kpi .k { font-size: .76rem; font-weight: 750; color: var(--ink-3); }
  .kpi .v { font-size: 1.55rem; font-weight: 850; letter-spacing: -.03em; line-height: 1.15; }
  .kpi .s { font-size: .74rem; color: var(--ink-3); }
  .chg { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: .74rem; }
  .chg.up { color: var(--good); } .chg.down { color: var(--bad); } .chg.flat { color: var(--ink-3); }

  /* 상태 표시(색 + 아이콘 + 글자) */
  .st { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .st svg { width: 12px; height: 12px; fill: currentColor; }
  .st.good { color: var(--good); background: var(--good-tint); }
  .st.warn { color: var(--warn); background: var(--warn-tint); }
  .st.bad { color: var(--bad); background: var(--bad-tint); }
  .st.info { color: var(--info); background: var(--info-tint); }
  .st.muted { color: var(--ink-3); background: var(--line-2); }

  /* 진단(자동) */
  .alerts { display: grid; gap: 8px; }
  .alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--paper); }
  .alert .t { font-weight: 800; font-size: .86rem; }
  .alert .d { font-size: .8rem; color: var(--ink-2); }
  .alert.bad { border-color: #f6c9bf; background: #fffaf8; } .alert.warn { border-color: #f4dcae; background: #fffcf5; } .alert.good { border-color: #bfe6d2; background: #f8fdfa; }

  /* 표 */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; }

  .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
  .bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
  .muted { color: var(--ink-3); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: .78rem; font-weight: 750; color: var(--ink-2); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 차트 */
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid line { stroke: var(--line-2); stroke-width: 1; }
  .chart .axis text { fill: var(--ink-3); font-size: 10px; }
  .chart .lbl { fill: var(--ink-2); font-size: 10px; font-weight: 700; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: #fff; font-size: .74rem; padding: 6px 9px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transition: opacity .12s; max-width: 280px; }
  .tip.on { opacity: 1; }
  .tip b { font-weight: 850; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .74rem; color: var(--ink-2); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* 신선도 막대(누적 100%) */
  .fresh { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); min-width: 140px; gap: 2px; }
  .fresh i { display: block; height: 100%; }
  .f1 { background: #00875a; } .f7 { background: #3fae7f; } .f30 { background: #9ad4b7; } .fold { background: #e0a12e; } .fnever { background: #d93a1f; }
  .spark { display: flex; align-items: flex-end; gap: 1px; height: 26px; min-width: 120px; }
  .spark i { flex: 1; background: var(--accent-2); border-radius: 2px 2px 0 0; min-height: 1px; }
  .spark i.z { background: var(--line); }

  .hbar { display: grid; grid-template-columns: minmax(80px, 140px) 1fr auto; gap: 8px; align-items: center; font-size: .78rem; padding: 3px 0; }
  .hbar .n { color: var(--ink-2); font-weight: 750; text-align: right; min-width: 70px; }
  .hbar .bar { height: 10px; }

  .heat td.h { text-align: right; font-weight: 750; }
  .note { font-size: .76rem; color: var(--ink-3); margin-top: 8px; }
  .wf-dots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 260px; }
  .wf-dots i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .wf-dots i.success { background: var(--good); } .wf-dots i.failure { background: var(--bad); } .wf-dots i.cancelled, .wf-dots i.skipped { background: #c8ccc6; } .wf-dots i.running { background: var(--info); }
  .multi { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .mini { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; min-width: 0; }
  .mini.bad { border-color: #f6c9bf; } .mini.warn { border-color: #f4dcae; }
  .mini-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; font-size: .78rem; font-weight: 800; }
  .mini-h small { display: block; font-weight: 650; color: var(--ink-3); font-size: .7rem; }
  .mini-v { font-size: 1.05rem; font-weight: 850; letter-spacing: -.02em; }
  .mini-s { font-size: .7rem; color: var(--ink-3); }
  .cat-h { margin: 14px 0 6px; font-size: .86rem; font-weight: 850; color: var(--ink-2); }
  details.def { margin-top: 10px; font-size: .8rem; color: var(--ink-2); }
  details.def summary { cursor: pointer; font-weight: 800; }
  .err { padding: 40px 16px; text-align: center; color: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  function lineChart(points, { h = 180, unit = "", color = "var(--accent)", target = null, w = 640 } = {}) {
    if (!points.length) return `<div class="muted">이력이 아직 없습니다.</div>`;
    const W = w, H = h, pl = 46, pr = 12, pt = 10, pb = 22;
    const vals = points.map((p) => p.v).filter((v) => v != null);
    let lo = Math.min(...vals, target ?? Infinity), hi = Math.max(...vals, target ?? -Infinity);
    if (lo === hi) { lo = lo * 0.9; hi = hi * 1.1 || 1; }
    const pad = (hi - lo) * 0.08; lo = Math.max(0, lo - pad); hi += pad;
    const x = (i) => pl + (points.length === 1 ? (W - pl - pr) / 2 : (i / (points.length - 1)) * (W - pl - pr));
    const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
    const ticks = [0, 0.5, 1].map((f) => lo + (hi - lo) * f);
    const path = points.map((p, i) => (p.v == null ? null : `${x(i)},${y(p.v)}`)).filter(Boolean).join(" L");
    const id = `c${Math.random().toString(36).slice(2, 8)}`;
    const step = Math.max(1, Math.ceil(points.length / 7));
    return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" data-w="${W}" role="img" aria-label="추이 그래프">
      <g class="grid">${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
      <g class="axis">${ticks.map((t) => `<text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end">${fmt(t, t < 10 ? 2 : 0)}</text>`).join("")}
      ${points.map((p, i) => (i % step === 0 || i === points.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${p.d.slice(5)}</text>` : "")).join("")}</g>
      ${target != null ? `<line x1="${pl}" x2="${W - pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1" opacity=".5"/><text class="lbl" x="${W - pr}" y="${y(target) - 4}" text-anchor="end">목표 ${fmt(target, 2)}</text>` : ""}
      <path d="M${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map((p, i) => (p.v == null ? "" : `<circle cx="${x(i)}" cy="${y(p.v)}" r="${points.length > 20 ? 2.5 : 4}" fill="${color}" stroke="#fff" stroke-width="2"/>`)).join("")}
      <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>
      <rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" data-hit="${id}"/>
    </svg></div>`;
  }
  function bindLine(el, points, unit) {

        const i = Math.max(0, Math.min(points.length - 1, Math.round(((vx - pl) / (W - pl - pr)) * (points.length - 1))));
        const xx = pl + (points.length === 1 ? (W - pl - pr) / 2 : (i / (points.length - 1)) * (W - pl - pr));
        xh.setAttribute("x1", xx); xh.setAttribute("x2", xx); xh.setAttribute("opacity", ".6");

      });

  function barChart(items, { h = 160, unit = "", color = "var(--accent)", w = 640 } = {}) {

    const W = w, H = h, pl = 46, pr = 8, pt = 8, pb = 22;
    const vals = items.map((x) => x.v);
    const hi = Math.max(1, ...vals), lo = Math.min(0, ...vals);
    const bw = (W - pl - pr) / items.length;
    const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);

    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="막대 그래프">
      <g class="grid">${[lo, (lo + hi) / 2, hi].map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
      <g class="axis">${[lo, (lo + hi) / 2, hi].map((t) => `<text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end">${fmt(t)}</text>`).join("")}
      ${items.map((x, i) => (i % step === 0 ? `<text x="${pl + bw * i + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(x.l)}</text>` : "")).join("")}</g>
      ${items.map((x, i) => { const y0 = y(Math.max(0, x.v)), y1 = y(Math.min(0, x.v)); return `<rect x="${pl + bw * i + 1}" y="${y0}" width="${Math.max(1, bw - 2)}" height="${Math.max(1, y1 - y0)}" rx="${Math.min(4, bw / 3)}" fill="${x.v < 0 ? "var(--bad)" : color}" data-tip="<b>${esc(x.t ?? x.l)}</b><br>${fmt(x.v)}${esc(unit)}"/>`; }).join("")}

  // ── 진단: 지표·수집처·품질을 규칙으로 훑어 문제와 기회를 적는다 ──
  function diagnose(S, H) {
    const out = [];
    const m = S.metrics;

    for (const s of S.sources) {

      const stale = s.old + (linkish ? 0 : s.never), share = s.total ? stale / s.total : 0;
      const daily = ["kakao-search", "naver-search", "youtube-v2"].includes(s.id);
      if (daily && s.d1 === 0) add("bad", `${s.name}: 최근 하루 수집 0건`, `매일 도는 수집인데 어제·오늘 갱신된 곳이 없습니다. 워크플로 실행 이력(아래)·키 한도를 확인하세요.`);

      else if (x.target && x.eta_days != null && x.eta_days > 90 && x.progress < 100) add("warn", `${meta[1]}: 지금 속도로 목표까지 ${fmt(x.eta_days)}일`, `하루 +${fmt(x.rate, 1)} · 목표 ${goalText(x.target)}. 수집 범위나 호출 상한을 늘려야 기간 안에 닿습니다.`);

    }

    if (q) {
      if (q.conflicts > (m["quality.conflicts"]?.target?.max ?? 200)) add("warn", `값 충돌 ${fmt(q.conflicts)}건이 검토를 기다림`, `data/quality/review-queue.json → 원문 대조 → quality-decide.mjs로 판정. 많은 속성: ${Object.entries(S.quality.review_queue_by_attr ?? {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([a, n]) => `${a} ${n}`).join(", ")}`);

      if (weak.length) add("warn", `신뢰도 0.5 미만 속성 ${weak.length}개`, `${weak.slice(0, 5).map((a) => `${a.label ?? a.code}(${fmt(a.confidence, 2)})`).join(", ")} — 공식·운영자 원천으로 확인이 필요합니다.`);

    if (bvT && (bv.UNVERIFIED ?? 0) / bvT > 0.3) add("info", `예약 링크 ${fmt(((bv.UNVERIFIED ?? 0) / bvT) * 100, 0)}%는 자동 확인 불가`, `네이버·캠핏 등 자동 확인을 막은 플랫폼(${fmt(bv.UNVERIFIED)}쌍). 사람이 표본을 확인하거나 공식 제휴가 필요합니다.`);
    const j = S.judgments; if (j?.photos && j.photos_hidden / j.photos > 0.1) add("info", `검색 사진 ${fmt((j.photos_hidden / j.photos) * 100, 0)}%를 내용 판정으로 뺐음`, `음식·인물·글 캡처 등. 사진 원천을 공식·운영자 쪽으로 넓히면 품질이 오릅니다.`);

      fetch(`${BASE}collect-stats.json`, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(`${BASE}collect-history.json`, { cache: "no-store" }).then((r) => (r.ok ? r.json() : { days: {} })).catch(() => ({ days: {} })),
    ]);
    render(S, H);
    loadRuns();
  }

  function render(S, H) {
    const m = S.metrics, days = Object.keys(H.days ?? {}).sort();

    const aiRows = [

      ...Object.entries(AI.board ?? {}).map(([k, v]) => ({ name: `${k} 게시판 글`, engine: "data/board", what: "에이전트 공지·선점·질문", unit: "건", v, extra: "" })),

    // 수집처별

    const qc = lp("mean_confidence"), qx = lp("conflicts"), qf = lp("facts");
    $("#q-conf").innerHTML = lineChart(qc, { w: 340, h: 190, target: m["quality.confidence"]?.target?.value ?? null }); bindLine($("#q-conf"), qc, "");
    $("#q-conf2").innerHTML = lineChart(qx, { w: 340, h: 190, target: m["quality.conflicts"]?.target?.max ?? null, color: "var(--warn)" }); bindLine($("#q-conf2"), qx, "건");
    $("#q-facts").innerHTML = lineChart(qf, { w: 340, h: 190 }); bindLine($("#q-facts"), qf, "건");
  }

  // ── GitHub Actions 실행 이력(공개 API, 비로그인 시간당 60회 → 10분 캐시) ──
  const COLLECTORS = /Data sync|Shorts|Saved camps|Link check|Review|Card photos|Web quality|Content judge|Trending|Nearby|Operator|Thankq|ThankQ|Forecast|Culture|Availability|Naver|Kakao|Deploy GitHub Pages/i;
  async function loadRuns() {
    const box = $("#wf"); if (!box) return;
    const key = "mc-collect-runs";
    let runs = null;
    try { const c = JSON.parse(sessionStorage.getItem(key) || "null"); if (c && Date.now() - c.t < 600000) runs = c.runs; } catch {}
    if (!runs) {
      try {
        const pages = await Promise.all([1, 2].map((p) => fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=100&page=${p}`).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))));
        runs = pages.flatMap((p) => p.workflow_runs ?? []).map((r) => ({ name: r.name, ev: r.event, st: r.status, c: r.conclusion, at: r.run_started_at || r.created_at, up: r.updated_at, url: r.html_url }));
        try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), runs })); } catch {}
      } catch (e) { box.innerHTML = `<div class="muted">GitHub 실행 이력을 불러오지 못했습니다(${esc(e.message)}). 비로그인 API는 시간당 60회까지라 잠시 뒤 다시 해 보세요.</div>`; return; }
    }
    const byWf = new Map();
    for (const r of runs) { if (!COLLECTORS.test(r.name) || r.ev === "pull_request") continue; (byWf.get(r.name) ?? byWf.set(r.name, []).get(r.name)).push(r); }
    const rows = [...byWf].map(([name, rs]) => {
      rs.sort((a, b) => b.at.localeCompare(a.at));
      const done = rs.filter((r) => r.st === "completed" && r.c !== "cancelled" && r.c !== "skipped");
      const ok = done.filter((r) => r.c === "success").length;
      const durs = done.map((r) => (Date.parse(r.up) - Date.parse(r.at)) / 60000).filter((x) => x > 0);
      const avg = durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : null;
      const last = rs[0], lastOk = rs.find((r) => r.c === "success");
      const rate = done.length ? (ok / done.length) * 100 : null;
      return { name, rs, ok, n: done.length, rate, avg, last, lastOk };
    }).sort((a, b) => (a.rate ?? 101) - (b.rate ?? 101));
    const ago = (s) => { if (!s) return "–"; const h = (Date.now() - Date.parse(s)) / 36e5; return h < 1 ? `${Math.round(h * 60)}분 전` : h < 48 ? `${Math.round(h)}시간 전` : `${Math.round(h / 24)}일 전`; };
    box.innerHTML = `<div class="tbl-wrap"><table id="wf-tbl"><thead><tr><th data-sort>워크플로</th><th class="r" data-sort>최근 실행</th><th class="r" data-sort>성공률</th><th class="r" data-sort>평균 소요</th><th data-sort>마지막</th><th class="r" data-sort>마지막 성공</th><th>최근 실행(왼쪽이 최신)</th></tr></thead><tbody>
      ${rows.map((w) => { const k = w.rate == null ? "muted" : w.rate >= 90 ? "good" : w.rate >= 60 ? "warn" : "bad"; const lc = w.last.st !== "completed" ? "running" : w.last.c; return `<tr><td data-v="${esc(w.name)}"><b>${esc(w.name)}</b></td><td class="r num" data-v="${w.n}">${fmt(w.n)}회</td><td class="r" data-v="${w.rate ?? -1}">${badge(k, w.rate == null ? "–" : `${fmt(w.rate, 0)}%`)}</td><td class="r num" data-v="${w.avg ?? ""}">${w.avg ? `${fmt(w.avg, 0)}분` : "–"}</td><td data-v="${esc(lc)}"><a href="${esc(w.last.url)}" target="_blank" rel="noopener">${badge(lc === "success" ? "good" : lc === "failure" ? "bad" : lc === "running" ? "info" : "muted", { success: "성공", failure: "실패", running: "진행 중", cancelled: "취소", skipped: "건너뜀" }[lc] ?? lc ?? "–")}</a> <span class="muted">${ago(w.last.at)}</span></td><td class="r" data-v="${w.lastOk?.at ?? ""}">${ago(w.lastOk?.at)}</td>
        <td><div class="wf-dots">${w.rs.slice(0, 30).map((r) => { const c = r.st !== "completed" ? "running" : r.c; return `<a href="${esc(r.url)}" target="_blank" rel="noopener"><i class="${esc(c)}" data-tip="<b>${esc(r.at.slice(0, 16).replace("T", " "))}</b><br>${esc({ success: "성공", failure: "실패", running: "진행 중", cancelled: "취소", skipped: "건너뜀" }[c] ?? c)} · ${esc(r.ev)}"></i></a>`; }).join("")}</div></td></tr>`; }).join("")}
    </tbody></table></div><p class="note">최근 200번 실행(모든 워크플로) 중 수집·발행 관련만. 성공률 = 끝난 실행 중 성공 비율(취소 제외). 끊긴 수집은 ‘마지막 성공’이 오래된 줄로 찾습니다.</p>`;
    sortable($("#wf-tbl"));
  }

  $("#btn-reload").addEventListener("click", () => { try { sessionStorage.removeItem("mc-collect-runs"); } catch {} load().catch(fail); });
  const fail = (e) => { $("#root").innerHTML = `<div class="err">수집 현황을 불러오지 못했습니다(${esc(e.message)}). data-sync가 한 번 돈 뒤 다시 열어 주세요.</div>`; };
  load().catch(fail);
})();
</script>
</body>
</html>
