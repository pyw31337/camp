name: Quality supervisor

on:
  schedule:
    # 하루 2회(19:17 KST, 07:17 KST) 읽기 전용 점검 — Data sync 직후 이상 즉시 감지
    - cron: "17 10 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: letscamp-quality-supervisor
  cancel-in-progress: false

jobs:
  audit:
    name: Audit workflows and published data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Run read-only data sanity checks
        id: sanity
        continue-on-error: true
        run: |
          mkdir -p quality-supervisor
          node pipeline/scripts/publish-sanity.mjs --check > quality-supervisor/publish-sanity.log 2>&1
          node pipeline/scripts/apply-value-sanity.mjs --check --baseline pipeline/registry/value-sanity-baseline.json > quality-supervisor/value-sanity.log 2>&1

      - name: Inspect recent workflow failures and cancellations
        id: workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p quality-supervisor
          gh api "repos/${{ github.repository }}/actions/runs?branch=main&per_page=100" > quality-supervisor/workflow-runs.json
          node <<'NODE'
          const fs = require('node:fs');
          const runs = (JSON.parse(fs.readFileSync('quality-supervisor/workflow-runs.json', 'utf8')).workflow_runs || [])
            .filter(r => r.event !== 'pull_request' && r.status === 'completed');
          const since72h = Date.now() - 72 * 60 * 60 * 1000;
          const badSet = new Set(['failure', 'cancelled', 'timed_out']);
          const byWorkflowAll = {};
          for (const r of runs) {
            if (r.name === 'Quality supervisor') continue;
            (byWorkflowAll[r.name] ||= []).push(r);
          }
          const alerts = {};
          for (const [name, list] of Object.entries(byWorkflowAll)) {
            list.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            let consecutive = 0;
            for (const r of list) {
              if (badSet.has(r.conclusion)) consecutive++;
              else break;
            }
            const recentBad = list.filter(r => badSet.has(r.conclusion) && Date.parse(r.updated_at || r.created_at) >= since72h);
            // 최근 실행이 연속 2회 이상 실패/취소/타임아웃이거나, 72시간 내 2회 이상 이상이 있고 최신 실행도 성공이 아닌 경우 경보
            if (consecutive >= 2 || (recentBad.length >= 2 && list[0] && badSet.has(list[0].conclusion))) {
              alerts[name] = {
                consecutive,
                bad_72h: recentBad.length,
                latest_conclusion: list[0]?.conclusion,
                samples: recentBad.slice(0, 3).map(r => ({ id: r.id, conclusion: r.conclusion, at: r.created_at, url: r.html_url }))
              };
            }
          }
          const report = {
            generated_at: new Date().toISOString(),
            alert_workflows: Object.keys(alerts).length,
            alerts
          };
          fs.writeFileSync('quality-supervisor/workflow-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (Object.keys(alerts).length > 0) process.exitCode = 1;
          NODE

      - name: Open or resolve monitoring issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SANITY_OUTCOME: ${{ steps.sanity.outcome }}
          WF_OUTCOME: ${{ steps.workflows.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[자동감시] 데이터 파이프라인 반복 실패·취소 감지"
          OPEN_NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "${{ steps.sanity.outcome }}" = "failure" ] || [ "${{ steps.workflows.outcome }}" = "failure" ]; then
            BODY_FILE="quality-supervisor/issue-body.md"
            node <<'NODE'
          const fs = require('node:fs');
          const rep = JSON.parse(fs.readFileSync('quality-supervisor/workflow-report.json', 'utf8'));
          const lines = [
            `## 파이프라인 이상 감지 (${rep.generated_at})`,
            ``,
            `- 데이터 상식 검사: \`${process.env.SANITY_OUTCOME}\``,
            `- 워크플로 반복 실패·취소 검사: \`${process.env.WF_OUTCOME}\``,
            ``,
            `### 이상 워크플로 목록`
          ];
          for (const [name, info] of Object.entries(rep.alerts || {})) {
            lines.push(`- **${name}**: 연속 ${info.consecutive}회 / 72시간 내 ${info.bad_72h}회 (${info.latest_conclusion})`);
            for (const s of info.samples || []) lines.push(`  - [${s.conclusion}] ${s.at}: ${s.url}`);
          }
          lines.push(``, `실행: ${process.env.RUN_URL}`);
          fs.writeFileSync('quality-supervisor/issue-body.md', lines.join('\n'));
          NODE
            if [ -n "$OPEN_NUM" ]; then
              gh issue comment "$OPEN_NUM" --body-file "$BODY_FILE"
            else
              gh issue create --title "$TITLE" --body-file "$BODY_FILE"
            fi
          elif [ -n "$OPEN_NUM" ]; then
            gh issue close "$OPEN_NUM" --comment "모든 워크플로 및 상식 검사가 정상 회복되어 자동 종료합니다. (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      - name: Write supervisor summary
        if: always()
        run: |
          {
            echo "## 품질 감독 결과"
            echo
            echo "- 데이터 상식 검사: ${{ steps.sanity.outcome }}"
            echo "- 최근 72시간 워크플로 반복 실패·취소·타임아웃 검사: ${{ steps.workflows.outcome }}"
            echo
            echo "failure·cancelled·timed_out 모두 감시하며, 연속 2회 이상 이상이 발생하면 자동으로 이슈를 생성·갱신합니다."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-supervisor-report
          path: quality-supervisor/
          retention-days: 14

      - name: Fail only on repeated failures or sanity regressions
        if: steps.sanity.outcome == 'failure' || steps.workflows.outcome == 'failure'
        run: |
          echo "::error::반복 실패 또는 발행 데이터 상식 회귀가 감지되었습니다. artifact의 감독 보고서를 확인하세요."
          exit 1
