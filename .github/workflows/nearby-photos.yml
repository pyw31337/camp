name: Nearby place photos

# 상세 ‘주변시설’ 장소(편의점·마트·정육점·약국·병원·주유소·휴게소·관광지·맛집)의 실제 모습 사진을 모은다.
# 카카오 Daum 검색 API(블로그 대표 썸네일, 제목·요약에 가게 이름이 있는 글만 / 관광지·맛집은 이미지 검색)
# → registry/nearby-photos.json → 바로 화면 반영(증분 발행). 썸네일 URL·원문 링크만 저장한다(내려받기·재호스팅 없음).
# 한도: Daum 검색은 종류별 일 20,000건 무료 — 실행당 4,000건 상한(소셜 수집과 합쳐도 절반 이하). 멈추려면 저장소 변수 NEARBY_PHOTOS_ENABLED=off.
# 2026-10-19: 첫 실행 표본의 사진 정확도가 낮아(약 20%) 매일 실행을 멈추고 수동 실행만 남긴다. 화면은 로드뷰로 실제 모습을 보인다.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "카카오 검색 호출 상한 (기본 4000)"
        required: false
        default: "4000"
  # 매주 금요일 05:23 KST — 새 장소 사진 찾기 + 판독 이어서(2026-10-23 판독 켬)
  schedule:
    - cron: "23 20 * * 4"

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}  # land-on-main.sh (gh)

concurrency:
  group: nearby-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: vars.NEARBY_PHOTOS_ENABLED != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: node --test test/nearby-photos.test.mjs
      - name: Find photos for nearby places (Kakao Daum search)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NEARBY_PHOTO_MAX_CALLS: ${{ github.event.inputs.max_calls || '4000' }}
        run: node scripts/collect-nearby-photos.mjs
      # 검색 사진 판독(2026-10-23 다시 켬): 가게·건물 모습이고 시설 종류와 맞는 사진만 붙인다(lib/nearby-photo-judge.mjs). 이어서 처리.
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache/hf
          key: hf-clip-vit-base-patch32-v1
      - name: Judge nearby photos (CLIP, local CPU)
        continue-on-error: true
        timeout-minutes: 150
        run: node scripts/judge-nearby-photos.mjs
        env:
          NEARBY_JUDGE_MAX: "2500"
      - name: Commit registry
        if: always()
        run: |
          git config user.name "moyeora-camping-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f registry/nearby-photos.json ] || exit 0
          git add registry/nearby-photos.json
          if git diff --cached --quiet; then echo "변경 없음."; exit 0; fi
          git commit -m "chore(data): refresh nearby place photos"
          bash "$GITHUB_WORKSPACE/.github/scripts/land-on-main.sh" nearby-photos
      - name: Publish to the site now (incremental)
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/publish-incremental.sh "nearby place photos"
